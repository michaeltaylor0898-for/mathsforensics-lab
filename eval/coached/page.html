<title>Cold Case Coached Paper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Josefin+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: the exam paper sits on the investigator's desk. White A4-style sheet in the middle (paper typography), case navigator on the left, the coach's notebook on the right; one column on a phone. Single dark look in the Maths Forensics navy, matching the Lab. */
:root{
  --ink:#0B122C; --panel:#111a3d; --panel2:#16214b; --line:#26336a;
  --cyan:#00FCF1; --blue:#1B36FF; --text:#E8ECF8; --muted:#93a0c8;
  --good:#3DDC97; --warn:#FFC857; --bad:#FF6B7A;
  --paper:#FDFDFB; --paper-ink:#141824; --paper-rule:#D9DCE6; --paper-muted:#6B7287;
  --hl:#FFE66B; --key:#1B36FF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Josefin Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-paper:"Tinos","Times New Roman",Times,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:radial-gradient(circle at 1px 1px,rgba(0,252,241,.06) 1px,transparent 0);background-size:22px 22px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0}
.wrap{max-width:1320px;margin:0 auto}

/* top bar */
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:16px 14px;border-bottom:1px solid var(--line)}
.case h1{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,3vw,22px);margin:2px 0 0;letter-spacing:.01em}
.barR{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.modes{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.modes button{background:none;border:0;padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--blue);color:#fff}
.clock{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.clock b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.pace{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.pace.ok{background:rgba(61,220,151,.15);color:var(--good)}
.pace.slow{background:rgba(255,200,87,.15);color:var(--warn)}
.pace.idle{background:var(--panel2);color:var(--muted)}
.draftnote{margin-top:12px;font-size:13px;color:var(--warn);font-family:var(--f-mono);letter-spacing:.04em}

/* desk */
.desk{display:grid;grid-template-columns:190px minmax(0,1fr) 330px;gap:18px;margin-top:16px;align-items:start}
@media (max-width:1100px){.desk{grid-template-columns:minmax(0,1fr) 320px}.nav{grid-column:1/-1}}
@media (max-width:780px){.desk{grid-template-columns:minmax(0,1fr)}}

/* navigator */
.nav{display:grid;gap:8px;align-content:start}
@media (max-width:1100px){.nav{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.qbtn{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.qbtn[aria-current="true"]{border-color:var(--cyan);box-shadow:inset 3px 0 0 var(--cyan)}
.qbtn .n{font-family:var(--f-mono);font-weight:700;font-size:15px}
.qbtn .t{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qbtn .s{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qbtn .s.done{color:var(--good)} .qbtn .s.part{color:var(--warn)} .qbtn .s.flag{color:var(--warn)}
.finish{margin-top:6px}

/* the paper */
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:28px clamp(16px,4vw,40px) 26px;box-shadow:0 18px 40px rgba(0,0,0,.35);font-family:var(--f-paper);min-width:0}
.qhead{display:flex;gap:16px;align-items:baseline}
.qnum{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:20px;flex:none}
.prompt{font-size:18px;line-height:1.6;min-width:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.1;margin:0 1px}
.fr span:first-child{border-bottom:1.2px solid currentColor;padding:0 2px}
.eq{white-space:nowrap}
.diagram{color:var(--paper-ink);margin:12px 0 4px;max-width:340px}
.diagram svg{width:100%;height:auto;display:block}
.w{border-radius:3px;transition:background .15s}
.hlon .w{cursor:pointer}
.hlon .w:hover{background:rgba(255,230,107,.45)}
.w.mine{background:var(--hl)}
.revealed .w.key{box-shadow:inset 0 -2.5px 0 var(--key)}
.revealed .w.key.mine{background:var(--hl)}
.part{margin-top:22px;padding-top:16px;border-top:1px solid var(--paper-rule)}
.part:first-of-type{border-top:0;padding-top:0}
.plabel{font-family:var(--f-paper);font-size:18px;margin-right:6px}
.pmarks{float:right;font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:13px;margin-left:12px}
.pad{position:relative;margin-top:12px;border:1px solid var(--paper-rule);border-radius:6px;background:#fff;
  background-image:linear-gradient(var(--paper-rule) 1px,transparent 1px);background-size:100% 34px;background-position:0 33px}
.pad canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.pad .empty{position:absolute;inset:0;display:grid;place-items:center;color:#a2a8ba;font-family:var(--f-body);font-size:14px;pointer-events:none}
.padtools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-family:var(--f-body)}
.ptool{background:#EEF0F6;border:1px solid #D6DAE6;border-radius:7px;padding:4px 10px;font-size:13.5px;font-weight:600;color:var(--paper-ink)}
.ptool[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ptool.go{background:var(--blue);border-color:var(--blue);color:#fff}
.spacer{flex:1}
.sizes{display:inline-flex;gap:4px}
.size{display:inline-flex;align-items:center;gap:5px}
.size i{display:inline-block;border-radius:50%;background:currentColor}
.zoomwrap{margin-top:10px;font-family:var(--f-body)}
.ztools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:13.5px;color:var(--paper-muted)}
.zsheet{border:2px solid var(--blue);border-radius:8px;overflow:hidden;background:#fff;
  background-image:linear-gradient(transparent calc(50% - 1px),var(--paper-rule) calc(50% - 1px),var(--paper-rule) calc(50% + 1px),transparent calc(50% + 1px))}
.zsheet canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.pstatus{font-family:var(--f-body);font-size:13.5px;color:var(--paper-muted)}

/* traps checklist and the part's result, inside the paper */
.traps{margin-top:12px;border:1.5px solid #E7B931;background:#FFF8DD;border-radius:8px;padding:12px 14px;font-family:var(--f-body);color:#3d3210}
.traps h4{margin:0 0 6px;font-size:14px;letter-spacing:.02em}
.traps label{display:flex;gap:8px;align-items:flex-start;font-size:15px;margin:4px 0;cursor:pointer}
.traps input{margin-top:4px;accent-color:#1B36FF}
.result{margin-top:12px;border-radius:10px;background:var(--panel);color:var(--text);padding:14px 16px;font-family:var(--f-body)}
.rtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-weight:700;font-size:18px;padding:3px 10px;border-radius:8px;background:var(--ink);font-variant-numeric:tabular-nums}
.verdict{font-weight:600;min-width:0;flex:1 1 220px}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.assist{background:rgba(255,200,87,.15);color:var(--warn)}
.tag.cat{background:rgba(255,107,122,.15);color:var(--bad)}
.marks{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.marks li{display:grid;grid-template-columns:38px 18px minmax(0,1fr);gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.code{font-family:var(--f-mono);font-weight:700;font-size:12px;text-align:center;border-radius:5px;background:var(--ink);padding:2px 0;align-self:start}
.yes .code,.yes .mk{color:var(--good)} .no .code,.no .mk{color:var(--bad)}
.mk{font-weight:700}
.ev{grid-column:3;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev span{color:var(--text);background:var(--ink);padding:1px 5px;border-radius:4px}
.ft{font-family:var(--f-mono);font-size:10px;color:var(--cyan);border:1px solid rgba(0,252,241,.35);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.adj{display:block;font-size:12.5px;color:var(--warn)}
.callout{margin-top:10px;border-radius:0 8px 8px 0;padding:9px 12px;font-size:14.5px}
.callout h5{margin:0 0 2px;font-size:13.5px}
.callout p{margin:0}
.callout.unprot{border-left:3px solid var(--warn);background:rgba(255,200,87,.08)} .callout.unprot h5{color:var(--warn)}
.callout.cause{border-left:3px solid var(--bad);background:rgba(255,107,122,.08)} .callout.cause h5{color:var(--bad)}
.callout.fix{border-left:3px solid var(--cyan);background:rgba(0,252,241,.06)} .callout.fix h5{color:var(--cyan)}
.callout ol{margin:2px 0 0;padding-left:20px}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14.5px}
.thinking svg{width:24px;height:24px;flex:none;animation:sw 1.4s ease-in-out infinite}
@keyframes sw{50%{transform:translate(4px,-3px) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.thinking svg{animation:none}.w{transition:none}}
.err{color:var(--bad)}
.sheetfoot{margin-top:24px;padding-top:10px;border-top:1px solid var(--paper-rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:Arial,Helvetica,sans-serif;font-size:11.5px;color:var(--paper-muted)}

/* coach's notebook */
.coach{display:grid;gap:12px;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:780px){.coach{position:static}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:13.5px;letter-spacing:.03em;margin:0 0 4px}
.card .hint{font-size:13.5px}
.parttabs{display:flex;gap:4px;margin-bottom:2px}
.parttabs button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.parttabs button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.cbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:14px;font-weight:600}
.cbtn[aria-pressed="true"]{border-color:var(--hl);color:var(--hl)}
.cbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.keys{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.keys li{font-size:14px;display:grid;gap:2px}
.keys b{font-family:var(--f-paper);font-size:16px;font-weight:700}
.keys .found{color:var(--good);font-family:var(--f-mono);font-size:11px;margin-left:6px}
.keys .missed{color:var(--warn);font-family:var(--f-mono);font-size:11px;margin-left:6px}
.clues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.clues li{font-size:14.5px;border-left:2px solid var(--cyan);padding-left:10px}
.clues li i{display:block;font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--cyan)}
.checkmsg{margin-top:10px;font-size:14.5px;padding:9px 11px;border-radius:8px;background:var(--panel2)}
.checkmsg.on_track{border-left:3px solid var(--good)} .checkmsg.problem{border-left:3px solid var(--warn)}
.examnote{font-size:14.5px}
.examnote b{color:var(--warn)}

/* debrief */
.debrief{margin-top:22px}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:700px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.rmat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:700px){.rmat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rm{border-radius:10px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line)}
.rm b{font-family:var(--f-mono);font-size:20px}
.rm span{display:block;font-size:13px;color:var(--muted)}
.rm.rec{border-color:rgba(255,200,87,.5)}
.dtable{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
</style>

<div class="wrap">
<div class="bar">
  <div class="case">
    <div class="eyebrow">Cold Case B · Higher Paper 1 · non-calculator</div>
    <h1>Coached paper · Questions 1 to 5</h1>
  </div>
  <div class="barR">
    <div class="modes" role="group" aria-label="Mode">
      <button id="mCoached" aria-pressed="true">Coached</button>
      <button id="mExam" aria-pressed="false">Exam conditions</button>
    </div>
    <div class="clock" aria-live="off"><span class="eyebrow">Time</span><b id="clock">0:00</b><span class="pace idle" id="pace">STARTS WITH YOUR FIRST LINE</span></div>
  </div>
</div>
<p class="draftnote">PROTOTYPE · questions are from your paper; the mark schemes are drafts until you check them</p>

<div class="desk">
  <nav class="nav" id="nav" aria-label="Questions"></nav>
  <main class="sheet" id="sheet"></main>
  <aside class="coach" id="coach" aria-label="Coach"></aside>
</div>

<section class="card debrief" id="debrief" aria-live="polite"></section>
</div>

<script>/*MARKING_JS*/</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PARTS=MF.SCHEMES.filter(s=>s.source&&s.source.paper==='CC-B/1H');
const TOPIC_N={fracmul:'Multiplying fractions',pfd:'Prime factors',hcf:'HCF',sf:'Standard form',simlin:'Simultaneous equations',anglefacts:'Angle facts'};
const TITLES={1:'Mixed numbers',2:'Primes and HCF',3:'Standard form',4:'Simultaneous equations',5:'Isosceles angles'};
const QS=[...new Set(PARTS.map(p=>p.source.q))].map(q=>({q,parts:PARTS.filter(p=>p.source.q===q)}));
const TOTAL=PARTS.reduce((a,p)=>a+p.marks,0), MIN_PER_MARK=90/80;
const S={mode:'coached',qi:0,active:{},started:null,finished:false,tool:'pen',
  st:Object.fromEntries(PARTS.map(p=>[p.id,{clues:0,hl:new Set(),revealed:false,check:null,checking:false,trapsOpen:false,result:null,marking:false,err:'',exam:false,flag:false}]))};
QS.forEach(q=>S.active[q.q]=q.parts[0].id);

/* ---------- clock ---------- */
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function startClock(){if(!S.started){S.started=Date.now();tick()}}
function tick(){
  if(!S.started)return;
  const sec=(Date.now()-S.started)/1000; $('#clock').textContent=fmt(sec);
  const doneMarks=PARTS.filter(p=>S.st[p.id].result).reduce((a,p)=>a+p.marks,0);
  const target=doneMarks*MIN_PER_MARK*60, pace=$('#pace');
  if(!doneMarks){pace.className='pace idle';pace.textContent=`TARGET ${Math.round(TOTAL*MIN_PER_MARK)} MIN`}
  else if(sec<=target+30){pace.className='pace ok';pace.textContent='ON PACE'}
  else{pace.className='pace slow';pace.textContent=`${Math.round((sec-target)/60)||1} MIN BEHIND`}
  if(!S.finished)setTimeout(tick,1000);
}

/* ---------- writing pads (one per part) ----------
   Smooth ink: points are low-pass filtered (steadies a shaky mouse or finger) and joined with
   curves through the midpoints, at the chosen pen size. A stylus varies the width a little with
   pressure. Zoom writing: write large in a strip under the page; strokes are shrunk by Z into the
   blue box on the page. */
const PADS={},SIZES={fine:1.3,medium:2.1,bold:3.1},Z=0.4,ZH=170;
try{const v=localStorage.getItem('mf-pen');if(SIZES[v])S.size=v;S.zoom=localStorage.getItem('mf-zoom')==='1'}catch(e){}
S.size=S.size||'fine';
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2,p:(a.p+b.p)/2});
const widthAt=(s,p)=>s.erase?20:SIZES[s.size||'fine']*(s.pen?0.75+0.5*(p??.5):1);
function seg(c,s,i){const P=s.pts,a=i===1?P[0]:mid(P[i-1],P[i]),b=i===P.length-1?P[i]:mid(P[i],P[i+1]);
  c.lineWidth=widthAt(s,P[i].p);c.beginPath();c.moveTo(a.x,a.y);if(i===P.length-1)c.lineTo(b.x,b.y);else c.quadraticCurveTo(P[i].x,P[i].y,b.x,b.y);c.stroke()}
function prep(c,s){c.lineCap='round';c.lineJoin='round';if(s.erase){c.globalCompositeOperation='destination-out';c.strokeStyle='#000'}else{c.globalCompositeOperation='source-over';c.strokeStyle='#141824'}}
function stroke(s,c){const P=s.pts;if(!P.length)return;c.save();prep(c,s);
  if(P.length===1){if(!s.erase){c.fillStyle='#141824';c.beginPath();c.arc(P[0].x,P[0].y,widthAt(s,P[0].p)/2+.3,0,7);c.fill()}}
  else for(let i=1;i<P.length;i++)seg(c,s,i);c.restore()}
function addPoint(s,q){const P=s.pts,l=P[P.length-1];if(l&&Math.hypot(q.x-l.x,q.y-l.y)<0.7)return;const k=s.pen?0.6:0.38;
  P.push(l?{x:l.x+(q.x-l.x)*k,y:l.y+(q.y-l.y)*k,p:q.p}:q)}
function makePad(id,host,zhost){
  const old=PADS[id];
  const cv=document.createElement('canvas'),ctx=cv.getContext('2d'),empty=document.createElement('div');
  empty.className='empty';empty.textContent='Write your working here, one step per line';
  host.append(cv,empty);
  const pad=PADS[id]={cv,ctx,empty,strokes:old?.strokes||[],h:old?.h||250,cur:null,penSeen:false,target:old?.target||{x:12,y:12}};
  const locked=()=>S.finished||S.st[id].result;
  const zoomHere=()=>S.zoom&&!locked()&&S.active[QS[S.qi].q]===id;
  // zoom strip
  const zc=document.createElement('canvas'),zctx=zc.getContext('2d');zhost.querySelector('.zsheet').append(zc);
  const zW=()=>zc.clientWidth*Z,zHt=()=>ZH*Z;
  pad.clamp=()=>{const W=cv.clientWidth,t=pad.target;t.x=Math.max(0,Math.min(t.x,W-zW()));t.y=Math.max(0,t.y);if(t.y+zHt()>pad.h-10){pad.h=Math.ceil(t.y+zHt()+100);pad.size()}};
  pad.size=()=>{const w=host.clientWidth,d=window.devicePixelRatio||1;if(!w)return;cv.width=w*d;cv.height=pad.h*d;cv.style.height=pad.h+'px';ctx.setTransform(d,0,0,d,0,0);
    zhost.hidden=!zoomHere();if(!zhost.hidden){const zw=zhost.clientWidth;zc.width=zw*d;zc.height=ZH*d;zc.style.height=ZH+'px'}pad.redraw()};
  pad.redraw=()=>{ctx.clearRect(0,0,cv.width,cv.height);pad.strokes.forEach(s=>stroke(s,ctx));empty.hidden=pad.strokes.some(s=>!s.erase);

/* ---------- prompt words: student highlights and the key words ---------- */
function wordify(el,part){
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  let offset=0;const words=[];
  for(const n of nodes){
    const frag=document.createDocumentFragment();
    for(const tok of n.nodeValue.split(/(\s+)/)){
      if(!tok)continue;
      if(/^\s+$/.test(tok)){frag.append(tok);offset+=tok.length;continue}
      const sp=document.createElement('span');sp.className='w';sp.textContent=tok;sp.dataset.i=words.length;
      words.push({el:sp,start:offset,end:offset+tok.length});offset+=tok.length;frag.append(sp);
    }
    n.replaceWith(frag);
  }
  const text=el.textContent, st=S.st[part.id];
  (part.coach?.keyWords||[]).forEach((k,ki)=>{
    const at=text.indexOf(k.text);if(at<0)return;
    words.forEach(w=>{if(w.start<at+k.text.length&&w.end>at){w.el.classList.add('key');w.el.dataset.k=(w.el.dataset.k?w.el.dataset.k+',':'')+ki}});
  });
  words.forEach((w,i)=>{if(st.hl.has(i))w.el.classList.add('mine')});
  el.addEventListener('click',e=>{
    const w=e.target.closest('.w');if(!w||!S.hlOn||S.mode!=='coached'||st.revealed)return;
    const i=+w.dataset.i;st.hl.has(i)?st.hl.delete(i):st.hl.add(i);w.classList.toggle('mine');startClock();
    if(st.revealed)renderCoach();
  });
}
const keyFound=(part)=>{
  const st=S.st[part.id],el=document.querySelector(`[data-prompt="${part.id}"]`);if(!el)return[];
  return (part.coach?.keyWords||[]).map((k,ki)=>[...el.querySelectorAll('.w.key')].some(w=>w.dataset.k.split(',').includes(String(ki))&&st.hl.has(+w.dataset.i)));
};

let sample=null;const ready=(async()=>{sample=await window.claude?.use?.('sample')??null})();

const errMsg=e=>COPY[e?.code]||'Something went wrong. Try again.';

async function checkWork(p){
  const st=S.st[p.id];
  if(!hasInk(p.id)){st.check={status:'blank',message:'Write some working first, then check it.',line:null};renderCoach();return}
  st.checking=true;renderCoach();
  try{
    const blob=await padBlob(p.id);
    const ai=await ask(MF.CHECK_PROMPT+'\n\n'+MF.checkText(p).replace('Call record_check once.','')+'\nReply with only one JSON object matching this JSON schema:\n'+JSON.stringify(MF.CHECK_TOOL.input_schema),blob);
    st.check=MF.applyCheck(p,ai);

    if(!ai||!Array.isArray(ai.points))throw{code:'invalid_json'};
    st.result=MF.applyRules(p,ai);st.exam=S.mode==='exam';
  }catch(e){st.err=e?.code==='unavailable'?'Marking works only inside Claude. Open this page in claude.ai or the Claude app.':errMsg(e)}
  st.marking=false;
  if(QS[S.qi].parts.includes(p)){if(quiet)refreshOut(id);else renderSheet();renderCoach()}
  renderNav();
}

/* ---------- finish and debrief (the paper's own Case Debrief, filled in) ---------- */
async function finish(){
  const unmarked=PARTS.filter(p=>!S.st[p.id].result&&hasInk(p.id));
  S.finished=true;renderNav();
  if(unmarked.length){
    $('#debrief').innerHTML=`<div class="thinking">${glass}<span>Marking ${unmarked.length} answer${unmarked.length>1?'s':''}…</span></div>`;
    for(const p of unmarked){await markPart(p.id,{quiet:true})}
    renderSheet();
  }
  renderDebrief();
}
function renderDebrief(){
  if(!S.finished){$('#debrief').innerHTML=`<h2 style="font-family:var(--f-display);font-size:15px;margin:0">Case Debrief</h2><p class="hint" style="margin-top:4px">When you finish, your marks are sorted the way your Mark Recovery Log sorts them: R misread the question, M didn't know the method, A accuracy slip, T time or left blank. R, A and T marks are marks you already had the knowledge to score.</p>`;return}
  const rows=PARTS.map(p=>{const st=S.st[p.id],r=st.result,lost=r&&r.status==='marked'?r.max-r.score:p.marks;
    const cat=!r||r.status!=='marked'?'T':lost?(r.root_cause?.category||'M'):'';return{p,st,r,lost,cat,score:r&&r.status==='marked'?r.score:0}});
  const sum=f=>rows.reduce((a,x)=>a+f(x),0),got=sum(x=>x.score),by=c=>sum(x=>x.cat===c?x.lost:0);
  const rec=by('R')+by('A')+by('T'),secs=S.started?(Date.now()-S.started)/1000:0,target=TOTAL*MIN_PER_MARK*60;
  const kw=PARTS.filter(p=>S.st[p.id].revealed),kwFound=kw.reduce((a,p)=>a+keyCount(p),0),kwAll=kw.reduce((a,p)=>a+p.coach.keyWords.length,0);
  const clues=sum(x=>x.st.clues),unprot=rows.filter(x=>x.r?.unprotected).length,unprotLost=sum(x=>x.r?.unprotected?Math.max(0,(x.r.exam_board_score||0)-x.score):0);
  $('#debrief').innerHTML=`<h2 style="font-family:var(--f-display);font-size:15px;margin:0">Case Debrief</h2>
    <p class="hint" style="margin-top:4px">The numbers don't lie. ${S.mode==='exam'?'Sat under exam conditions.':'Coached run: clues and checks were available.'}</p>
    <div class="dgrid">
      <div class="stat"><b>${got}/${TOTAL}</b><span>score</span></div>
      <div class="stat"><b>${got+rec}/${TOTAL}</b><span>if R, A and T marks were recovered</span></div>
      <div class="stat"><b>${fmt(secs)}</b><span>time (target ${Math.round(target/60)} min)</span></div>
      <div class="stat"><b>${clues}</b><span>clue${clues===1?'':'s'} used${kwAll?` · key words ${kwFound}/${kwAll}`:''}</span></div>
    </div>
    <div class="rmat">
      <div class="rm rec"><b>${by('R')}</b><span>R · lost to misreading</span></div>
      <div class="rm"><b>${by('M')}</b><span>M · method not known</span></div>
      <div class="rm rec"><b>${by('A')}</b><span>A · accuracy slips</span></div>
      <div class="rm rec"><b>${by('T')}</b><span>T · time or left blank</span></div>
    </div>
    ${unprot?`<p class="hint" style="margin-top:10px;color:var(--warn)">${unprot} answer${unprot>1?'s had':' had'} no method seen.${unprotLost?` That cost ${unprotLost} mark${unprotLost>1?'s':''} here that an exam board would probably have given for a correct answer, and a wrong answer with no working scores nothing anywhere.`:''}</p>`:''}
    <div class="dtable"><table><thead><tr><th>Q</th><th>Topic</th><th>Marks</th><th>Lost to</th><th>Clues</th><th>Notes</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td class="num">${x.p.source.q}${x.p.source.part||''}</td><td>${esc(TOPIC_N[x.p.topic]||x.p.topic)}</td><td class="num">${x.r&&x.r.status==='marked'?x.score:'–'}/${x.p.marks}</td><td>${x.lost&&x.cat?x.cat:'–'}</td><td class="num">${x.st.clues||'–'}</td><td>${x.r?.root_cause?esc(x.r.root_cause.name||x.r.root_cause.explanation):x.cat==='T'?'Not attempted':x.r?.unprotected?'No method seen':''}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="cbtns"><button class="cbtn" id="again">Start again</button></div>`;
  $('#again').onclick=()=>{location.reload()};
}
function keyCount(p){return (S.st[p.id].found||[]).filter(Boolean).length}

/* ---------- modes ---------- */
function setMode(m){
  if(S.finished)return;S.mode=m;S.hlOn=false;
  $('#mCoached').setAttribute('aria-pressed',m==='coached');$('#mExam').setAttribute('aria-pressed',m==='exam');renderAll();
}
$('#mCoached').onclick=()=>setMode('coached');$('#mExam').onclick=()=>setMode('exam');

renderAll();renderDebrief();
</script>
