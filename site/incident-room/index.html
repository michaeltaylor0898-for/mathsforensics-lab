<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Incident Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred incident-room console; questions sit in a panel with a "What to do" banner; the board (teacher) view widens to 1200px. Single dark theme, projector-friendly. */
:root {
  --bg: #0B122C; --panel: #111A3B; --panel-2: #172350; --line: #2A3870;
  --cyan: #00FCF1; --blue: #1B36FF; --text: #E9EDFA; --muted: #A3AED0;
  --good: #3DDC97; --bad: #FF6B86; --amber: #FFC857;
  --display: "Josefin Sans", "Trebuchet MS", system-ui, sans-serif;
  --body: "Josefin Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; margin: 0; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 32px 32px; background-position: -1px -1px;
  color: var(--text); font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
body::after { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 75%); opacity: .85; pointer-events: none; z-index: 0; }
#app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
#app.wide { max-width: 1240px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 0; text-wrap: balance; line-height: 1.15; }
h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); }
h3 { font-size: 1.05rem; letter-spacing: .1em; }
p { margin: 0; }
a { color: var(--cyan); }
.eyebrow { font-family: var(--display); font-size: .8rem; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--cyan); }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.good, .ok { color: var(--good); }
.no { color: var(--bad); }
.cy { color: var(--cyan); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel.center, .center { align-items: center; text-align: center; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 12px 18px; font-family: var(--display); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: .98rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; color: var(--text); transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
.btn.primary:hover { background: #7ffff8; }
.btn.big { padding: 16px 24px; font-size: 1.08rem; }
.btn.quiet { background: transparent; color: var(--muted); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.btn.primary[aria-pressed] { color: var(--bg); }
.field { font: inherit; font-size: 1.15rem; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); max-width: 360px; width: 100%; }
.code-in { font-family: var(--mono); font-size: 1.7rem; letter-spacing: .25em; }
.choice { display: flex; gap: 8px; flex-wrap: wrap; }

/* brand */
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand svg { width: 48px; height: 48px; flex: none; }
.brand .name { font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 1.05rem; line-height: 1.1; }
.brand .sub { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tape { background: repeating-linear-gradient(-45deg, var(--amber) 0 14px, var(--bg) 14px 28px); height: 10px; border-radius: 2px; opacity: .9; }
.note { border-left: 3px solid var(--amber); padding: 10px 14px; background: rgba(255,200,87,.07); border-radius: 0 8px 8px 0; color: var(--muted); }

/* hud + toggles */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; letter-spacing: .04em; font-size: 1.05rem; }
.stat { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1rem; color: var(--muted); }
.stat b { color: var(--text); }
.stat.ok b { color: var(--good); } .stat.no b { color: var(--bad); }
.stat.secs { font-size: 1.3rem; color: var(--text); }
.toggles { display: flex; gap: 6px; margin-left: auto; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 6px 12px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); }

/* timer */
.timer { height: 12px; background: var(--panel-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.timer.big { height: 16px; }
.timer-fill { height: 100%; background: var(--cyan); width: 100%; transition: width 1s linear, background .3s; }
.timer-fill.low { background: var(--bad); }

/* question */
.qhead { gap: 8px; }
.tag { display: inline-block; font-family: var(--display); font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.strong { border-color: var(--cyan); color: var(--cyan); }
.brief { font-size: clamp(1.35rem, 3.6vw, 1.75rem); font-weight: 700; line-height: 1.35; }
.wide .brief { font-size: clamp(1.6rem, 3vw, 2.5rem); }
.todo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; background: rgba(0,252,241,.1); border: 2px solid var(--cyan); border-radius: 12px; padding: 14px 18px; }
.todo-k { font-family: var(--display); font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--bg); background: var(--cyan); padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.todo-t { font-size: clamp(1.1rem, 2.6vw, 1.3rem); font-weight: 700; line-height: 1.35; min-width: 0; }
.wide .todo-t { font-size: clamp(1.2rem, 2vw, 1.6rem); }
.fixline .todo-k, .bigans .todo-k { background: var(--good); }
.evidence { display: flex; flex-direction: column; gap: 10px; }
.ev { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 16px 18px; font-family: var(--mono); font-size: clamp(1.05rem, 2.8vw, 1.25rem); min-height: 60px; transition: border-color .15s; }
.wide .ev { font-size: clamp(1.2rem, 2.2vw, 1.7rem); }
button.ev:hover { border-color: var(--cyan); }
.ev .ln { font-family: var(--display); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.ev .verdict { font-family: var(--display); font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--muted); }
.ev.picked, .opt.picked { border-color: var(--cyan); background: rgba(0,252,241,.14); box-shadow: 0 0 0 2px var(--cyan) inset; }
.ev.picked .verdict { color: var(--cyan); }
.ev.tampered { border-color: var(--bad); background: rgba(255,107,134,.12); }
.ev.tampered .verdict { color: var(--bad); }
.evt { min-width: 0; }
.dist { display: block; height: 6px; margin-top: 8px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.dist span { display: block; height: 100%; background: var(--muted); }
.ev.tampered .dist span { background: var(--bad); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opts.long { grid-template-columns: minmax(0, 1fr); }
.opts.tf .opt { justify-content: center; min-height: 90px; font-size: 1.5rem; }
@media (max-width: 560px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; border: 2px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 16px 18px; min-height: 68px; font-size: clamp(1.1rem, 2.8vw, 1.3rem); font-weight: 600; min-width: 0; }
.wide .opt { font-size: clamp(1.2rem, 2.2vw, 1.7rem); }
button.opt:hover { border-color: var(--cyan); }
.opt .let { width: 36px; height: 36px; flex: none; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--bg); border: 1px solid var(--line); color: var(--cyan); }
.opt .let.num { border-radius: 50%; }
.opt.picked .let { background: var(--cyan); color: var(--bg); }
.opt .ot { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt .cnt { font-family: var(--mono); font-weight: 700; font-size: 1.2rem; }
.opt.right { border-color: var(--good); background: rgba(61,220,151,.14); }
.opt.right .let { background: var(--good); color: var(--bg); border-color: var(--good); }
.opt.dim { opacity: .5; }
.orderlist { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 8px; font-size: clamp(1.15rem, 2.4vw, 1.6rem); font-weight: 600; }
.orderlist li::marker { color: var(--good); font-weight: 700; }
.typehint { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--muted); font-size: 1.2rem; }
.bigans, .fixline { font-family: var(--mono); font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 700; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.typebox { display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--line); border-radius: 12px; padding: 16px; background: var(--bg); }
.typebox label { font-weight: 700; font-size: 1.1rem; }
.typebox .field { max-width: 300px; font-family: var(--mono); }
.sent { color: var(--good); font-weight: 600; }
.closing { color: var(--amber); font-weight: 700; font-size: 1.1rem; }
.answer { font-family: var(--mono); font-weight: 700; }
.result { border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--line); background: var(--bg); font-size: 1.1rem; }
.result.good { border-color: var(--good); } .result.bad { border-color: var(--bad); }
.rhead { font-family: var(--display); font-weight: 700; font-size: 1.4rem; letter-spacing: .06em; text-transform: uppercase; }
.result.good .rhead { color: var(--good); } .result.bad .rhead { color: var(--bad); }
.why { color: var(--text); }
.findings { border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); background: var(--bg); }
.findings.good { border-color: var(--good); } .findings.bad { border-color: var(--bad); }
.findings .head { font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.findings.good .head { color: var(--good); } .findings.bad .head { color: var(--bad); }
.promo { font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--bg); background: var(--amber); padding: 10px 18px; border-radius: 10px; font-size: 1.15rem; text-align: center; animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: scale(1); opacity: 1 } }
.gap { font-size: 1.25rem; font-weight: 700; color: var(--amber); }
.streak { display: inline-block; font-family: var(--display); font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--bg); background: var(--bad); padding: 2px 8px; border-radius: 999px; margin-left: 6px; }

/* ranks */
.rk { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.rk .chev { display: inline-flex; flex-direction: column; gap: 2px; }
.rk .chev i { display: block; width: 14px; height: 4px; background: var(--amber); clip-path: polygon(0 100%, 50% 0, 100% 100%, 85% 100%, 50% 30%, 15% 100%); }
.panel.center > .rk { font-size: 1rem; }

/* avatars */
.avatars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .avatars { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 420px) { .avatars { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.av-btn { border: 2px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--display); font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; min-width: 0; }
.av-btn span { overflow-wrap: anywhere; }
.av-btn[aria-pressed="true"] { border-color: var(--cyan); background: rgba(0,252,241,.1); }
.av { width: 60px; height: 60px; display: block; flex: none; }
.av.sm { width: 42px; height: 42px; }
.av.lg { width: 104px; height: 104px; }
.av * { transform-box: fill-box; transform-origin: center; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes scan { 0% { transform: translateY(-14px); opacity: 0 } 20%,80% { opacity: 1 } 100% { transform: translateY(14px); opacity: 0 } }
@keyframes scan2 { 0% { transform: translateY(-3px); opacity: 0 } 30%,70% { opacity: 1 } 100% { transform: translateY(3px); opacity: 0 } }
@keyframes blink { 0%,92%,100% { transform: scaleY(0) } 95% { transform: scaleY(1) } }
@keyframes flick { 0%,100% { opacity: .9 } 45% { opacity: .35 } }
@keyframes flash { 0%,80%,100% { opacity: 0 } 85% { opacity: 1 } }
@keyframes shine { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
.a-bob { animation: bob 2.4s ease-in-out infinite; } .a-scan { animation: scan 2.2s linear infinite; } .a-scan2 { animation: scan2 2.2s linear infinite; }
.a-blink { animation: blink 4s infinite; } .a-flick { animation: flick 1.8s infinite; } .a-flash { animation: flash 3s infinite; } .a-shine { animation: shine 2.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .av *, .timer-fill, .promo { animation: none !important; transition: none !important; } .a-blink { transform: scaleY(0); } }

/* lobby, teams, standings */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
button.mode:hover { border-color: var(--cyan); }
.mode .tag { align-self: flex-start; }
.joincard { border-color: var(--cyan); }
.joinpanel { flex-direction: row; flex-wrap: wrap; justify-content: space-around; align-items: center; text-align: center; gap: 24px; }
.joinurl { font-family: var(--mono); font-size: clamp(1.3rem, 3.4vw, 2.4rem); font-weight: 700; overflow-wrap: anywhere; }
.bigcode { font-family: var(--mono); font-size: clamp(3rem, 10vw, 6.5rem); font-weight: 700; letter-spacing: .12em; color: var(--cyan); line-height: 1; font-variant-numeric: tabular-nums; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.team { border: 2px solid var(--line); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; background: var(--panel-2); text-align: left; min-width: 0; }
.team[aria-pressed="true"] { border-color: var(--good); background: rgba(61,220,151,.12); }
.team .tn, .place .tn { font-family: var(--display); font-weight: 700; letter-spacing: .04em; min-width: 0; overflow-wrap: anywhere; }
.team .ts, .place .ts { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grow { flex: 1; }
.kick { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; width: 32px; height: 32px; flex: none; color: var(--muted); }
.kick:hover { border-color: var(--bad); color: var(--bad); }
.podium { display: flex; flex-direction: column; gap: 10px; }
.place { display: grid; grid-template-columns: 40px 44px auto minmax(0,1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; background: var(--panel-2); }
.place.first { border-color: var(--cyan); }
.place .pos { font-family: var(--mono); font-size: 1.3rem; font-weight: 700; color: var(--muted); }
.place .pos.small { font-size: .85rem; }
.place.first .pos { color: var(--cyan); }
.place .ts { font-size: 1.3rem; text-align: right; }
.place .ts small { font-size: .85rem; }
.move { font-family: var(--mono); font-size: .9rem; color: var(--muted); text-align: center; }
.move.up { color: var(--good); } .move.down { color: var(--bad); }
.podium .place:has(.tag) { grid-template-columns: auto auto minmax(0,1fr) auto; }
.top3 { display: flex; justify-content: center; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.step { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 120px; }
.step .tn { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-align: center; }
.step .ts { font-family: var(--mono); font-weight: 700; color: var(--cyan); }
.plinth { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px 8px 0 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.step.s1 .plinth { height: 110px; border-color: var(--cyan); color: var(--cyan); }
.step.s2 .plinth { height: 80px; } .step.s3 .plinth { height: 56px; }

/* reports */
.big { font-family: var(--mono); font-size: clamp(2.6rem, 8vw, 3.8rem); font-weight: 700; color: var(--cyan); line-height: 1; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; width: 100%; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-family: var(--mono); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar { display: grid; grid-template-columns: 120px minmax(0,1fr) 64px; gap: 12px; align-items: center; }
.bar.wide-label { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 56px; }
.bar .track { height: 12px; background: var(--panel-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.bar .fill { height: 100%; background: var(--cyan); }
.bar .n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
.misses { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
.misses li { border-left: 3px solid var(--bad); padding: 6px 0 6px 14px; display: flex; flex-direction: column; gap: 6px; }
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.medal { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 12px; opacity: .55; }
.medal.got { opacity: 1; border-color: var(--amber); background: rgba(255,200,87,.08); }
.mico { font-size: 1.8rem; color: var(--amber); line-height: 1; }
details summary { cursor: pointer; }

/* leave-the-game screen */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5,9,25,.82); padding: 16px; }
.modal-card { background: var(--panel); border: 2px solid var(--amber); border-radius: 14px; padding: 26px; max-width: 460px; display: flex; flex-direction: column; gap: 16px; color: var(--text); font-family: var(--body); }
.modal-card p { color: var(--muted); }
@media (max-width: 520px) {
  body { font-size: 17px; }
  .hud { gap: 8px 12px; justify-content: flex-start; }
  .hud .stat { font-size: .88rem; }
  .who { font-size: .95rem; }
  .iconbtn { padding: 6px 8px; }
  .iconbtn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .panel { padding: 16px; }
  .bar { grid-template-columns: 92px minmax(0,1fr) 52px; }
  .ev { grid-template-columns: minmax(0, 1fr) auto; }
  .ev .ln { grid-column: 1 / -1; }
  .place { grid-template-columns: 30px 36px auto minmax(0,1fr); }
  .place .ts { grid-column: 3 / -1; text-align: left; }
}

/* topic picker */
.tpick { display: flex; flex-direction: column; gap: 8px; }
.tpick details { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }

/* applies a tap to a pad; returns what changed */
function padAct(q, L, act, v) {
  if (act === "pick") { L.ans = v; return "ans"; }
  if (act === "seq") {
    const p = L.seq.indexOf(v);
    if (p >= 0) L.seq = L.seq.slice(0, p); else L.seq.push(v);
    L.ans = L.seq.length === q.items.length ? L.seq.slice() : null;
    return "seq";

  if (act === "seq-clear") { L.seq = []; L.ans = null; return "seq"; }

/* Ask the server before a game starts; calls go() if allowed */
async function claimGame(kind, go, back) {
  if (!gating()) return go();
  if (kind === "host" && !S.acc.signed_in) return signInToHost(back);
  if (kind === "solo" && !S.acc.signed_in) {
    const g = guestSolo();
    if (g.n >= GUEST_SOLO_LIMIT) return upgradeScreen("solo_limit", back, () => claimGame(kind, go, back));
    store.set("ir-guest-solo", { day: g.day, n: g.n + 1 });
    return go();
  }
  try {
    const { data, error } = await sb().rpc("ir_claim", { p_kind: kind });
    if (error || !data) return go();
    if (data.access) S.acc = data.access;
    if (data.ok) return go();
    upgradeScreen(data.reason, back, () => claimGame(kind, go, back));
  } catch (e) { go(); }
}

function soloSetup() {
  stopTimer(); S.pad = null;
  const cfg = withFilter(store.get("ir-solo", null), { mix: "mixed", n: 10, tier: "H", topics: [] });
  cfg.allow = soloAllow();
  if (cfg.allow) cfg.topics = cfg.topics.filter(id => cfg.allow.includes(id));
  const draw = (keep = false) => {
    const none = !poolFor(cfg).length;

      <section class="panel"><h2>Set up your cases</h2>
        ${topicPicker(cfg)}
        <span class="eyebrow">Question types</span>${choice("mix", cfg.mix, [["mixed", "Mixed (recommended)"], ["spot", "Spot the mistake only"]])}
        <span class="eyebrow">Number of questions</span>${choice("n", cfg.n, [[6, "6"], [10, "10"], [15, "15"], [20, "20"]])}
        <p class="muted small">Each question has its own time limit. You'll see an explanation after every one.</p>
        <div class="row"><button class="btn primary big" id="go" ${none ? "disabled" : ""}>Start</button><button class="btn" id="back">Back</button>${soundBtns()}</div>
      </section>`, false, keep);

    bindChoice("n", v => { cfg.n = +v; redraw(); });
    document.getElementById("back").onclick = lobby;
    document.getElementById("go").onclick = () => { saveCfg("ir-solo", cfg); Sound.unlock(); claimGame("solo", () => startSolo(cfg), soloSetup); };
  };
  draw();
}
function startSolo(cfg) {
  const qs = pickQuestions(cfg.n, cfg);
  if (!qs.length) return soloSetup();
  S.solo = { cfg, qs, perms: qs.map(n => makePerm(QUESTIONS[n])), i: 0, score: 0, correct: 0, wrong: 0, streak: 0, best: 0, results: [] };
  armGuard(() => { stopTimer(); S.solo = null; lobby(); }, "Your answers in this game won't be saved.");
  soloQ();
}
function soloQ() {
  const s = S.solo, q = QUESTIONS[s.qs[s.i]];
  s.L = freshPad(); s.phase = "q"; s.total = secsFor(q, "auto", false); s.left = s.total; s.promoted = false;
  S.pad = { L: s.L, act: (a, v) => soloAct(a, v) };
  drawSolo();
  stopTimer();
  tick = setInterval(() => {
    if (s.phase !== "q") return;
    s.left -= 1; timerUI(s.left, s.total);
    if (s.left <= 5 && s.left > 0) Sound.play("tick");
    if (s.left <= 0) soloCheck();
  }, 1000);
}
function timerUI(left, total) {
  const fill = document.querySelector(".timer-fill");
  if (fill) { fill.style.width = `${Math.max(0, left / total) * 100}%`; fill.classList.toggle("low", left <= 5); }
  const t = document.getElementById("tleft"); if (t) t.textContent = Math.max(0, left);
}
const counters = (c, w) => `<span class="stat ok">✓ <b>${c}</b></span><span class="stat no">✗ <b>${w}</b></span>`;
function soloAct(act, v) {
  const s = S.solo, q = QUESTIONS[s.qs[s.i]];
  if (s.phase === "q") {
    if (act === "check") return soloCheck();
    const r = padAct(q, s.L, act, v);
    if (r === "text") return soloCheck();
    if (r) { Sound.play("tap"); drawSolo(true); }
  } else if (s.phase === "fix" && act === "fix") {
    s.fixPick = v; s.fixOk = v === 0;
    if (s.fixOk) { s.pts += 50; s.score += 50; Sound.play("correct"); } else Sound.play("wrong");
    s.phase = "done"; drawSolo(true);
  }
}
function soloCheck() {
  const s = S.solo, q = QUESTIONS[s.qs[s.i]];
  if (s.phase !== "q") return;
  stopTimer();
  const ok = isCorrect(q, s.L.ans);
  s.ok = ok; s.pts = ok ? 100 + Math.ceil(50 * Math.max(0, s.left) / s.total) : 0;
  const before = rankIdx(s.correct, GAME_RANK_AT);
  if (ok) { s.correct += 1; s.streak += 1; s.best = Math.max(s.best, s.streak); } else { s.wrong += 1; s.streak = 0; }
  s.promoted = rankIdx(s.correct, GAME_RANK_AT) > before;
  s.score += s.pts;
  s.results.push({ q, ok, ans: s.L.ans });
  Sound.play(ok ? (s.promoted ? "promote" : "correct") : s.L.ans === null ? "noanswer" : "wrong");
  if (ok && q.type === "spot") { s.phase = "fix"; s.fixOrder = shuffle([0, 1, 2]); s.fixPick = null; }
  else s.phase = "done";
  drawSolo(true);
}
function drawSolo(keep = false) {
  const s = S.solo, q = QUESTIONS[s.qs[s.i]], perm = s.perms[s.i];
  let body = "";
  if (s.phase === "q") body = todoBanner(todoText(q, "solo")) + deviceQ(q, perm, s.L, { mode: "solo" });
  else {
    const head = s.L.ans === null ? "Time's up" : s.ok ? `Correct · +${s.pts}` : "Not this time";
    let fix = "";
    if (s.phase === "fix") fix = `<div class="findings good"><span class="head">You found the mistake</span><p>Bonus +50: which line should replace it?</p></div>
      <div class="opts long">${s.fixOrder.map(f => `<button class="opt" data-act="fix" data-v="${f}"><span class="ot">${esc(q.fixes[f])}</span></button>`).join("")}</div>`;
    else if (q.type === "spot" && s.ok) fix = `<div class="findings ${s.fixOk ? "good" : "bad"}"><span class="head">${s.fixOk ? "Fix correct · +50" : "Fix missed"}</span></div>`;
    body = `${q.type === "spot" ? boardQ(q, perm, { noCounts: true }) : ""}
      <div class="result ${s.ok ? "good" : "bad"}"><span class="rhead">${head}</span>
        ${s.ok ? "" : `<p>You said: <b>${esc(ansLabel(q, s.L.ans))}</b></p>`}
        <p>Correct answer: <span class="answer">${esc(rightLabel(q))}</span>${q.type === "spot" ? `<br>Final answer: <span class="answer">${esc(q.answer)}</span>` : ""}</p>
        <p class="why"><b>Why:</b> ${esc(q.why)}</p></div>
      ${s.promoted ? `<div class="promo">Promoted to ${RANKS[rankIdx(s.correct, GAME_RANK_AT)]}</div>` : ""}
      ${fix}
      ${s.phase === "done" ? `<div class="row"><button class="btn primary big" id="next">${s.i + 1 < s.qs.length ? "Next question" : "See your case report"}</button></div>` : ""}`;
  }
  set(`<div class="hud">
      <div class="who">${avatarSvg(S.player.avatar, "sm")}${esc(S.player.name)}</div>
      <span class="stat">Question <b>${s.i + 1}</b> / ${s.qs.length}</span>
      ${counters(s.correct, s.wrong)}
      <span class="stat">Score <b>${s.score}</b></span>${soundBtns()}</div>
    <div class="timer" aria-hidden="true"><div class="timer-fill${s.left <= 5 ? " low" : ""}" style="width:${s.phase === "q" ? (s.left / s.total) * 100 : 0}%"></div></div>
    <section class="panel">
      ${qHead(q, s.phase === "q" ? `<span class="stat secs"><span id="tleft">${s.left}</span>s</span>` : "")}
      <p class="brief">${esc(q.brief)}</p>
      ${body}
    </section>
    <div class="row"><button class="btn quiet" id="quit">End game</button></div>`, false, keep);
  const nx = document.getElementById("next");
  if (nx) { nx.onclick = () => { s.i += 1; if (s.i < s.qs.length) soloQ(); else soloReport(); }; nx.focus({ preventScroll: true }); }
  document.getElementById("quit").onclick = () => { stopTimer(); disarmGuard(); if (s.results.length) soloReport(); else { S.solo = null; lobby(); } };
  if (s.phase === "q" && q.type === "type") { const inp = document.getElementById("tans"); if (inp && !keep) inp.focus(); }
}
async function soloReport() {

function teamTodo(q) {

  const code = String(100000 + Math.floor(Math.random() * 900000));
  const H = S.host = { code, cfg, typed: !!cfg.typed, round: 1, phase: "lobby", i: -1, players: {}, online: new Set(), kicked: new Set(), answers: {}, left: 0, total: 0, stats: [], status: "connecting" };
  newRound(H);
  const ch = sb().channel("ir-" + code, { config: { broadcast: { self: false }, presence: { key: "host" } } });
  H.ch = ch;
  ch.on("broadcast", { event: "hello" }, ({ payload }) => { addPlayer(payload); hostPush(); if (H.phase === "lobby") drawHost(); })
    .on("broadcast", { event: "answer" }, ({ payload }) => onAnswer(payload))

      const st = ch.presenceState();
      H.online = new Set(Object.keys(st).filter(k => k !== "host"));
      Object.keys(st).forEach(k => { if (k !== "host" && st[k][0]) addPlayer(st[k][0]); });
      if (H.phase === "lobby") drawHost(); else hostLiveUI();
    })
    .subscribe(status => {
      if (status === "SUBSCRIBED") { H.status = "live"; ch.track({ role: "host" }); hostPush(); }

      else if (status === "CLOSED") H.status = "closed";
      if (H.phase === "lobby") drawHost();

  Sound.startMusic();

}
function newRound(H) {

  H.i = -1; H.stats = []; H.phase = "lobby";

}
function addPlayer(p) {
  const H = S.host;
  if (!H || !p || !p.id || H.kicked.has(p.id)) return;
  if (!H.players[p.id]) {
    H.players[p.id] = { id: p.id, name: String(p.name || "Detective").slice(0, 20), avatar: p.avatar || "det-f", score: 0, correct: 0, wrong: 0, streak: 0, best: 0, last: 0, ok: false, typedOk: false, prevRank: 0 };

const ranking = () => Object.values(S.host.players).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
function hostPush() {

      gap: k > 0 ? rk[k - 1].score - p.score : 0, above: k > 0 ? rk[k - 1].name : "" }; });

}
function hostClose() {

function hostNext() {
  const H = S.host;

  const q = QUESTIONS[H.qs[H.i]];
  H.phase = "question"; H.total = secsFor(q, H.cfg.time, H.typed); H.left = H.total; H.answers = {}; H.closing = false;

const complete = (H, a) => a && a.ans !== null && a.ans !== undefined && (!typedFor(QUESTIONS[H.qs[H.i]], H.typed) || (a.text !== undefined && a.text !== null));
function onAnswer(p) {

  addPlayer(p);
  const a = H.answers[p.id] = H.answers[p.id] || { ans: null, text: null, left: H.left };
  if (p.ans !== undefined && p.ans !== null && JSON.stringify(p.ans) !== JSON.stringify(a.ans)) { a.ans = p.ans; a.left = H.left; }

function hostReveal() {
  const H = S.host; stopTimer();

  const prev = {}; if (H.i > 0) ranking().forEach((p, k) => { prev[p.id] = k + 1; });
  const dist = {}, wrongTexts = {};

    const a = H.answers[p.id];
    p.prevRank = prev[p.id]; p.last = 0; p.ok = false; p.typedOk = false;
    const has = a && a.ans !== null && a.ans !== undefined;
    if (has) {
      answered += 1;
      const key = Array.isArray(a.ans) ? "seq" : a.ans;
      dist[key] = (dist[key] || 0) + 1;
      if (q.type === "type" && !isCorrect(q, a.ans)) { const t = String(a.ans).trim().toLowerCase(); wrongTexts[t] = (wrongTexts[t] || 0) + 1; }

}

function studentJoin(code, reuseId) {

    .subscribe(status => {

        ch.track(me);
        ch.send({ type: "broadcast", event: "hello", payload: me });

function studentLeave(toScreen = signIn) {

  stopTimer(); S.pad = null; disarmGuard();

function studentFail(msg) {

function onState(st) {
  const P = S.stu; if (!P) return;
  clearTimeout(P.wait);

    store.del("ir-last");
    return studentLeave(() => set(`${brand()}<section class="panel"><h2>You've been removed from this game</h2><p class="muted">Ask your teacher if you think this is a mistake.</p><div class="row"><button class="btn" id="b">OK</button></div></section>`) || (document.getElementById("b").onclick = signIn));
  }
  if (!P.state) {
    store.set("ir-last", { code: P.code, id: P.id, name: S.player.name, avatar: S.player.avatar, t: Date.now() });
    armGuard(() => { store.del("ir-last"); studentLeave(); }, "If you leave, you stop scoring points. You can rejoin with the same code and keep your score.");
    Sound.play("join");
  }
  if (st.round !== P.round) { P.round = st.round; P.hist = []; P.lastRank = 0; }
  P.state = st;
  const key = `${st.round}:${st.phase}:${st.i}`;
  if (key === P.key) {
    if (st.phase === "question") { P.left = Math.min(P.left, st.left); timerUI(P.left, st.total); const c = document.getElementById("closing"); if (c) c.hidden = !st.closing; }
    return;
  }
  P.key = key;
  stopTimer();
  const mine = st.scores && st.scores[P.id];
  if (st.phase === "question") {
    P.L = freshPad(); P.left = st.left;
    S.pad = { L: P.L, act: (a, v) => studentAct(a, v) };

}
function studentAct(act, v) {
  const P = S.stu, st = P && P.state;
  if (!st || st.phase !== "question") return;
  const q = QUESTIONS[st.qn], L = P.L;
  const r = padAct(q, L, act, v);
  if (!r) return;
  const send = (ans, text) => P.ch.send({ type: "broadcast", event: "answer", payload: { id: P.id, name: S.player.name, avatar: S.player.avatar, round: st.round, i: st.i, ans, text } });
  if (r === "ans") { L.sentAns = L.ans; send(L.ans, null); Sound.play("tap"); }
  if (act === "seq-send" && L.ans) { L.sentAns = L.ans.slice(); send(L.sentAns, null); Sound.play("tap"); }
  if (r === "text") {
    if (q.type === "type") { L.sentAns = L.ans; L.sentText = L.ans; send(L.ans, null); }
    else { L.sentText = L.draft; send(L.sentAns, L.draft); }
    Sound.play("tap");
  }
  if (r === "seq") Sound.play("tap");
  drawStudent(true);
}
async function studentSave() {
  const P = S.stu; if (!P || P.saved[P.round] || !S.user) return;
  P.saved[P.round] = "pending";
  const mine = P.state.scores && P.state.scores[P.id];
  const round = P.round;
  const res = await saveResult({ mode: "live", questions: P.hist.length, correct: P.hist.filter(h => h.ok).length, score: mine ? mine.score : 0,
    best: mine ? mine.best : 0, topics: topicTally(P.hist), missed: P.hist.filter(h => !h.ok).map(h => h.q.brief) });
  if (S.stu === P && P.round === round) { P.saved[round] = res; const el = document.getElementById("savenote"); if (el && P.state.phase === "end") el.innerHTML = saveNote(res); }
}
function drawStudent(keep = false) {
  const P = S.stu, st = P.state;
  const mine = st.scores && st.scores[P.id];
  const me = `<div class="who">${avatarSvg(S.player.avatar, "sm")}${esc(S.player.name)}</div>`;
  const cnt = mine ? counters(mine.correct, mine.wrong) : (P.hist.length ? counters(P.hist.filter(h => h.ok).length, P.hist.filter(h => !h.ok).length) : "");
  const hud = extra => `<div class="hud">${me}${extra || ""}${cnt}${soundBtns()}</div>`;
  if (st.phase === "lobby") {
    return set(`${hud(`<span class="stat">Game <b>${spaced(P.code)}</b></span>`)}
      <section class="panel center">${avatarSvg(S.player.avatar, "lg")}<h2>You're in, ${esc(S.player.name)}</h2>
      <p class="muted">Look at the board. The first question opens when your teacher starts the game.</p></section>`);
  }
  if (st.phase === "question") {
    const q = QUESTIONS[st.qn];
    return set(`${hud(`<span class="stat">Question <b>${st.i + 1}</b> / ${st.n}</span>`)}
      <div class="timer" aria-hidden="true"><div class="timer-fill" style="width:${(P.left / st.total) * 100}%"></div></div>
      <section class="panel">
        ${qHead(q, `<span class="stat secs"><span id="tleft">${P.left}</span>s</span>`)}
        <p class="brief">${esc(q.brief)}</p>
        ${todoBanner(todoText(q, "live", typedFor(q, st.typed)))}
        ${deviceQ(q, st.perm, P.L, { mode: "live", typed: st.typed })}
        <p class="closing" id="closing" ${st.closing ? "" : "hidden"}>Everyone has answered. A few seconds left to change your answer.</p>
      </section>`, false, keep);
  }
  if (st.phase === "reveal") {
    const q = QUESTIONS[st.qn], h = P.hist[P.hist.length - 1];
    const ok = mine && mine.ok;
    return set(`${hud(`<span class="stat">Question <b>${st.i + 1}</b> / ${st.n}</span>`)}
      <section class="panel">
        <div class="result ${ok ? "good" : "bad"}"><span class="rhead">${ok ? `Correct · +${mine.last}` : h && h.ans !== null ? "Not this time" : "No answer in time"}</span>
          ${!ok && h && h.ans !== null ? `<p>You said: <b>${esc(ansLabel(q, h.ans))}</b></p>` : ""}
          <p>Correct answer: <span class="answer">${esc(rightLabel(q))}</span></p>
          ${typedFor(q, st.typed) ? `<p>${mine && mine.typedOk ? "Your typed answer was right · +300" : "Final answer"}: <span class="answer">${esc(q.answer)}</span></p>` : ""}
          <p class="why"><b>Why:</b> ${esc(q.why)}</p></div>
        <p class="muted">Look at the board for the standings.</p>
      </section>`);
  }
  if (st.phase === "standings") {
    return set(`${hud(`<span class="stat">After question <b>${st.i + 1}</b> / ${st.n}</span>`)}
      <section class="panel center">
        ${P.promoted ? `<div class="promo">Promoted to ${RANKS[P.lastRank]}</div>` : ""}
        ${mine ? `<span class="eyebrow">Your position</span><div class="big">${ordinal(mine.rank)}</div><p class="muted">of ${mine.of} · ${mine.score} points</p>
          <p class="gap">${mine.rank === 1 ? "You're top of the board. Keep it up." : `${mine.gap + 1} points to pass ${esc(mine.above)}`}</p>
          ${rankBadge(rankIdx(mine.correct, GAME_RANK_AT))}${mine.streak >= 3 ? `<span class="streak">${mine.streak} in a row</span>` : ""}` : `<h2>Standings on the board</h2>`}
      </section>`);
  }
  if (st.phase === "end") {
    const res = P.saved[P.round];
    const place = mine && mine.rank <= 3 ? mine.rank : 0;
    const html = set(`${hud("")}
      ${place ? `<section class="panel center celebrate" style="--d:${REVEAL[place] / 1000}s">
        <p class="cel-wait">Look at the board: the top 3 are being revealed…</p>
        <div class="cel-win">${medalSvg(place, "big")}${avatarSvg(S.player.avatar, "xl")}
          <span class="cel-place">${PLACE_WORD[place]} place!</span>
          <span class="cel-medal">${MEDALS_C[place][2]} medal${place === 1 ? " · Top detective" : ""}</span>
          <span class="muted">${mine.score} points · ${mine.correct} correct</span></div></section>` : ""}
      <section class="panel center">${place ? "" : avatarSvg(S.player.avatar, "lg")}
        ${mine ? `<span class="eyebrow">Final position</span><div class="big">${ordinal(mine.rank)}</div><p class="muted">of ${mine.of} · ${mine.score} points</p>
          ${rankBadge(rankIdx(mine.correct, GAME_RANK_AT))}
          <div class="kpis"><div class="kpi"><span class="eyebrow">Correct</span><span class="v ok">${mine.correct}</span></div><div class="kpi"><span class="eyebrow">Wrong</span><span class="v no">${mine.wrong}</span></div><div class="kpi"><span class="eyebrow">Best streak</span><span class="v">${mine.best}</span></div></div>` : `<h2>Game over</h2>`}
        <div id="savenote">${S.user ? (res && res !== "pending" ? saveNote(res) : `<p class="muted small">Saving to your case record…</p>`) : saveNote({ saved: false, why: "guest" })}</div>
      </section>
      ${reviewHtml(P.hist)}
      <section class="panel"><h3>What next?</h3>
        <p class="muted small">If your teacher starts another round, you'll join it automatically. Stay on this page.</p>
        <div class="row"><button class="btn primary" id="solo">Practise solo cases</button>${S.user ? `<button class="btn" id="rec">My case record</button>` : ""}<button class="btn quiet" id="leave">Leave the game</button></div>
      </section>`, false, keep);
    if (place) {
      if (place === 1) later(REVEAL.roll, () => Sound.play("drumroll"));
      later(REVEAL[place], () => { Sound.play(place === 1 ? "gold" : place === 2 ? "silver" : "bronze"); Confetti.burst(place === 1 ? 200 : 110, 0.5, 0.35); });
      if (place === 1) later(REVEAL[1] + 900, () => Confetti.burst(140, 0.5, 0.3));
    } else Sound.play("end");
    return html;
  }
}
app.addEventListener("click", e => {
  const t = e.target.closest && e.target.closest("#solo, #rec, #leave");
  if (!t || !S.stu || !S.stu.state || S.stu.state.phase !== "end") return;
  e.stopImmediatePropagation();
  if (t.id === "leave") { store.del("ir-last"); studentLeave(); }
  if (t.id === "solo") { store.del("ir-last"); studentLeave(soloSetup); }
  if (t.id === "rec") { store.del("ir-last"); studentLeave(recordScreen); }
}, true);

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has("host")) { set(`${brand("Host a game")}<section class="panel"><h2>Opening…</h2></section>`); await initAuth(); await loadAccess(); return hostSetup(); }
  else if (q.has("join") || q.has("code")) joinScreen((q.get("code") || "").replace(/\D/g, "").slice(0, 6));
  else signIn();
  await initAuth();
  await loadAccess();
  if (!S.host && !S.stu && !S.solo && app.querySelector("#toJoin")) signIn();
  const jn = document.getElementById("jname"); if (S.user && jn && !jn.value) jn.value = S.player.name;
})();

})();
</script>
