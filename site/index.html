<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Forensics Lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2046%22%3E%3Cpath%20d%3D%22M20%202%2037%208v14c0%2011-7.5%2018.5-17%2022C10.5%2040.5%203%2033%203%2022V8z%22%20fill%3D%22%230B122C%22%20stroke%3D%22%2300FCF1%22%20stroke-width%3D%223.2%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2221%22%20r%3D%226.6%22%20fill%3D%22none%22%20stroke%3D%22%2300FCF1%22%20stroke-width%3D%223.8%22%2F%3E%3Cpath%20d%3D%22M23.8%2025.8%2028.6%2030.6%22%20stroke%3D%22%231B36FF%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Josefin+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: case-file workbench. Topic board beside the live case; admin pages as stacked panels. Deliberate single dark look in the Maths Forensics navy. */
:root{
  --ink:#0B122C; --panel:#111a3d; --panel2:#16214b; --line:#26336a;
  --cyan:#00FCF1; --blue:#1B36FF; --text:#E8ECF8; --muted:#93a0c8;
  --good:#3DDC97; --warn:#FFC857; --bad:#FF6B7A; --gold:#C9A7FF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Josefin Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(circle at 1px 1px,rgba(0,252,241,.06) 1px,transparent 0);background-size:22px 22px}
.wrap{max-width:1180px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.6}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;color:var(--cyan)}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.02em;margin:0}
.ph{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,4vw,28px);margin:4px 0 0}
.hint{font-size:14px;color:var(--muted);margin:0}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;padding-block:18px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:38px;height:44px;flex:none}
.wm{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.08em;line-height:1.1}
.wm small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--cyan);margin-top:4px}
.navwrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
nav:empty{display:none}
nav button{background:none;border:0;padding:7px 13px;border-radius:7px;font-weight:600;font-size:15px;color:var(--muted)}
nav button[aria-selected="true"]{background:var(--blue);color:#fff}
#who{display:flex;align-items:center;gap:8px;font-size:15px}
#who:empty{display:none}
.whoname{font-weight:700}
.link{background:none;border:0;color:var(--cyan);font-weight:600;font-size:14px;padding:4px;text-decoration:underline;text-underline-offset:3px}
.demobar{margin-top:10px;font-size:13px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em}

/* shared controls */
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.gr{font-family:var(--f-mono);font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--ink);color:var(--muted)}
.gr.top{color:var(--gold);background:rgba(201,167,255,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.inp{min-width:0;background:var(--ink);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-family:var(--f-mono);font-size:17px;width:100%}
.inp:focus{border-color:var(--cyan);outline:none}
.inp.sm{width:80px;padding:5px 8px;font-size:14px}
select.inp{font-family:var(--f-body);font-size:16px}
.btn{border:0;border-radius:9px;padding:11px 20px;font-weight:700;font-size:16px;background:var(--cyan);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:10px 16px;font-weight:600;font-size:15px;white-space:nowrap}
.ghost:hover{color:var(--text);border-color:var(--muted)}
.ghost.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack label,.grid2 label,.asgform label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted);font-weight:600}
.stack input{background:var(--ink);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:16px}
.stack input:focus{border-color:var(--cyan);outline:none}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline .inp{flex:1 1 160px;width:auto}
.inline .formerr{flex-basis:100%}
.formerr{margin:0;color:var(--bad);font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cyan);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:10px;margin:0;z-index:9;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{border-color:var(--good);color:var(--good)}

/* auth */
main.auth{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,420px);gap:40px;margin-top:40px;align-items:start}
@media (max-width:860px){main.auth{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:24px}}
.pitch h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5.4vw,52px);line-height:1.05;margin:10px 0 16px;letter-spacing:-.01em}
.lede{font-size:19px;max-width:52ch;margin:0 0 20px;color:#cfd6ee}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ticks li{padding-left:26px;position:relative}
.ticks li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:12px;border:2px solid var(--cyan);border-radius:3px}
.ticks b{color:var(--cyan)}
.authcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--ink);border-radius:9px;padding:4px}
.seg button{background:none;border:0;border-radius:6px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--panel2);color:var(--text)}
.demo{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:16px}
.demolist{display:flex;flex-direction:column;gap:6px}
.demobtn{display:flex;flex-direction:column;align-items:flex-start;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left}
.demobtn:hover{border-color:var(--cyan)}
.demobtn b{font-size:15px}
.demobtn span{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* practise */
main.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}
@media (max-width:860px){main.grid{grid-template-columns:minmax(0,1fr)}.board{order:2}}
@media (min-width:861px){.mobile{display:none}}
.board{display:flex;flex-direction:column;gap:16px}
.boardhead{display:flex;justify-content:space-between;align-items:end;gap:10px}
.strand{display:flex;flex-direction:column;gap:6px}
.strand h3{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.topics{display:flex;flex-direction:column;gap:4px}
.tp{display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid transparent;border-radius:8px;padding:8px 12px;font-size:15.5px}
.tp:hover{border-color:var(--line)}
.tp.on{border-color:var(--cyan);background:var(--panel2)}
.tp.lk{color:var(--muted)}
.tp[disabled]{cursor:default;opacity:.45;background:transparent;border:1px dashed var(--line)}
.acc{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.acc.hi{color:var(--good)}.acc.mid{color:var(--warn)}.acc.lo{color:var(--bad)}
.upsell{text-align:left;background:rgba(27,54,255,.18);border:1px solid var(--blue);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--text)}
.assign{display:flex;flex-direction:column;gap:6px}
.asg{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel2);border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.asg.complete{border-color:var(--good)}
.asg small{display:block;color:var(--muted);font-size:13px}
.asg .track i{background:var(--warn)}.asg.complete .track i{background:var(--good)}

.case{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.casebar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--panel2);border-bottom:1px solid var(--line)}
.casebar .id{font-family:var(--f-mono);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--cyan)}
.streak{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.casebody{padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px}
.casebody h2{font-size:20px}
.prompt{font-size:19px;line-height:1.65;max-width:62ch}
.prompt b{color:#fff}
.eq{font-family:var(--f-mono);font-size:19px;color:#fff;display:inline-block}
.nums{font-family:var(--f-mono);font-size:18px;letter-spacing:.04em;color:#fff}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--f-mono);font-size:.85em;line-height:1.15;margin:0 2px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.qtable{overflow-x:auto;margin:10px 0}
.qtable table{border-collapse:collapse;font-family:var(--f-mono);font-size:16px}
.qtable th,.qtable td{border:1px solid var(--line);padding:6px 14px;text-align:center}
.qtable th{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.dia{width:100%;max-width:320px;height:auto;display:block}
.dia .shape{fill:rgba(27,54,255,.18);stroke:var(--cyan);stroke-width:2}
.dia .ra,.dia .arc{fill:none;stroke:var(--cyan);stroke-width:1.5}
.dia .lbl{fill:var(--text);font-family:var(--f-mono);font-size:15px}
.dia .lbl.x{fill:var(--warn);font-weight:700;font-size:17px}
.dia .sm{font-size:13px}
.dia .note{fill:var(--muted);font-family:var(--f-body);font-size:11px;font-style:italic}
.dia .dot{fill:var(--cyan)}
.dia.wide{max-width:440px}
.dia .grid{stroke:var(--line);stroke-width:.6}
.dia .axis{stroke:var(--muted);stroke-width:1.4}
.dia .tick{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.dia .tick.ax{font-family:var(--f-body);font-size:12px;fill:var(--text)}
.dia .line{fill:none;stroke:var(--cyan);stroke-width:2.2}
.dia .line.dash{stroke:var(--warn);stroke-dasharray:6 4;stroke-width:1.8}
.dia .bar{fill:rgba(27,54,255,.35);stroke:var(--cyan);stroke-width:1.4}
.dia .hl{stroke:var(--warn);stroke-width:2}
.colv{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:var(--f-mono);font-size:.85em;line-height:1.15;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;border-radius:6px;padding:0 5px;margin:0 2px}
form.ans{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
form.ans > label,.flabel{flex:1 1 100%;font-size:14px;color:var(--muted)}
form.ans > .inp{flex:1 1 200px;width:auto}
.fields{display:flex;flex-wrap:wrap;gap:10px;flex:1 1 260px}
.fl{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.fl.wide{flex-basis:220px}
.pair{display:flex;gap:6px}
.out{display:flex;flex-direction:column;gap:16px}
.out:empty{display:none}
.verdict{border-radius:10px;padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:4px}
.verdict strong{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em}
.verdict p{margin:0;font-size:16px}
.verdict.ok{border-color:var(--good);background:rgba(61,220,151,.08)}.verdict.ok strong{color:var(--good)}
.verdict.trap{border-color:var(--warn);background:rgba(255,200,87,.08)}.verdict.trap strong{color:var(--warn)}
.verdict.no{border-color:var(--bad);background:rgba(255,107,122,.08)}.verdict.no strong{color:var(--bad)}
.verdict.seen{border-color:var(--line)}.verdict.seen strong{color:var(--muted)}
.sol{display:flex;flex-direction:column;gap:2px;border-top:1px dashed var(--line);padding-top:16px}
.sol ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.sol li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:baseline;font-size:17px;overflow-wrap:anywhere}
.mk{font-family:var(--f-mono);font-size:12px;font-weight:700;text-align:center;border-radius:4px;padding:2px 0;background:var(--panel2);color:var(--cyan);border:1px solid var(--line)}
.mk.a{color:var(--good)}
.mk.e{color:var(--muted);border-style:dashed}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.paywall{display:flex;flex-direction:column;gap:12px;border:1px solid var(--blue);border-radius:12px;padding:18px;background:rgba(27,54,255,.12)}
.paywall p{margin:0}

/* pages */
main.page{margin-top:24px;display:flex;flex-direction:column;gap:20px}
main.page.narrow{max-width:760px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.kpis,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:19px}}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel p{margin:0}
.licence{border-color:var(--blue)}
.licence.ok{border-color:var(--good)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 100px 48px;gap:10px;align-items:center;font-size:15px}
.track{display:block;height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--cyan)}
.track i.hi{background:var(--good)}.track i.mid{background:var(--warn)}.track i.lo{background:var(--bad)}
.num{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.err{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.err:first-of-type{border-top:0}
.err p{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted)}
.lr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.lr .hint{overflow-wrap:anywhere}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--text);font-family:var(--f-display);font-weight:600;font-size:16px;margin-bottom:6px}
.tablewrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;font-size:14px;min-width:600px;width:100%}
table.plain{border-collapse:collapse;font-size:14.5px;min-width:560px;width:100%}
table.plain th,table.plain td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:4px;text-align:center}
table.heat td{padding:7px 8px;border-radius:5px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.heat th:first-child,table.heat td:first-child{text-align:left;font-family:var(--f-body);font-size:15px}
td.h.hi{background:rgba(61,220,151,.16);color:var(--good)}td.h.mid{background:rgba(255,200,87,.16);color:var(--warn)}td.h.lo{background:rgba(255,107,122,.16);color:var(--bad)}
td.nil{color:var(--line)}
.tabsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabsrow .inline{margin-left:auto;flex:0 1 340px}
#classDetail{display:flex;flex-direction:column;gap:20px}
.classhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.codebox{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--cyan);border-radius:10px;padding:8px 12px}
.codebox b{font-family:var(--f-mono);font-size:20px;letter-spacing:.18em;color:var(--cyan)}
.asgrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.asgrow > div:first-child{display:flex;flex-direction:column}
@media (max-width:700px){.asgrow{grid-template-columns:minmax(0,1fr) auto}.asgrow .dots{grid-column:1/-1;order:3}}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{font-family:var(--f-mono);font-size:10.5px;font-weight:700;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);color:var(--muted)}
.dot.part{border-color:var(--warn);color:var(--warn)}.dot.ok{border-color:var(--good);background:rgba(61,220,151,.15);color:var(--good)}
.asgform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:6px}
.asgform .formerr{grid-column:1/-1}
@media (max-width:700px){.asgform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.asgform label:first-child{grid-column:1/-1}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end;margin-top:12px}
.grid2 .formerr{grid-column:1/-1}
@media (max-width:600px){.grid2{grid-template-columns:minmax(0,1fr)}}
.seatform{display:flex;gap:6px;align-items:center}
details summary{cursor:pointer;color:var(--cyan);font-weight:600;font-size:15px}
footer{margin-top:36px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.verdict,.sol{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}

/* case briefing */
.titlerow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.btn.sm{padding:7px 14px;font-size:14px}
.ghost[aria-expanded="true"]{border-color:var(--cyan);color:var(--cyan)}
.brief{border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:10px;background:var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.briefhead{display:flex;justify-content:space-between;align-items:center}
.brief h3{margin:0 0 6px;font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.bkey{margin:0;font-size:17.5px;line-height:1.5;max-width:62ch;color:#fff}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.bsteps,.bex{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15.5px}
.bex{list-style:none;padding-left:0;font-family:var(--f-mono);font-size:14px}
.bex li::before{content:"→ ";color:var(--muted)}
.bq{margin:0 0 6px;font-size:15.5px;color:#fff}
.btraps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.btraps li{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:8px;background:var(--panel)}
.btraps li span{font-size:14.5px;color:var(--muted)}
.btraps li.hit{background:rgba(255,200,87,.1);border:1px solid var(--warn)}
.btraps li.hit b{color:var(--warn)}
.debrief{margin-top:8px}

/* today, runner, reports */
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.streakpill{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.track.big{height:10px;border-radius:5px}
.panel.daily{border-color:var(--blue)}
.panel.daily.complete{border-color:var(--good)}
.panel.daily.complete .track i{background:var(--good)}
.gradebig{display:flex;align-items:center;gap:16px}
.gradebig b{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--cyan)}
.gradebig span{color:var(--muted);font-size:15px;max-width:22ch}
.mbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--ink)}
.mbar i{display:block;height:100%}
.mbar i.s,.mlegend i.s{background:var(--good)}
.mbar i.l,.mlegend i.l{background:var(--warn)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{width:10px;height:10px;border-radius:2px;background:var(--line);display:inline-block}
h3.sub{margin:4px 0 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.runhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tag.why{border-color:var(--cyan);color:var(--cyan)}
.ms{margin-left:6px;font-size:12px;font-weight:700;color:var(--good)}
.ms.due{color:var(--warn)}
.chip.lk{opacity:.6}
td.wg{font-family:var(--f-display);font-weight:600;color:var(--cyan);text-align:center}

/* exam room */
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.excard{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.excard:hover{border-color:var(--cyan)}
.excard small{grid-column:2;color:var(--muted);font-size:13px}
.excard.lk{opacity:.7}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:18px}
.paper .intro{font-size:18px;line-height:1.6}
.part{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px dashed var(--line)}
.phead2{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline}
.plabel{font-family:var(--f-mono);font-weight:700;color:var(--cyan)}
.ptext{font-size:17px;line-height:1.55}
.pmarks{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.pmarks.ok{color:var(--good)}.pmarks.mid{color:var(--warn)}.pmarks.no{color:var(--bad)}
.work{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;background:var(--ink);border:1px dashed var(--line)}
.scheme{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scheme li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:15.5px;overflow-wrap:anywhere}
.scheme li .tick{font-weight:700}
.scheme li.ok .tick{color:var(--good)}.scheme li.no .tick{color:var(--bad)}
.scheme li.no span:nth-child(2){color:var(--muted)}
b.you{font-family:var(--f-mono);color:var(--text)}
ol.model{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.model li{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:baseline}

/* board, case, guide, set work */
@media (min-width:861px){main.grid .case{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}}
.inp.search{font-family:var(--f-body);font-size:15px;padding:8px 12px}
.pips{display:inline-flex;gap:3px;justify-content:flex-end}
.pips i{width:6px;height:12px;border-radius:2px;background:var(--line);display:block}
.pips i.ok{background:var(--good)}.pips i.no{background:var(--bad)}
.pips.big i{width:14px;height:14px;border-radius:3px}
.tp{grid-template-columns:1fr auto 44px}
.record{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-radius:10px;background:var(--ink);border:1px solid var(--line);font-size:14px}
.record > span:first-child{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.asg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center}
.asg .track{grid-column:1/-1}
.asgcta{font-size:13px;font-weight:700;color:var(--cyan);white-space:nowrap}
.asg.complete .asgcta{color:var(--good)}
.panel.guide{border-color:var(--cyan)}
.gsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:g}
.gsteps>li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--ink)}
.gsteps>li p{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.gnum{counter-increment:g;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--cyan);color:var(--cyan);font-family:var(--f-mono);font-weight:700;font-size:13px}
.gnum:empty::before{content:counter(g)}
.gsteps li.done .gnum{background:rgba(61,220,151,.15);border-color:var(--good);color:var(--good)}
@media (max-width:600px){.gsteps>li{grid-template-columns:32px minmax(0,1fr)}.gsteps>li > button,.gsteps>li > .hint{grid-column:2;justify-self:start}}
.panel.setwork{border-color:var(--blue)}
.asgform{grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:900px){.asgform{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.asgform label:first-child{grid-column:auto}}
.asgform label[hidden]{display:none!important}

.slipcase{display:flex;flex-direction:column;gap:6px;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px dashed var(--line);background:var(--ink)}
/* exam-pace timer */
.qtimer{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.qtimer:hover{border-color:var(--cyan);color:var(--text)}
.qtimer.on{border-style:solid;border-color:var(--cyan);color:var(--cyan);background:rgba(0,252,241,.06)}
.qtimer .tclock{font-size:14px;min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums}
.qtimer .tsub{font-weight:500;color:var(--muted)}
.qtimer.warn{border-color:var(--warn);color:var(--warn);background:rgba(255,200,87,.08)}
.qtimer.over{border-color:var(--bad);color:var(--bad);background:rgba(255,107,122,.08)}
.papertimer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:4px 0 14px}
.timeline{font-family:var(--f-mono);font-size:13px;margin:10px 0;padding:8px 12px;border-radius:8px;border-left:3px solid var(--good);background:rgba(61,220,151,.07)}
.timeline.over{border-left-color:var(--warn);background:rgba(255,200,87,.07)}
/* streak */
.streakpill.lit{background:rgba(255,200,87,.12)}
.streakline{margin:12px 0 0;font-size:15px}
/* help */
.helptabs{margin:4px 0 18px}
.gsteps.help>li{align-items:flex-start}
.gsteps.help .gnum{font-family:var(--f-mono);font-weight:700;color:var(--cyan)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px 28px;margin:0}
.gloss div{border-top:1px solid var(--line);padding-top:10px}
.gloss dt{font-weight:700;color:var(--cyan);margin-bottom:3px}
.gloss dd{margin:0;color:var(--text);font-size:15px;line-height:1.45}
.tips{margin:0;padding-left:18px;line-height:1.6}
.tips code,.gloss code{font-family:var(--f-mono);font-size:13px;color:var(--cyan);background:var(--panel2);padding:1px 6px;border-radius:5px}
.faq{border-top:1px solid var(--line);padding:10px 0}
.faq summary{cursor:pointer;font-weight:700}
.faq p{margin:8px 0 2px;color:var(--text)}
.panel a{color:var(--cyan)}

/* Google / Microsoft sign-in */
.oauth{display:flex;flex-direction:column;gap:8px}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em}
.ordiv::before,.ordiv::after{content:"";flex:1;border-top:1px solid var(--line)}
.oauthbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px 14px;border-radius:9px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;font-weight:600;font-size:15px;cursor:pointer}
.oauthbtn:hover{background:#f4f6fb}
.oauthbtn svg{width:20px;height:20px;flex:none}
.oauthbtn:disabled{opacity:.6;cursor:wait}

/* welcome back: last session + next move */
.casenotes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;border-color:rgba(0,252,241,.35)}
.casenotes h2{margin:4px 0 6px;font-size:20px}
.cn-stats{margin:0 0 12px;color:var(--muted)}
.cn-stats b{color:var(--text)}
.cn-slip{margin:12px 0 0;font-size:14.5px;color:var(--muted)}
.cn-slip b{color:var(--warn)}
.cn-next{display:flex;flex-direction:column;gap:8px;min-width:0}
.cn-main{position:relative;text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 44px 14px 16px;border-radius:10px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.cn-main b{font-size:16.5px}
.cn-main span{font-size:14px;opacity:.9}
.cn-main i{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-style:normal;font-size:20px}
.cn-main:hover{filter:brightness(1.1)}
.cn-then{margin-top:6px}
.cn-alt{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--ink);color:var(--text);cursor:pointer}
.cn-alt span{font-size:13.5px;color:var(--muted)}
.cn-alt:hover{border-color:var(--cyan)}
@media (max-width:760px){.casenotes{grid-template-columns:minmax(0,1fr);gap:20px}}

/* five tabs fit on a phone */
nav button{white-space:nowrap}
@media (max-width:600px){nav{max-width:100%;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{padding:7px 7px;font-size:13.5px}nav{gap:2px}.navwrap{width:100%}}
.casenotes .chips{margin-bottom:2px}

/* teacher work in the welcome panel */
.cn-sum{margin:2px 0 4px;color:var(--muted)}
.cn-sum b{color:var(--text)} .cn-sum b.late,.cn-asg small.late{color:var(--bad)}
.cn-asg small.soon{color:var(--warn)}
.cn-none{margin:2px 0 6px;color:var(--muted)} .cn-alldone{color:var(--good);font-weight:700}
.cn-asg{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--text);cursor:pointer}
.cn-asg.first{border-color:var(--blue);background:rgba(27,54,255,.14)}
.cn-asg:hover{border-color:var(--cyan)}
.cn-asg-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.cn-asg-t small,.cn-asg-p small{font-size:12.5px;color:var(--muted)}
.cn-asg-p{display:flex;flex-direction:column;gap:5px}
.cn-asg .asgcta{font-weight:700;font-size:14px;color:var(--cyan);white-space:nowrap}
@media (max-width:560px){.cn-asg{grid-template-columns:minmax(0,1fr) auto}.cn-asg-p{grid-column:1/-1;order:3}}
@media (max-width:760px){.casenotes.school .cn-next{order:-1}}
footer a{color:var(--muted)}footer a:hover{color:var(--cyan)}
.authnote{margin:0;padding:10px 12px;border-radius:9px;border:1px solid var(--warn);background:rgba(255,200,87,.08);color:var(--text);font-size:14.5px;line-height:1.45}

/* owner: school details */
.sdtoggle{font-weight:700;color:var(--text);text-align:left}
.sdrow>td{background:var(--ink);padding:14px 16px 6px}
.sdetail h3.sub{margin:16px 0 6px}
.sd-kpis .kpi b{font-size:18px}
.stale{color:var(--warn)}
.sel{user-select:all}

/* collapsible topic groups */
details.strand{border-top:1px solid var(--line);padding:4px 0}
details.strand>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;padding:10px 2px}
details.strand>summary::-webkit-details-marker{display:none}
details.strand>summary h3{margin:0;display:flex;align-items:center;gap:8px}
details.strand>summary h3::before{content:"▸";color:var(--cyan);font-size:13px;transition:transform .15s}
details.strand[open]>summary h3::before{transform:rotate(90deg)}
details.strand>summary .scount{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
details.strand>summary:hover h3{color:var(--cyan)}
.subhead{grid-column:1/-1;margin:10px 0 2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}

/* class code: easy to find */
.codebox-signup{display:flex;flex-direction:column;gap:6px;padding:14px;border:2px solid var(--cyan);border-radius:12px;background:rgba(0,252,241,.07)}
.codebox-signup label{display:flex;flex-direction:column;gap:2px}
.codebox-signup label b{font-size:16px;color:var(--cyan)}
.codebox-signup label span{font-size:14px;color:var(--text)}
.codebox-signup small{color:var(--muted);font-size:12.5px}
.codeinp{font-family:var(--f-mono);font-size:20px!important;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.newcode{margin:0;font-size:14px;color:var(--muted)}
.joinbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;border:2px solid var(--cyan);background:rgba(0,252,241,.06)}
.joinbox h2{margin:0 0 4px;color:var(--cyan)}
.joinbox p{margin:0}
.joinform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.joinform .codeinp{width:190px}
.joinform .formerr{flex-basis:100%}
@media (max-width:700px){.joinbox{grid-template-columns:minmax(0,1fr)}.joinform .codeinp{flex:1;min-width:0}}

/* hierarchy tree: owner → school → admin → teacher → class → student */
.ownerline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.role{display:inline-block;font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.r-owner{color:var(--gold);border-color:var(--gold)}
.r-school{color:var(--text);border-color:var(--muted)}
.r-admin{color:#fff;background:var(--blue);border-color:var(--blue)}
.r-teacher{color:var(--cyan);border-color:var(--cyan)}
.r-class{color:var(--warn);border-color:rgba(255,200,87,.6)}
.r-student{color:var(--muted);border-color:var(--line)}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:14px;padding-left:16px;border-left:1px dashed var(--line)}
.tree li{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 0}
.tree li>ul{flex-basis:100%}
.tree ul>li::before{content:"";position:absolute;left:-16px;top:17px;width:12px;border-top:1px dashed var(--line)}
.tree .tmail{color:var(--muted);font-size:14px}
.tree .tsign{font-size:13.5px}
.tree .wk{font-family:var(--mono,ui-monospace,monospace);font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid rgba(0,252,241,.45);color:var(--cyan,#00FCF1)}
.tree .wk.none{border-color:var(--line,#26336a);color:var(--muted,#a3aed3)}
.tree code{font-family:var(--f-mono);color:var(--cyan);font-size:12.5px}
.tstudents{flex-basis:100%;margin-left:4px}
.tstudents summary{cursor:pointer;color:var(--cyan);font-size:13.5px;font-weight:600}
.tstudents ul{margin-top:4px}
.tstudents li{padding:3px 0;font-size:14px}
.codeinp::placeholder{letter-spacing:.3em;opacity:.45}
.joinform .codeinp{width:220px}

/* teacher: sessions */
.stname{color:var(--text);font-weight:600;text-align:left}
.stname:hover{color:var(--cyan)}
td.lastsess{min-width:190px;text-align:left}
td.lastsess b{display:block;font-weight:600;font-size:13.5px}
td.lastsess small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
tr.sessrow>td{background:var(--ink);text-align:left;padding:10px 14px}
.sesslist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.sesslist li{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}

/* ---------- Show me how ---------- */
.smbar[hidden]{display:none}
.smbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px 0 4px}
.showmebtn{font:inherit;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;cursor:pointer;
  background:rgba(255,200,87,.12);color:var(--warn);border:1.5px solid rgba(255,200,87,.7)}
.showmebtn:hover,.showmebtn[aria-expanded="true"]{background:rgba(255,200,87,.22)}
.showmebtn:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.showme{margin:10px 0 6px;padding:16px 18px;border-radius:12px;border:1.5px solid rgba(255,200,87,.55);background:rgba(255,200,87,.06)}
.showme h3{margin:14px 0 6px;font-size:15px;color:var(--warn)}
.showme .smq{font-size:15.5px;opacity:.95}
.smmethod summary{cursor:pointer;font-weight:700;color:var(--cyan,#00FCF1);margin:4px 0}
.smsteps{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.smsteps li{display:flex;gap:10px;align-items:baseline;animation:smin .25s ease}
.smsteps li[hidden]{display:none}
@keyframes smin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.smsteps li{animation:none}}
.smdone{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,200,87,.4)}
.smnote{margin-top:10px}
.pips i.help{background:var(--warn)}
.verdict.helped{border-color:rgba(255,200,87,.6)}
/* ---------- Learn it first ---------- */
.learnpath{margin:6px 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line,#26336a);background:rgba(0,252,241,.04)}
.learnpath ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.learnpath li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;opacity:.7}
.learnpath li.now{opacity:1}.learnpath li.done{opacity:.55}
.learnpath li>span:nth-child(2){flex:1;min-width:160px;display:flex;flex-direction:column}
.learnpath small{color:var(--muted,#a3aed3);font-size:13.5px}
.lpn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--line,#26336a)}
.learnpath li.now .lpn{border-color:var(--cyan,#00FCF1);color:var(--cyan,#00FCF1)}
.learnpath li.done .lpn{background:var(--good,#2ecc71);border-color:transparent;color:#0B122C}
.heat td.smc b{display:block}
.heat td.smc small{display:block;font-size:11.5px;color:var(--muted,#a3aed3);white-space:nowrap}
.heat td.smc.heavy{background:rgba(255,200,87,.16);color:var(--warn)}
.heat td.smc.heavy small{color:var(--warn)}
.smline{margin:6px 0 8px;font-size:14px}
.smuse{color:var(--warn)}

/* ---------- set work: steps, status groups, follow-up ---------- */
.asgform label{flex-direction:row!important;flex-wrap:wrap;align-items:center;column-gap:8px}
.asgform label .inp{flex-basis:100%}
.stepn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700;flex:none}
.panel.setwork h2{font-size:22px}
.worklist .asgcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;background:rgba(255,255,255,.015)}
.asghead{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px 14px;align-items:center}
.asghead>div{display:flex;flex-direction:column}
@media (max-width:700px){.asghead{grid-template-columns:minmax(0,1fr) auto}.asghead>div{grid-column:1/-1}}
.duetag{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.duetag.soon{border-color:var(--warn);color:var(--warn)}
.duetag.over{border-color:var(--bad);color:var(--bad)}
.stackbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:12px 0}
.stackbar i{display:block;height:100%}
.s-done{background:var(--good)}.s-help{background:var(--bad)}.s-progress{background:var(--cyan)}.s-none{background:#4a5683}
.sgroups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.sgroups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.sgroups{grid-template-columns:minmax(0,1fr)}}
.sg{border:1px solid var(--line);border-top-width:3px;border-radius:10px;padding:8px 10px;min-width:0}
.sg h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.sg h4 b{margin-left:auto;font-family:var(--f-mono)}
.sg ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sg li{display:flex;flex-direction:column;font-size:14px;line-height:1.3}
.sg li small{color:var(--muted);font-size:12.5px}
.sg li.over small{color:var(--bad)}
.sg .hint{margin:0;font-size:13px}
.sg-help{border-top-color:var(--bad);background:rgba(255,107,122,.06)}.sg-help h4{color:var(--bad)}
.sg-none{border-top-color:#4a5683}
.sg-progress{border-top-color:var(--cyan)}
.sg-done{border-top-color:var(--good)}.sg-done h4{color:var(--good)}
.copyfollow{margin-top:10px}
.panel.followup{border-color:var(--bad)}
.fulist{list-style:none;margin:0;padding:0}
.fulist li{display:grid;grid-template-columns:minmax(110px,180px) minmax(0,1fr);gap:4px 14px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.6}
@media (max-width:560px){.fulist li{grid-template-columns:minmax(0,1fr)}}
.fulist small{color:var(--muted)}
.futag{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.futag.help{border-color:var(--bad);color:var(--bad)}
.futag.none{color:var(--muted)}

/* ---------- class lists / bulk import ---------- */
.pagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.importer{display:grid;gap:10px;margin-top:8px}
.impinputs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.filebtn{position:relative;display:inline-flex;align-items:center;padding:9px 14px;border-radius:10px;border:1.5px dashed var(--cyan);color:var(--cyan);font-weight:700;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.importer textarea{font-family:var(--f-mono);font-size:13.5px;resize:vertical;min-height:96px}
.impfallback{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.impsum{display:flex;flex-wrap:wrap;gap:8px}
.impsum span{font-family:var(--f-mono);font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.impsum .ok{border-color:var(--good);color:var(--good)}.impsum .bad{border-color:var(--bad);color:var(--bad)}
.impwarn{color:var(--warn);font-size:14px;margin:0}
.impwrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.imptable{font-size:13.5px}.imptable tr.bad td{color:var(--bad)}.imptable tr.dim td{color:var(--muted)}
.impdone{border:1px solid var(--good);border-radius:10px;padding:12px 14px;background:rgba(61,220,151,.07)}
.impdone p{margin:6px 0 0}
.impsteps>li{align-items:flex-start}.impsteps>li>div{flex:1;min-width:0}
.toggle{display:flex;gap:12px;align-items:flex-start;margin:16px 0 4px;cursor:pointer}
.toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--cyan);flex:none}
.toggle span{display:flex;flex-direction:column}.toggle small{color:var(--muted);font-size:13.5px}
.wait{color:var(--warn)}
.panel.classlist.waiting{border-color:var(--warn)}
.waitlist{list-style:none;margin:6px 0 12px;padding:0;display:grid;gap:6px}
.waitlist li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.classlist details summary{cursor:pointer;font-weight:700;color:var(--cyan)}

/* ---------- reports: a white "paper" page on screen, and clean pages when printed ---------- */
.rtools{display:grid;gap:12px;margin-bottom:16px}
.rtop{display:flex;align-items:center;gap:14px}
.rrange{align-items:center}
.rdates{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.rpaper{background:#fff;color:#141a33;border-radius:12px;padding:28px 32px;margin:0 auto 22px;max-width:980px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:14.5px;line-height:1.45}
.rpaper h2{font-family:inherit;font-size:24px;margin:2px 0 2px;color:#0B122C}
.rpaper h3{font-size:15.5px;margin:20px 0 8px;color:#0B122C;border-bottom:2px solid #e3e7f3;padding-bottom:4px}
.rpaper .hint{color:#5a6384}
.rhead{border-bottom:3px solid #0B122C;padding-bottom:12px;margin-bottom:14px;position:relative}
.rbrand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.08em;font-size:12px;color:#0B122C;position:absolute;right:0;top:0}
.rbrand svg{width:22px;height:25px}
.rkick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#1B36FF}
.rsub{margin:0;color:#5a6384}
.rkpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:8px 0 4px}
.rkpis div{border:1px solid #dfe3f0;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.rkpis b{font-size:20px;color:#0B122C}.rkpis span{font-size:12.5px;color:#5a6384}
@media (max-width:820px){.rkpis{grid-template-columns:repeat(3,minmax(0,1fr))}.rpaper{padding:18px 16px}.rbrand{position:static;margin-bottom:6px}}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#5a6384;border-bottom:1.5px solid #c9cfe3;padding:6px 6px}
.rtable td{border-bottom:1px solid #eceff7;padding:6px 6px;vertical-align:top}
.rtable td.num,.rtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.rtable.small{font-size:13px}
.rpaper .tablewrap,.rpaper{overflow-x:auto}
.rtwo{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}
@media (max-width:700px){.rtwo{grid-template-columns:1fr}}
.rlist{margin:0;padding-left:20px}.rlist li{margin:4px 0}
.rpill{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid #c9cfe3;color:#5a6384;white-space:nowrap}
.rpill.bad{border-color:#d93a4f;color:#b3263a}
.rs-done{color:#1d8a5a;font-weight:700}.rs-help{color:#b3263a;font-weight:700}.rs-none{color:#5a6384}.rs-progress{color:#1B36FF}
.rcomment{min-height:90px;border:1.5px dashed #b9c0d8;border-radius:10px;padding:10px 12px;outline:none}
.rcomment:focus{border-color:#1B36FF}
.rcomment:empty::before{content:'Click to type a comment before printing, or leave blank to write by hand.';color:#9aa2bf}
.rchart{margin:10px 0 0}.rchart figcaption{font-size:13px;font-weight:700;color:#0B122C;margin-bottom:4px}
.rchart svg{width:100%;max-height:170px}
.rbar{fill:#1B36FF}.rval{font-size:11px;fill:#141a33;font-family:var(--f-mono)}.rax{font-size:10.5px;fill:#5a6384}.rbase{stroke:#c9cfe3;stroke-width:1}
.rfoot{margin-top:20px;font-size:11.5px;color:#7a83a3;border-top:1px solid #eceff7;padding-top:8px}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#000}
  header,footer,.demobar,.noprint,.toast{display:none!important}
  .wrap,main{padding:0!important;margin:0!important;max-width:none!important}
  .rpaper{box-shadow:none;border-radius:0;padding:0;margin:0;max-width:none;overflow:visible}
  .rpaper+.rpaper{break-before:page}
  .rpaper h3,.rtable tr,.rchart{break-inside:avoid}
  .rcomment{border-color:#999}.rcomment:empty::before{content:''}
  .rtable{font-size:11.5px}
}
.rtable td.num{white-space:nowrap}
.rtable td:nth-child(2){white-space:nowrap}

/* ---------- calculator / non-calculator ---------- */
.calctoggle{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.tag.calc{border-color:rgba(0,252,241,.5);color:var(--cyan)}
.tag.noncalc{border-color:rgba(255,200,87,.6);color:var(--warn)}
.calcnote{font-size:13.5px;color:var(--warn);margin:6px 0}
.tp .ms.co{opacity:.8}
.papercards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.papercards{grid-template-columns:minmax(0,1fr)}}
.papercard{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.papercard:hover,.papercard:focus-visible{border-color:var(--cyan)}
.papercard b{font-size:17px}.papercard small{color:var(--muted)}
.papercard .pctag{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.papercard.p1 .pctag{color:var(--warn)}.papercard.p2 .pctag{color:var(--cyan)}
.paperlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.paperlist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:8px 12px}
.paperlist li.ok{border-left-color:var(--good)}
.paperlist summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.paperlist .pq{font-family:var(--f-mono);color:var(--muted)}
/* data diagrams */
.dia .pie{stroke:var(--ink,#0B122C);stroke-width:2}
.dia .pie.p0{fill:rgba(0,252,241,.28)}.dia .pie.p1{fill:rgba(27,54,255,.45)}.dia .pie.p2{fill:rgba(255,200,87,.3)}.dia .pie.p3{fill:rgba(61,220,151,.28)}.dia .pie.p4{fill:rgba(201,167,255,.3)}
.dia .fbox{fill:var(--panel,#111a3d);stroke:var(--cyan,#00FCF1);stroke-width:1.5}
.dia .fline{stroke:var(--muted,#93a0c8);stroke-width:1.5}
.stemleaf td.leaves{text-align:left;min-width:180px;letter-spacing:.06em}
.stemleaf th{border-right:2px solid var(--text)!important}
.dia.graph .grid{stroke:var(--line,#26336a);stroke-width:.6}
.dia.graph .axis{stroke:var(--muted,#93a0c8);stroke-width:1.4}
.dia.graph .curve{fill:none;stroke:var(--cyan,#00FCF1);stroke-width:2.2}
.dia.graph .tick{font-size:10px;fill:var(--muted,#93a0c8);font-family:var(--f-mono)}
.machine{display:inline-block;border:1.5px solid var(--cyan);border-radius:8px;padding:2px 10px;font-family:var(--f-mono);margin:4px 2px}
/* lists nested inside steps (e.g. "Where to find it") use normal list styling */
.gsteps>li ul,.gsteps>li ol{display:block;padding-left:20px;margin:6px 0}
.gsteps>li ul li,.gsteps>li ol li{display:list-item;padding:2px 0;background:none;border-radius:0}
.gsteps>li .faq{border-top:none;padding:4px 0}

/* ---------- upgrade ---------- */
.upgradepill{white-space:nowrap;font:inherit;font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--warn);background:rgba(255,200,87,.12);color:var(--warn);cursor:pointer;margin-right:4px}
.upgradepill:hover,.upgradepill:focus-visible{background:rgba(255,200,87,.22)}
.upbanner{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px 28px;border-color:var(--warn)}
@media (max-width:760px){.upbanner{grid-template-columns:minmax(0,1fr)}}
.upbanner h2{margin:4px 0 8px}
.upcode{border-left:1px solid var(--line);padding-left:24px}
@media (max-width:760px){.upcode{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:14px}}
.upcode h3{margin:0 0 4px}
.upfeat{margin:6px 0 12px;padding-left:20px;line-height:1.55}
.upfeat li::marker{color:var(--cyan)}
.btn s,.planprice s{opacity:.6;font-weight:500;margin-left:4px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0}
@media (max-width:820px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column}
.plan.best{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.plan h3{margin:2px 0}
.planprice{font-size:22px;margin:4px 0}
.plan .btn,.plan .pill{margin-top:auto;align-self:flex-start}
.plan .btn{white-space:normal;text-align:center}

/* ---------- report a problem ---------- */
.reportq{margin-top:10px;text-align:right}
.reportq .link{font-size:13.5px;color:var(--muted)}
.reportq .link:hover{color:var(--cyan)}
.fbdlg{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:20px 22px;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto}
.fbdlg::backdrop{background:rgba(3,6,18,.7)}
.fbhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fbhead h2{margin:0;font-size:19px}
.fbq{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--ink)}
.fbq p{margin:4px 0;font-size:14px;white-space:pre-line}
.fbreasons{border:none;padding:0;margin:0;display:grid;gap:6px}
.fbreasons legend{font-weight:700;margin-bottom:6px}
.fbr{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px}
.fbr input{accent-color:var(--cyan);width:18px;height:18px}
.fbdone h2{margin:0}
.fbline{margin-top:6px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.replist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rep{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px}
.rep.fixed{border-left-color:var(--good)}.rep.closed{border-left-color:var(--line)}
.rephead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.repact{margin-left:auto;display:flex;gap:8px;align-items:center}
.repcomment{margin:8px 0 4px;font-style:italic}
.repq summary{cursor:pointer;color:var(--cyan);font-size:14px}
.repquestion{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--ink);border-radius:8px;padding:8px 10px;margin:6px 0}
.repsteps{font-size:13px;color:var(--muted);margin:4px 0}
.repmeta{margin:6px 0 0;font-size:12px}
.repmeta .bad{color:var(--bad)}
.fbdlg .stack label.fbr{flex-direction:row;align-items:center;gap:10px;color:var(--text);font-weight:500;font-size:15px}

/* ---------- case file ---------- */
.cfintro{border-color:var(--cyan)}
.cfintro.small{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 16px}
.cfintro.small p{margin:0;flex:1;min-width:220px}
.cfhow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:760px){.cfhow{grid-template-columns:minmax(0,1fr)}}
.cfhow>div{background:var(--ink);border-radius:10px;padding:12px 14px}
.cfhow>div>b{display:block;margin:6px 0 2px}
.cfhow p{margin:0;font-size:14px;color:var(--muted)}
.cfn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--cyan);color:var(--cyan);font-weight:700;font-size:13px}
.cfkpis .kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.moves li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;background:var(--ink);border-radius:10px;padding:10px 12px}
@media (max-width:600px){.moves li{grid-template-columns:minmax(0,1fr)}.moves .mvtag{justify-self:start}.moves li .btn,.moves li .ghost{justify-self:start}}
.moves small{display:block;color:var(--muted);font-size:13.5px}
.mvtag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mvtag.lo{border-color:var(--bad);color:var(--bad)}.mvtag.mid{border-color:var(--warn);color:var(--warn)}
.cfexplain{margin-top:0}
.lgd{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:middle}
.lgd.lo{background:var(--bad)}.lgd.mid{background:var(--warn)}.lgd.hi{background:var(--good)}
.cfbar{font:inherit;color:inherit;background:none;border:none;width:100%;text-align:left;cursor:pointer;border-radius:8px;padding:4px 6px}
.cfbar:hover,.cfbar:focus-visible{background:var(--ink)}
.cfreset{text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.cfreset p{margin:0;flex:1;min-width:240px}
.reportbtn{white-space:nowrap}
@media (max-width:720px){.reportbtn span{display:none}}
.casebar .qflag{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.casebar .qflag:hover{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

function frS(n,d){ // simplified fraction html, sign-aware
  if(d<0){n=-n;d=-d}

function toFrac(x){for(let d=1;d<=100;d++){const n=Math.round(x*d);if(Math.abs(n/d-x)<1e-9){const g=gcd(n,d);return [n/g,d/g]}}return [x,1]}

function parseNum(raw){
  let s=String(raw).toLowerCase().replace(/−/g,'-');
  const pct=s.includes('%');
  s=s.replace(/,/g,'').replace(/[^0-9.\-\/ ]/g,' ').replace(/\s+/g,' ').trim();
  if(!s) return NaN;
  let m=s.match(/^(-?\d+) (\d+) ?\/ ?(\d+)$/);
  if(m){const w=+m[1],v=Math.abs(w)+ +m[2]/ +m[3];return w<0?-v:v}
  s=s.replace(/ /g,'');
  m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  const v=m?(+m[1])/(+m[2]):(/^-?\d*\.?\d+$/.test(s)?Number(s):NaN);
  return pct?v/100:v;
}
function parseFrac(raw){
  const s=String(raw).replace(/−/g,'-').replace(/\s+/g,' ').trim();
  let m=s.match(/^(\d+) (\d+)\/(\d+)$/); if(m) return {n:+m[1]*+m[3]+ +m[2],d:+m[3],mixed:true,pn:+m[2],pd:+m[3]};
  m=s.replace(/ /g,'').match(/^(-?\d+)\/(\d+)$/); if(m) return {n:+m[1],d:+m[2]};
  return null;
}
const fracSimplest=f=>f&&(f.mixed?gcd(f.pn,f.pd)===1:gcd(f.n,f.d)===1);
/* polynomial (degree ≤2) in variable v; coefficients may be fractions like 1/2 */
function parsePoly(raw,v='x'){
  let s=String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/²/g,'^2').replace(/\*\*/g,'^').replace(/\*/g,'');
  s=s.replace(/^[a-z]=/,'').replace(/^[a-z]\(n\)=/,'').replace(/^tn=|^un=/,'');
  if(!s) return null;
  if(!/^[+-]/.test(s)) s='+'+s;
  const terms=s.match(/[+-][^+-]+/g);
  if(!terms||terms.join('')!==s) return null;
  const c=[0,0,0];
  for(const t of terms){
    const sg=t[0]==='-'?-1:1; let b=t.slice(1), deg=0;
    if(b.endsWith(v+'^2')){deg=2;b=b.slice(0,-3)} else if(b.endsWith(v)){deg=1;b=b.slice(0,-1)}
    let k;
    if(b==='') k=deg?1:NaN;
    else if(/^\d*\.?\d+\/\d*\.?\d+$/.test(b)){const [p,q]=b.split('/');k=+p/+q}
    else k=/^\d*\.?\d+$/.test(b)?Number(b):NaN;
    if(!isFinite(k)) return null;
    c[2-deg]+=sg*k;
  }
  return c;
}
function parseIndex(raw){
  const s=String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-');
  const m=s.match(/^x\^?(-?\d+)$/)||s.match(/^(-?\d+)$/);
  return m?+m[1]:NaN;
}
function parseSF(raw){
  let s=String(raw).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/[×*]/g,'x');
  let m=s.match(/^(-?\d*\.?\d+)x10\^?(-?\d+)$/)||s.match(/^(-?\d*\.?\d+)e(-?\d+)$/);
  if(m) return {m:+m[1],e:+m[2],v:+m[1]*Math.pow(10,+m[2])};
  const v=parseNum(s); return isFinite(v)?{m:v,e:0,v,plain:true}:null;
}
function parseSurd(raw){
  const s=String(raw).toLowerCase().replace(/\s+/g,'').replace(/sqrt|root|rt/g,'√').replace(/[()]/g,'').replace(/[×*x]/g,'');
  const m=s.match(/^(\d*)√(\d+)$/); if(!m) return null;
  return {k:m[1]===''?1:+m[1],r:+m[2]};
}
const near=(v,t,tol)=>isFinite(v)&&Math.abs(v-t)<=tol+1e-9;
const quadHTML=(a,b,c,v='x')=>{
  const parts=[];
  if(a) parts.push((a===1?'':a===-1?'−':neg(a))+v+'²');
  if(b) parts.push((parts.length?(b<0?' − ':' + '):(b<0?'−':''))+(Math.abs(b)===1?'':Math.abs(b))+v);
  if(c||!parts.length) parts.push((parts.length?(c<0?' − ':' + '):(c<0?'−':''))+Math.abs(c));
  return parts.join('');
};

/* ---------- algebraic answers: compile a typed expression and compare it with a model by evaluation ---------- */
function compileExpr(raw,vars=[]){
  let s=String(raw).toLowerCase().replace(/−/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');
  s=s.replace(/^[a-z]=/,'');
  if(!s) return null;
  const V=vars.map(v=>v.toLowerCase()), toks=[];
  for(let i=0;i<s.length;){
    const ch=s[i];
    if(/[0-9.]/.test(ch)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const t=s.slice(i,j);if(!/^(\d+\.?\d*|\.\d+)$/.test(t))return null;toks.push({t:'n',v:parseFloat(t)});i=j;continue}
    if(s.startsWith('sqrt',i)){toks.push({t:'sqrt'});i+=4;continue}
    if(s.startsWith('pi',i)&&!V.includes('p')){toks.push({t:'n',v:Math.PI});i+=2;continue}
    if(ch==='π'){toks.push({t:'n',v:Math.PI});i++;continue}
    if(ch==='√'){toks.push({t:'sqrt'});i++;continue}
    if(ch==='²'){toks.push({t:'^'},{t:'n',v:2});i++;continue}
    if(ch==='³'){toks.push({t:'^'},{t:'n',v:3});i++;continue}
    if(/[a-z]/.test(ch)){if(!V.includes(ch))return null;toks.push({t:'v',v:ch});i++;continue}
    if('+-*/^()'.includes(ch)){toks.push({t:ch});i++;continue}
    return null;
  }
  let p=0;
  const peek=()=>toks[p], eat=t=>{if(toks[p]&&toks[p].t===t){p++;return true}return false};
  const starts=k=>k&&(k.t==='n'||k.t==='v'||k.t==='('||k.t==='sqrt');
  function expr(){let f=term();if(!f)return null;while(peek()&&(peek().t==='+'||peek().t==='-')){const op=toks[p++].t,g=term();if(!g)return null;const a=f;f=op==='+'?e=>a(e)+g(e):e=>a(e)-g(e)}return f}
  function term(){let f=unary();if(!f)return null;for(;;){const k=peek();
    if(k&&(k.t==='*'||k.t==='/')){p++;const g=unary();if(!g)return null;const a=f;f=k.t==='*'?e=>a(e)*g(e):e=>a(e)/g(e)}
    else if(starts(k)){const g=power();if(!g)return null;const a=f;f=e=>a(e)*g(e)}
    else break}return f}
  function unary(){if(eat('-')){const g=unary();return g&&(e=>-g(e))}if(eat('+'))return unary();return power()}
  function power(){const b=primary();if(!b)return null;if(eat('^')){const x=unary();if(!x)return null;return e=>Math.pow(b(e),x(e))}return b}
  function primary(){const k=toks[p];if(!k)return null;
    if(k.t==='n'){p++;const v=k.v;return ()=>v}
    if(k.t==='v'){p++;const n=k.v;return e=>e[n]}
    if(k.t==='('){p++;const f=expr();if(!f||!eat(')'))return null;return f}
    if(k.t==='sqrt'){p++;const g=power();return g&&(e=>Math.sqrt(g(e)))}
    return null}
  const f=expr(); return f&&p===toks.length?f:null;
}
function sameFn(f,model,vars,o={}){
  const [lo,hi]=o.range||[1.3,4.7]; let ok=0;
  for(let i=0;i<14&&ok<5;i++){
    const e={}; vars.forEach(v=>e[v.toLowerCase()]=lo+Math.random()*(hi-lo));
    const want=model(e); if(!isFinite(want)||Math.abs(want)>1e9) continue;
    const got=f(e); if(!isFinite(got)||Math.abs(got-want)>1e-6*Math.max(1,Math.abs(want))) return false;
    ok++;
  }
  return ok>=3;
}
const exprEq=(raw,model,vars,o)=>{const f=compileExpr(raw,vars);return !!f&&sameFn(f,model,vars,o)};
const exactVal=raw=>{const f=compileExpr(raw,[]);return f?f({}):NaN}; // "√3/2" → 0.866…
const isDecimalTyped=raw=>/\d\.\d/.test(String(raw));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const choiceField=(label,opts)=>({label,type:'choice',options:shuffle(opts)});
const colv=(a,b)=>`<span class="colv"><span>${neg(a)}</span><span>${neg(b)}</span></span>`;

 Each returns: {marks, prompt, ans(html), steps:[[code,html]], traps:[...], hint?, diagram?,

const G={};
const multi=(raws,vals,tol,ordered)=>{ // do numeric answers match vals?
  const v=raws.map(parseNum);
  if(v.some(x=>!isFinite(x))) return false;
  if(ordered) return vals.every((t,i)=>near(v[i],t,tol));
  const a=[...v].sort((p,q)=>p-q), b=[...vals].sort((p,q)=>p-q);
  return b.every((t,i)=>near(a[i],t,tol));
};

G.frac=()=>{
  let a,b,c,d,minus;
  do{b=R(2,9);d=R(2,9);a=R(1,b-1);c=R(1,d-1);minus=Math.random()<.35}while(b===d||gcd(a,b)>1||gcd(c,d)>1||(minus&&a/b<=c/d));
  const L=lcm(b,d), A=a*L/b, C=c*L/d, N=minus?A-C:A+C, g=gcd(N,L), n=N/g, dd=L/g, op=minus?'−':'+', v=n/dd;
  const ansHTML=fr(n,dd)+(n>dd?` = ${Math.floor(n/dd)}${fr(n%dd,dd)}`:'');
  const F=parseFrac;
  return {marks:3, ans:ansHTML,
   check:raw=>{const f=F(raw);return !!f&&Math.abs(f.n/f.d-v)<1e-9&&fracSimplest(f)},
   prompt:`Work out &nbsp;<span class="eq">${fr(a,b)} ${op} ${fr(c,d)}</span><br>Give your answer as a fraction in its simplest form.`,
   traps:[
    {test:raw=>{const f=F(raw);return f&&f.n===(minus?a-c:a+c)&&f.d===(minus?Math.abs(b-d):b+d)},id:'frac-add',note:`Adding or subtracting the tops and bottoms separately doesn't combine fractions. Use a common denominator of ${L}.`},
    {test:raw=>{const f=F(raw);return f&&f.d===L&&f.n===(minus?a-c:a+c)},id:'numerator-not-scaled'},
    {test:raw=>{const f=F(raw);return f&&Math.abs(f.n/f.d-v)<1e-9&&!fracSimplest(f)},id:'not-simplified',note:`Divide top and bottom by their HCF to get ${fr(n,dd)}.`},
    {test:raw=>!/\//.test(raw)&&near(parseNum(raw),v,.0051),id:'wrong-form',note:'The question asks for a fraction. A decimal answer can lose the accuracy mark.'}],
   steps:[['M1',`Common denominator ${L}: &nbsp;${fr(a,b)} = ${fr(A,L)}, &nbsp;${fr(c,d)} = ${fr(C,L)}`],['M1',`${fr(A,L)} ${op} ${fr(C,L)} = ${fr(N,L)}`],['A1',`<b>${ansHTML}</b>`]],
   hint:'Type fractions with a slash, e.g. 11/12 or 1 5/12.'};
};
G.hcf=()=>{
  const p2=[R(1,4),R(0,3)], p3=[R(0,3),R(1,2)], p5=[R(0,1),R(0,2)];
  const A=2**p2[0]*3**p3[0]*5**p5[0], B=2**p2[1]*3**p3[1]*5**p5[1];
  if(A===B) return G.hcf();
  const H=gcd(A,B), L=lcm(A,B), askH=Math.random()<.5;
  const pf=(e)=>[[2,e[0]],[3,e[1]],[5,e[2]]].filter(x=>x[1]).map(([p,k])=>k>1?`${p}<sup>${k}</sup>`:p).join(' × ');
  return {marks:2, ansV:askH?H:L, tol:1e-9, ans:''+(askH?H:L),
   prompt:`Find the <b>${askH?'highest common factor (HCF)':'lowest common multiple (LCM)'}</b> of <b>${A}</b> and <b>${B}</b>.`,
   traps:[{v:askH?L:H,id:'hcf-lcm'},{v:A*B,id:'wrong-operation',note:`${A} × ${B} is a common multiple, but not the lowest one.`}],
   steps:[['M1',`${A} = ${pf([p2[0],p3[0],p5[0]])}, &nbsp;${B} = ${pf([p2[1],p3[1],p5[1]])}`],
          ['A1',askH?`HCF: lowest power of each shared prime = <b>${H}</b>`:`LCM: highest power of every prime = <b>${L}</b>`]]};
};

G.sf=()=>{
  let a=NOCALC?pick([1.2,1.5,2,2.5,3,4,4.5,6,8]):R(12,95)/10, b=NOCALC?pick([2,3,4,5,1.5,2.5]):R(12,95)/10; const m=R(2,8), n=R(-6,6)||3, div=Math.random()<.35;
  if(div&&a<b){[a,b]=[b,a]}
  let val=div?a/b:a*b, e=div?m-n:m+n, em=val;
  while(em>=10){em/=10;e++} while(em<1){em*=10;e--}
  const exact=Math.abs(em*100-Math.round(em*100))<1e-9;
  let raw=Math.round(em*100)/100; if(raw>=10){raw=r2(raw/10);e++}

   traps:[

    {test:s=>{const p=parseSF(s);return p&&!p.plain&&p.e===(div?m/n:m*n)},id:'index-law',note:`Powers of ten follow the index laws: ${div?'subtract':'add'} the powers, ${m} ${div?'−':'+'} ${neg(n)}.`}],
   steps:[['M1',`${a} ${div?'÷':'×'} ${b} = ${dp(unadj)}, &nbsp;${sup(m)} ${div?'÷':'×'} ${sup(n)} = ${sup(div?m-n:m+n)}`],['A1',`Adjust so the front number is between 1 and 10: <b>${raw} × ${sup(e)}</b>`]],

G.fracind=()=>{
  const q=pick([2,2,3]), k=q===2?R(2,6):R(2,4), p=pick([1,2,3]), negI=Math.random()<.7, base=k**q;

   prompt:`Work out the exact value of &nbsp;<span class="eq">${base}<sup>${idx}</sup></span>`,
   traps:[{v:negI?pw:1/pw,id:'negative-index'},{v:negI?-pw:-1/pw,id:'negative-index',note:'A negative index doesn\'t make the answer negative. It means take the reciprocal.'},
          {v:base*p/q,id:'fractional-index',note:`${base}<sup>${idx}</sup> is not ${base} × ${p}/${q}. The ${q} means ${q===2?'square':'cube'} root.`},
          {v:negI?1/k:k,id:'fractional-index',note:`You found the ${q===2?'square':'cube'} root but didn't raise it to the power ${p}.`}],
   steps:[['M1',`${q===2?'√':'∛'}${base} = ${k}`],['M1',`${k}<sup>${p}</sup> = ${pw}`],['A1',negI?`Negative index → reciprocal: <b>${fr(1,pw)}</b>`:`<b>${pw}</b>`]],

};

G.recur=()=>{

     prompt:`Write &nbsp;<span class="eq">0.${s[0]}̇${s[1]}̇</span>&nbsp; (= 0.${s}${s}${s}…) as a fraction in its simplest form.`,
     traps:[{test:raw=>{const f=parseFrac(raw);return f&&Math.abs(f.n/f.d-ab/100)<1e-12},id:'recurring-terminating'},
            {test:raw=>{const f=parseFrac(raw);return f&&Math.abs(f.n/f.d-ab/90)<1e-12},id:'recurring-subtract',note:'The block "'+s+'" has two digits, so multiply by 100, not 10.'},
            {test:raw=>{const f=parseFrac(raw);return f&&Math.abs(f.n/f.d-ab/99)<1e-12&&!fracSimplest(f)},id:'not-simplified'}],

     hint:'Type the fraction, e.g. 47/99'};

G.nthquad=()=>{
  const a=pick([1,1,2,3]), b=R(-6,6), c=R(-8,10);
  const t=[1,2,3,4,5].map(n=>a*n*n+b*n+c), q=raw=>parsePoly(raw,'n');

  return {marks:4, ans:quadHTML(a,b,c,'n'),
   check:raw=>{const p=q(raw);return !!p&&p[0]===a&&p[1]===b&&p[2]===c},
   prompt:`Here are the first five terms of a quadratic sequence:<br><span class="nums">${t.map(neg).join(', &nbsp;')}</span><br>Find an expression for the <b>nth term</b>.`,
   traps:[{test:raw=>{const p=q(raw);return p&&p[0]===d2&&d2!==a},id:'second-difference'},
          {test:raw=>{const p=q(raw);return p&&p[0]===a&&(p[1]!==b||p[2]!==c)&&p[1]===-b},id:'sign-error'}],
   steps:[['M1',`First differences ${d1.map(neg).join(', ')}; second difference ${d2}`],['M1',`Coefficient of n² = ${d2} ÷ 2 = ${a}`],['M1',`Sequence − ${a===1?'':a}n²: ${rest.map(neg).join(', ')} → nth term ${quadHTML(0,b,c,'n')}`],['A1',`<b>${quadHTML(a,b,c,'n')}</b>`]],
   hint:'Type n^2 for n², e.g. 2n^2 − 3n + 4'};

G.simlin=()=>{
  let a,b,d,e,x,y;
  do{a=R(1,5);b=pick([-4,-3,-2,-1,1,2,3,4,5]);d=R(1,5);e=pick([-4,-3,-2,-1,1,2,3,4,5]);x=R(-5,7);y=R(-5,7)}while(a*e-b*d===0||x===y||a===d&&b===e);
  const c=a*x+b*y, f=d*x+e*y, t=(p,q)=>`${p===1?'':p}x ${q<0?'−':'+'} ${Math.abs(q)===1?'':Math.abs(q)}y`;
  return {marks:4, fields:[{label:'x ='},{label:'y ='}], ans:`x = ${neg(x)}, y = ${neg(y)}`,
   check:r=>multi(r,[x,y],1e-9,true),
   prompt:`Solve the simultaneous equations<br><span class="eq">${t(a,b)} = ${neg(c)}</span><br><span class="eq">${t(d,e)} = ${neg(f)}</span>`,
   traps:[{test:r=>multi(r,[y,x],1e-9,true),id:'swapped'},
          {test:r=>near(parseNum(r[0]),x,1e-9)&&!near(parseNum(r[1]),y,1e-9),id:'stopped-early',note:`x = ${neg(x)} is right. Substitute it back into either equation to find y.`},
          {test:r=>near(parseNum(r[1]),y,1e-9)&&!near(parseNum(r[0]),x,1e-9),id:'stopped-early',note:`y = ${neg(y)} is right. Substitute it back into either equation to find x.`}],
   steps:[['M1',`Make the y coefficients match: (1) × ${Math.abs(e)}, (2) × ${Math.abs(b)}`],['M1',`Eliminate y: ${a*e-b*d<0?'−':''}${Math.abs(a*e-b*d)}x = ${neg(c*e-b*f)} → x = ${neg(x)}`],['M1',`Substitute: ${a===1?'':a}(${neg(x)}) ${b<0?'−':'+'} ${Math.abs(b)===1?'':Math.abs(b)}y = ${neg(c)}`],['A1',`<b>x = ${neg(x)}, y = ${neg(y)}</b>`]]};
};
G.qform=()=>{
  let a,b,c,D; do{a=pick([1,1,2,3]);b=R(-9,9);c=R(-9,9);D=b*b-4*a*c}while(!c||D<=0||Number.isInteger(Math.sqrt(D)));
  const x1=(-b+Math.sqrt(D))/(2*a), x2=(-b-Math.sqrt(D))/(2*a);
  return {marks:3, fields:[{label:'x ='},{label:'x ='}], ans:`x = ${r2(x1).toFixed(2)} or x = ${r2(x2).toFixed(2)}`,
   check:r=>multi(r,[r2(x1),r2(x2)],.0051),
   prompt:`Solve &nbsp;<span class="eq">${quadHTML(a,b,c)} = 0</span><br>Give your solutions correct to 2 decimal places.`,
   traps:[{test:r=>multi(r,[-x1,-x2],.006),id:'sign-error',note:`The formula starts with −b. Here b = ${neg(b)}, so −b = ${neg(-b)}.`},
          {test:r=>multi(r,[-b+Math.sqrt(D)/(2*a),-b-Math.sqrt(D)/(2*a)],.006),id:'qformula-division'},
          {test:r=>multi(r,[x1,x2],.06)&&!multi(r,[r2(x1),r2(x2)],.0051),id:'rounding'}],
   steps:[['M1',`a = ${a}, b = ${neg(b)}, c = ${neg(c)}: &nbsp;x = ${fr(`${neg(-b)} ± √(${b<0?'('+neg(b)+')':b}² − 4 × ${a} × ${c<0?'('+neg(c)+')':c})`,`2 × ${a}`)}`],['M1',`b² − 4ac = ${D}, &nbsp;x = ${fr(`${neg(-b)} ± √${D}`,2*a)}`],['A1',`<b>x = ${r2(x1).toFixed(2)}</b> or <b>x = ${r2(x2).toFixed(2)}</b>`]]};
};
G.csq=()=>{
  const p=R(-6,6)||4, b=2*p, c=R(-12,15), q=c-p*p;
  return {marks:3, fields:[{label:'p ='},{label:'q ='}], ans:`(x ${sgn(p)})² ${sgn(q)}`,
   check:r=>multi(r,[p,q],1e-9,true),
   prompt:`Write &nbsp;<span class="eq">${quadHTML(1,b,c)}</span>&nbsp; in the form &nbsp;<span class="eq">(x + p)² + q</span>`,
   traps:[{test:r=>near(parseNum(r[0]),p,1e-9)&&near(parseNum(r[1]),c+p*p,1e-9),id:'sign-error',note:`(x ${sgn(p)})² gives an extra ${p*p}, so subtract it: ${c} − ${p*p} = ${q}.`},
          {test:r=>near(parseNum(r[0]),b,1e-9),id:'csq-half'},
          {test:r=>near(parseNum(r[0]),-p,1e-9)&&near(parseNum(r[1]),q,1e-9),id:'sign-error',note:`Expanding (x + p)² gives 2px, so p has the same sign as ${neg(b)}: p = ${neg(p)}.`}],
   steps:[['M1',`Half of ${neg(b)} is ${neg(p)}: (x ${sgn(p)})² = ${quadHTML(1,b,p*p)}`],['M1',`${quadHTML(1,b,c)} = (x ${sgn(p)})² − ${p*p} ${sgn(c)}`],['A1',`<b>(x ${sgn(p)})² ${sgn(q)}</b> &nbsp;so p = ${neg(p)}, q = ${neg(q)}`],['alt',`The turning point is (${neg(-p)}, ${neg(q)})`]]};
};
G.qineq=()=>{
  let r1_,r2_; do{r1_=R(-7,6);r2_=R(-6,8)}while(r1_>=r2_);
  const B=-(r1_+r2_), C=r1_*r2_, less=Math.random()<.5, strict=Math.random()<.6;
  const sym=less?(strict?'&lt;':'≤'):(strict?'&gt;':'≥');
  const regions=['Between the two values','Outside the two values'];
  const want=less?0:1;
  const ansTxt=less?`${neg(r1_)} ${strict?'&lt;':'≤'} x ${strict?'&lt;':'≤'} ${neg(r2_)}`:`x ${strict?'&lt;':'≤'} ${neg(r1_)} or x ${strict?'&gt;':'≥'} ${neg(r2_)}`;
  const vals=r=>[parseNum(r[0]),parseNum(r[1])];
  return {marks:3, fields:[{label:'Critical values',type:'pair'},{label:'Solution is',type:'choice',options:regions}], ans:ansTxt,
   check:r=>multi([r[0],r[1]],[r1_,r2_],1e-9)&&r[2]===regions[want],
   prompt:`Solve &nbsp;<span class="eq">${quadHTML(1,B,C)} ${sym} 0</span><br>Enter the two critical values, then choose which region solves the inequality.`,
   traps:[{test:r=>multi([r[0],r[1]],[r1_,r2_],1e-9)&&r[2]!==regions[want],id:'inequality-region'},
          {test:r=>multi([r[0],r[1]],[-r1_,-r2_],1e-9),id:'sign-error',note:`Factorise first: (x ${sgn(-r1_)})(x ${sgn(-r2_)}). Each bracket is zero when x is the opposite sign.`}],
   steps:[['M1',`Factorise: (x ${sgn(-r1_)})(x ${sgn(-r2_)}) ${sym} 0, so the critical values are ${neg(r1_)} and ${neg(r2_)}`],['M1',`Sketch the U-shaped curve: it is ${less?'below':'above'} the x-axis ${less?'between':'outside'} the roots`],['A1',`<b>${ansTxt}</b>`]]};
};
G.perp=()=>{
  const m=pick([2,3,4,-2,-3,-4,1/2,-1/2,1/3,-1/3,2/3,-3/2]), mp=-1/m;
  const den=toFrac(mp)[1]; const px=den*R(-3,3)||den*2, py=R(-6,8), c=py-mp*px;
  const parseM=s=>parseNum(s);
  return {marks:4, fields:[{label:'m ='},{label:'c ='}], ans:`y = ${fmtCoef(mp,'x')} ${sgn(c)}`,
   check:r=>near(parseM(r[0]),mp,1e-9)&&near(parseNum(r[1]),c,1e-9),
   prompt:`Line L has equation &nbsp;<span class="eq">y = ${fmtCoef(m,'x')} ${sgn(R(-5,5)||1)}</span><br>Find the equation of the line perpendicular to L that passes through <b>(${neg(px)}, ${neg(py)})</b>. Give it in the form y = mx + c.`,
   traps:[{test:r=>near(parseM(r[0]),m,1e-9),id:'perp-gradient',note:'That is the gradient of a parallel line. Perpendicular means flip and change the sign.'},
          {test:r=>near(parseM(r[0]),-m,1e-9),id:'perp-gradient',note:'You changed the sign but didn\'t take the reciprocal.'},
          {test:r=>near(parseM(r[0]),1/m,1e-9),id:'perp-gradient',note:'You took the reciprocal but didn\'t change the sign.'},
          {test:r=>near(parseM(r[0]),mp,1e-9)&&!near(parseNum(r[1]),c,1e-9),id:'sign-error',note:`Gradient correct. Now substitute (${neg(px)}, ${neg(py)}): ${neg(py)} = ${frS(...toFrac(mp))} × ${px<0?'('+neg(px)+')':px} + c.`}],
   steps:[['M1',`Gradient of L = ${frS(...toFrac(m))}, so perpendicular gradient = ${frS(...toFrac(mp))}`],['M1',`${neg(py)} = ${frS(...toFrac(mp))} × ${px<0?'('+neg(px)+')':px} + c`],['M1',`c = ${neg(c)}`],['A1',`<b>y = ${fmtCoef(mp,'x')} ${sgn(c)}</b>`]],
   hint:'Fractions are fine for m, e.g. -1/2'};
};
G.comp=()=>{
  const a=R(2,5), b=R(-6,7)||3, c=R(-5,6), k=R(-3,4);
  const f=x=>a*x+b, g=x=>x*x+c;
  return {marks:2, ansV:f(g(k)), tol:1e-9, ans:''+neg(f(g(k))),
   prompt:`<span class="eq">f(x) = ${a}x ${sgn(b)}</span> &nbsp; and &nbsp; <span class="eq">g(x) = ${quadHTML(1,0,c)}</span><br>Work out &nbsp;<span class="eq">fg(${neg(k)})</span>`,
   traps:[{v:g(f(k)),id:'composite-order'},{v:f(k)*g(k),id:'composite-multiply'},{v:g(k),id:'stopped-early',note:`${neg(g(k))} is g(${neg(k)}). Now put it into f.`}],
   steps:[['M1',`g(${neg(k)}) = ${k<0?'('+neg(k)+')':k}² ${sgn(c)} = ${neg(g(k))}`],['A1',`f(${neg(g(k))}) = ${a} × ${g(k)<0?'('+neg(g(k))+')':g(k)} ${sgn(b)} = <b>${neg(f(g(k)))}</b>`]]};
};
G.inv=()=>{
  const a=R(2,7), b=R(-9,9)||5, x0=R(-4,8), k=a*x0+b;
  return {marks:2, ansV:x0, tol:1e-9, ans:neg(x0),
   prompt:`<span class="eq">f(x) = ${a}x ${sgn(b)}</span><br>Work out &nbsp;<span class="eq">f<sup>−1</sup>(${neg(k)})</span>`,
   traps:[{v:1/k,id:'inverse-reciprocal'},{v:a*k+b,id:'inverse-reciprocal',note:`That is f(${neg(k)}). f⁻¹ undoes f.`},{v:(k+b)/a,id:'sign-error',note:`Undo ${sgn(b)} first: ${neg(k)} ${b<0?'+':'−'} ${Math.abs(b)}.`},{v:k/a-b,id:'order-error'}],
   steps:[['M1',`f<sup>−1</sup>(x) = ${fr(`x ${sgn(-b)}`,a)}`],['A1',`f<sup>−1</sup>(${neg(k)}) = ${fr(`${neg(k)} ${sgn(-b)}`,a)} = <b>${neg(x0)}</b>`]]};
};
G.iter=()=>{
  const a=R(2,6), b=R(1,9), x0=pick([1,2,3]);
  const f=x=>Math.cbrt(a*x+b); const xs=[x0]; for(let i=0;i<4;i++) xs.push(f(xs[i]));
  return {marks:3, ansV:r4(xs[3]), tol:.00006, ans:r4(xs[3]).toFixed(4),
   prompt:`Using &nbsp;<span class="eq">x<sub>n+1</sub> = ∛(${a}x<sub>n</sub> + ${b})</span>&nbsp; with &nbsp;<span class="eq">x<sub>0</sub> = ${x0}</span><br>find the value of <span class="eq">x<sub>3</sub></span>. Give your answer to 4 decimal places.`,
   traps:[{v:r4(xs[2]),id:'iteration-count',note:'That is x₂. One more iteration gives x₃.'},{v:r4(xs[4]),id:'iteration-count',note:'That is x₄. x₀ is the start, so x₃ is the third answer.'},{v:r4(xs[1]),id:'iteration-count'}],
   steps:[['M1',`x₁ = ∛(${a} × ${x0} + ${b}) = ${dp(xs[1])}`],['M1',`x₂ = ${dp(xs[2])}`],['A1',`x₃ = ${dp(xs[3])} = <b>${r4(xs[3]).toFixed(4)}</b>`],['alt','On the calculator: type the start value, =, then ∛(' + a + 'ANS + ' + b + ') and press = three times']]};
};
