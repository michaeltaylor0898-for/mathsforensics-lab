/* ===== Report a problem =====
 On every answered question ("Report a problem with this question") and anywhere else ("Report a bug").
 A question report carries the exact question, the typed answer and the expected answer, so a faulty
 generator can be found and fixed. Reports go to the owner's inbox on the Licences page. */
const APP_BUILD='2026-10-21';
const ERR_LOG=[];
window.addEventListener('error',e=>{ERR_LOG.push(String(e.message||e).slice(0,200));if(ERR_LOG.length>5)ERR_LOG.shift()});
window.addEventListener('unhandledrejection',e=>{ERR_LOG.push('Promise: '+String((e.reason&&e.reason.message)||e.reason).slice(0,200));if(ERR_LOG.length>5)ERR_LOG.shift()});
const stripHTML=h=>String(h||'').replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<span class="fr"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g,'($1)/($2)')
  .replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'\n').trim();
function questionContext(topic,Q,raws,res,where){
  return {where,topic,topicName:TOP[topic]?TOP[topic].name:topic,kind:Q.kind||null,calc:Q.calcTag||null,question:stripHTML(Q.prompt).slice(0,3000),hasDiagram:!!Q.diagram,
    expected:stripHTML(Q.ans).slice(0,400),model:Q.model||null,typed:(raws||[]).map(x=>String(x).slice(0,200)),
    verdict:res?(res.k==='trap'?'slip: '+(ERR[res.id]?ERR[res.id][0]:res.id):({ok:'marked right',no:'marked wrong',seen:'solution shown'})[res.k]||res.k):null,
    steps:(Q.steps||[]).slice(0,8).map(s=>s[0]+': '+stripHTML(s[1]).slice(0,240))};
}
const typedNow=()=>[...document.querySelectorAll('#ansForm .inp')].map(i=>i.value.trim());
function baseContext(){return {view:S.view,page:location.pathname,ua:navigator.userAgent.slice(0,200),screen:innerWidth+'×'+innerHeight,build:APP_BUILD,errors:ERR_LOG.slice()}}
const Q_REASONS=['My answer should be marked right','Mistake in the question, answer or diagram','The wording is confusing','Something else'];
const G_REASONS=['Something isn\'t working','Sign-in or account problem','Idea or suggestion','Other'];
const reportQButton=(attr='data-reportq')=>`<div class="reportq"><button class="link" type="button" ${attr}>⚑ Report a problem with this question</button></div>`;

function openFeedback(kind,qctx){
  if(!S.user){location.href='mailto:support@mathsforensics.com?subject=Maths%20Forensics%20Lab';return}
  let dlg=document.getElementById('fbDlg'); if(!dlg){dlg=document.createElement('dialog');dlg.id='fbDlg';dlg.className='fbdlg';document.body.appendChild(dlg)}
  const reasons=kind==='question'?Q_REASONS:G_REASONS;
  dlg.innerHTML=`<form method="dialog" id="fbForm" class="stack" novalidate>
    <div class="fbhead"><h2>${kind==='question'?'Report a problem with this question':'Report a bug or send feedback'}</h2><button class="link" type="button" id="fbClose" aria-label="Close">✕</button></div>
    ${kind==='question'&&qctx?`<div class="fbq"><span class="eyebrow">${esc(qctx.topicName)}</span><p>${esc(qctx.question.slice(0,280))}${qctx.question.length>280?'…':''}</p>${qctx.typed&&qctx.typed.some(Boolean)?`<p class="hint">Your answer: <b>${esc(qctx.typed.join(' · '))}</b></p>`:''}</div>`:''}
    <fieldset class="fbreasons"><legend>What's the problem?</legend>${reasons.map((r,i)=>`<label class="fbr"><input type="radio" name="fbreason" value="${esc(r)}" ${i===0?'checked':''}><span>${esc(r)}</span></label>`).join('')}</fieldset>
    <label>Tell us more <span class="hint" id="fbReq">${kind==='question'?'(optional, but it helps)':'(required)'}</span><textarea class="inp" id="fbComment" rows="4" maxlength="2000" placeholder="${kind==='question'?'For example: I wrote 3/4 and it was marked wrong.':'What happened, and what did you expect?'}"></textarea></label>
    <p class="hint">We'll include the ${kind==='question'?'question, your answer and the expected answer':'page you were on and your browser'}, so we can fix it quickly. Reports go to the Maths Forensics team, not your teacher.</p>
    <p class="formerr" hidden></p>
    <div class="row"><button class="btn" type="submit">Send report</button><button class="ghost" type="button" id="fbCancel">Cancel</button></div></form>`;
  const close=()=>dlg.close();
  dlg.querySelector('#fbClose').onclick=close; dlg.querySelector('#fbCancel').onclick=close;
  const f=dlg.querySelector('#fbForm');
  f.onsubmit=e=>{e.preventDefault();
    const reason=(f.querySelector('input[name=fbreason]:checked')||{}).value||reasons[0], comment=f.querySelector('#fbComment').value.trim();
    if((kind==='general'||/^Something else|^Other/.test(reason))&&!comment){formErr(f,'Please tell us a little more, so we can help.');return}
    busy(f,async()=>{
      await api.submitReport({kind,reason,comment,context:{...baseContext(),...(qctx?{question:qctx}:{})}});
      dlg.innerHTML=`<div class="stack fbdone"><h2>Thanks, detective.</h2><p>We read every report${kind==='question'?' and check the question':''}. If we need more details, we'll email <b>${esc(S.user.email)}</b>.</p><div class="row"><button class="btn" type="button" id="fbOk">Back to the Lab</button></div></div>`;
      dlg.querySelector('#fbOk').onclick=close;
    });
  };
  if(typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
  setTimeout(()=>{const c=dlg.querySelector('#fbComment');if(c&&matchMedia('(pointer:fine)').matches)c.focus()},30);
}

/* ===== Class lists: bulk import of students from a CSV or a pasted list =====
   Works with exports from Google Workspace, Microsoft 365, SIMS, Arbor, iSAMS, Bromcom or a plain spreadsheet.
   Columns are recognised by their headings; without headings, the column with @ signs is the email. */
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const first=text.split('\n').find(l=>l.trim())||'';
  const count=ch=>(first.match(new RegExp('\\'+ch,'g'))||[]).length;
  const delim=[['\t',count('\t')],[';',count(';')],[',',count(',')]].sort((a,b)=>b[1]-a[1])[0];
  const d=delim[1]?delim[0]:',';
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=ch; continue }
    if(ch==='"'&&cell==='') q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(c=>c));
}
const EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const ROSTER_HEADS={
  email:[/^e-?mail( address)?( \[required\])?$/,/primary e-?mail/,/^(school |student )?e-?mail/,/user ?principal ?name|^upn$/,/^mail$/,/e-?mail/],
  full:[/^(full |display |student |pupil )?name$/,/^legal name$/,/^preferred name$/,/^name \(.*\)$/],
  first:[/^(legal |preferred )?(first ?name|forename|given ?name)( \[required\])?$/,/first|forename|given/],
  last:[/^(legal |preferred )?(last ?name|surname|family ?name)( \[required\])?$/,/last name|surname|family/],
  cls:[/^(maths |math )?(class|set|teaching group|group)( name| code)?$/,/teaching group|^class|maths set|^set$/,/^(reg(istration)?|tutor|form) ?(group|class)?$/,/org unit path/],
};
function detectColumns(rows){
  const head=(rows[0]||[]).map(h=>h.toLowerCase().replace(/\s+/g,' ').trim());
  const hasHeader=head.length&&!head.some(h=>EMAIL_RE.test(h));
  const col={email:-1,full:-1,first:-1,last:-1,cls:-1,header:hasHeader};
  if(hasHeader){
    const used=new Set();
    for(const k of ['email','first','last','full','cls']){
      for(const re of ROSTER_HEADS[k]){const i=head.findIndex((h,j)=>!used.has(j)&&re.test(h)); if(i>=0){col[k]=i;used.add(i);break}}
    }
  }
  const body=hasHeader?rows.slice(1):rows;
  if(col.email<0){ // no heading: the column where most values are email addresses
    const n=Math.max(...rows.map(r=>r.length),0); let best=-1,score=0;
    for(let j=0;j<n;j++){const sc=body.filter(r=>EMAIL_RE.test(r[j]||'')).length; if(sc>score){best=j;score=sc}}
    col.email=best;
  }
  if(!hasHeader&&col.email>=0){ // plain list: "Name, email" or "email, Name" or "email, name, class"
    const others=[...Array(Math.max(...body.map(r=>r.length),0)).keys()].filter(j=>j!==col.email);
    if(others[0]!==undefined) col.full=others[0];
    if(others[1]!==undefined) col.cls=others[1];
  }
  return col;
}
const normClass=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function matchClass(raw,classes){
  if(!raw) return null;
  let v=String(raw).trim(); if(v.includes('/')) v=v.split('/').filter(Boolean).pop()||v;  // Google org unit path
  const n=normClass(v); if(!n) return null;
  return classes.find(c=>normClass(c.name)===n)
      || classes.find(c=>normClass(c.name.split(/[·\-–|(]/)[0])===n)
      || classes.find(c=>normClass(c.name).startsWith(n)&&n.length>=3)
      || null;
}
/* Turn pasted text or a CSV into rows ready to import.
   fixedClass: put everyone in this class (teacher adding to their own class). fallbackClass: for rows whose class isn't recognised. */
function buildRosterRows(text,classes,{fixedClass=null,fallbackClass=null,existing=[]}={}){
  const rows=parseCSV(text); if(!rows.length) return {rows:[],col:null};
  const col=detectColumns(rows), body=col.header?rows.slice(1):rows, seen=new Set();
  const listed=new Set(existing.map(r=>r.class_id+'|'+String(r.email).toLowerCase()));
  const out=body.slice(0,2500).map((r,i)=>{
    let email, name, rawClass;
    if(!col.header){ // a pasted list: find the email in each row, the other cells are name then class
      const ei=r.findIndex(c=>EMAIL_RE.test(c)), rest=r.filter((c,j)=>j!==ei&&c);
      email=String(ei>=0?r[ei]:(r[col.email]||'')).trim().toLowerCase(); name=rest[0]||''; rawClass=rest[1]||'';
    } else {
      email=String(r[col.email]||'').trim().toLowerCase();
      name=col.full>=0?r[col.full]||'':[r[col.first]||'',r[col.last]||''].join(' ');
      rawClass=col.cls>=0?r[col.cls]||'':'';
    }
    name=name.replace(/\s+/g,' ').trim();
    if(/^[^,]+,\s*[^,]+$/.test(name)) name=name.split(',').map(x=>x.trim()).reverse().join(' '); // "Surname, Forename"
    if(EMAIL_RE.test(name)) name='';
    const c=fixedClass||matchClass(rawClass,classes)||fallbackClass;
    let problem='';
    if(!email) problem='No email address';
    else if(!EMAIL_RE.test(email)) problem='Not a valid email address';
    else if(!c) problem=rawClass?`No class called "${rawClass}"`:'No class given';
    const key=(c?c.id:'')+'|'+email;
    let note='';
    if(!problem&&seen.has(key)) problem='Listed twice in this file';
    else if(!problem&&listed.has(key)) note='Already on the list';
    seen.add(key);
    return {line:i+(col.header?2:1),name:name.slice(0,80),email,rawClass,class_id:c?c.id:null,className:c?c.name:'',problem,note};
  });
  return {rows:out,col,truncated:body.length>2500};
}

function bindImporter(o){
  const id=o.id||'imp', box=document.getElementById(id); if(!box) return;
  const ta=$(`#${id}-text`), fb=$(`#${id}-fallback`), pv=$(`#${id}-preview`);
  let built=null;
  const refresh=()=>{
    const fallbackClass=fb&&fb.value?o.classes.find(c=>c.id===fb.value):null;
    built=buildRosterRows(ta.value,o.classes,{fixedClass:o.fixedClass,fallbackClass,existing:o.existing||[]});
    pv.innerHTML=previewHTML(built,o);
    const go=pv.querySelector('[data-import]'); if(go) go.onclick=doImport;
  };
  const doImport=async()=>{
    const ready=built.rows.filter(r=>!r.problem&&!r.note);
    const btn=pv.querySelector('[data-import]'); btn.disabled=true; btn.textContent='Adding…';
    try{
      const res=await api.rosterAdd(ready.map(r=>({class_id:r.class_id,email:r.email,name:r.name})));
      pv.innerHTML=`<div class="impdone"><b>✓ ${res.added} student${res.added===1?'':'s'} added to the class list${res.added===1?'':'s'}.</b>
        <p>${res.joined_now?`${res.joined_now} already had an account and ${res.joined_now===1?'is':'are'} in their class now. `:''}Everyone else joins automatically the first time they sign in with that email, using Google, Microsoft or an email and password. No emails have been sent.</p>
        ${res.skipped&&res.skipped.length?`<details open><summary>${res.skipped.length} to check</summary><ul>${res.skipped.map(x=>`<li><b>${esc(x.email)}</b>: ${esc(x.reason)}</li>`).join('')}</ul></details>`:''}</div>`;
      ta.value='';
      if(o.onDone) setTimeout(()=>{if(document.body.contains(box))o.onDone()},res.skipped&&res.skipped.length?4000:1600);
    }catch(e){btn.disabled=false;btn.textContent='Try again';alertBox(e.message)}
  };
  ta.oninput=refresh; if(fb) fb.onchange=refresh;
  $(`#${id}-file`).onchange=e=>{const f=e.target.files[0]; if(!f) return;
    if(f.size>2e6){alertBox('That file is too big. Export just the students you need (2,000 at most).');return}
    const rd=new FileReader(); rd.onload=()=>{ta.value=String(rd.result);refresh()}; rd.readAsText(f)};
}
function previewHTML(b,o){
  if(!b.rows.length) return '';
  const ready=b.rows.filter(r=>!r.problem&&!r.note), bad=b.rows.filter(r=>r.problem), dup=b.rows.filter(r=>r.note);
  const c=b.col, colNote=c&&c.header?`<p class="hint">Found columns: email${c.first>=0||c.full>=0?', name':''}${c.cls>=0&&!o.fixedClass?', class':''}.</p>`:'';
  const seatsLeft=o.seats!=null?Math.max(0,o.seats-o.seatsUsed):null;
  const seatWarn=seatsLeft!=null&&ready.length>seatsLeft?`<p class="impwarn">This list has ${ready.length} new students, but only ${seatsLeft} seat${seatsLeft===1?' is':'s are'} free. Students will join until the seats run out. Email support@mathsforensics.com to add seats.</p>`:'';
  const show=[...bad,...ready,...dup].slice(0,300);
  return `<div class="impsum"><span class="ok">${ready.length} ready</span>${bad.length?`<span class="bad">${bad.length} to fix</span>`:''}${dup.length?`<span>${dup.length} already listed</span>`:''}</div>
    ${colNote}${seatWarn}
    <div class="tablewrap impwrap"><table class="plain imptable"><thead><tr><th>Row</th><th>Name</th><th>Email</th>${o.fixedClass?'':'<th>Class</th>'}<th>Status</th></tr></thead><tbody>
    ${show.map(r=>`<tr class="${r.problem?'bad':r.note?'dim':''}"><td class="num">${r.line}</td><td>${esc(r.name)||'<span class="hint">from their Google/Microsoft account</span>'}</td><td>${esc(r.email)}</td>${o.fixedClass?'':`<td>${esc(r.className||r.rawClass)}</td>`}<td>${r.problem?esc(r.problem):r.note?esc(r.note):'Ready'}</td></tr>`).join('')}
    </tbody></table></div>${b.rows.length>300?`<p class="hint">Showing the first 300 rows.</p>`:''}${b.truncated?`<p class="impwarn">Only the first 2,500 rows were read. Import large lists in parts.</p>`:''}
    <div class="row"><button class="btn" type="button" data-import ${ready.length?'':'disabled'}>Add ${ready.length} student${ready.length===1?'':'s'}</button>${bad.length?'<span class="hint">Rows to fix are left out. Correct them in the box above, or import them later.</span>':''}</div>`;
}

/* ===== Reports: class, student and school, for a date range. Print or save as PDF, or download a CSV. ===== */
const RANGES=[['7d','Last 7 days'],['28d','Last 4 weeks'],['term','This term'],['year','This school year'],['custom','Custom dates']];
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function termStart(now=new Date()){const y=now.getFullYear(),m=now.getMonth();return m>=8?new Date(y,8,1):m<=2?new Date(y,0,1):new Date(y,3,1)}
function yearStart(now=new Date()){return new Date(now.getMonth()>=8?now.getFullYear():now.getFullYear()-1,8,1)}
function rangeFor(R){
  const now=new Date(), end=new Date(sod(now).getTime()+864e5);
  let from;
  if(R.range==='7d') from=new Date(end-7*864e5);
  else if(R.range==='28d') from=new Date(end-28*864e5);
  else if(R.range==='term') from=termStart(now);
  else if(R.range==='year') from=yearStart(now);
  else {from=R.from?sod(R.from+'T00:00'):new Date(end-28*864e5); const t=R.to?new Date(sod(R.to+'T00:00').getTime()+864e5):end; return {from,to:t,label:rangeLabel(from,t)}}
  return {from,to:end,label:rangeLabel(from,end)};
}
const shortDate=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function rangeLabel(from,to){const last=new Date(to-1);return `${shortDate(from)} – ${shortDate(last)} ${last.getFullYear()}`}
const isoDay=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const inRange=(xs,r)=>xs.filter(a=>{const t=new Date(a.created_at).getTime();return t>=r.from.getTime()&&t<r.to.getTime()});
const pctS=(c,n)=>n?Math.round(100*c/n)+'%':'—';
const weekStart=d=>{const x=sod(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

/* weekly practice time: one series, so no legend; the chart title names it. Each bar has a tooltip and a printed value. */
function weekBarsHTML(weeks,title){
  if(!weeks.length) return '';
  const max=Math.max(...weeks.map(w=>w.minutes),1), W=Math.max(weeks.length*46,240), H=150, bw=Math.min(30,W/weeks.length-12);
  const bars=weeks.map((w,i)=>{const h=Math.round((w.minutes/max)*(H-44)), x=i*(W/weeks.length)+((W/weeks.length)-bw)/2, y=H-22-h;
    return `<g><title>Week of ${shortDate(w.week)}: ${fmtMins(w.minutes)}${w.students!=null?`, ${w.students} student${w.students===1?'':'s'}`:''}</title>
      ${h?`<path d="M${x},${H-22} V${y+4} Q${x},${y} ${x+4},${y} H${x+bw-4} Q${x+bw},${y} ${x+bw},${y+4} V${H-22} Z" class="rbar"/>`:''}
      <text x="${x+bw/2}" y="${Math.max(y-5,10)}" text-anchor="middle" class="rval">${w.minutes>=60?Math.round(w.minutes/6)/10+'h':w.minutes+'m'}</text>
      <text x="${x+bw/2}" y="${H-6}" text-anchor="middle" class="rax">${shortDate(w.week)}</text></g>`}).join('');
  return `<figure class="rchart"><figcaption>${title}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: ${weeks.map(w=>`week of ${shortDate(w.week)} ${fmtMins(w.minutes)}`).join(', ')}"><line x1="0" x2="${W}" y1="${H-22}" y2="${H-22}" class="rbase"/>${bars}</svg></figure>`;
}
function weeksFromSessions(ss,r){
  const m=new Map(); for(let t=weekStart(r.from);t<r.to;t=new Date(t.getTime()+7*864e5)) m.set(t.getTime(),{week:new Date(t),minutes:0,students:new Set()});
  for(const s of ss){const k=weekStart(s.start).getTime(); if(m.has(k)){const w=m.get(k);w.minutes+=s.minutes;if(s.user)w.students.add(s.user)}}
  return [...m.values()].map(w=>({week:w.week,minutes:w.minutes,students:w.students.size}));
}

/* ---------- per-student numbers for a class (teacher has full attempts) ---------- */
function studentReportData(st,d,r){
  const all=d.attempts.filter(a=>a.user_id===st.id), inR=inRange(all,r), M=masteryMap(all);
  const answers=inR.length, correct=inR.filter(a=>a.correct).length, helped=inR.filter(isHelped).length;
  const ss=studySessions(inR), minutes=ss.reduce((m,s)=>m+s.minutes,0), days=new Set(inR.map(a=>dayKey(a.created_at))).size;
  const dg=(d.diagnostics||[]).filter(x=>x.user_id===st.id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];
  const work=d.assignments.filter(a=>new Date(a.due_at)>=r.from&&new Date(a.created_at)<r.to).sort((a,b)=>String(a.due_at).localeCompare(String(b.due_at))).map(a=>({a,s:asgStatus(a,all)}));
  const per={}; for(const a of inR) if(TOP[a.topic]){const t=per[a.topic]||(per[a.topic]={n:0,c:0});t.n++;if(a.correct&&!isHelped(a))t.c++}
  const secure=Object.keys(M).filter(id=>TOP[id]&&M[id].state==='secure');
  let strengths=secure.slice().sort((x,y)=>M[y].acc-M[x].acc).slice(0,5);
  if(strengths.length<3) strengths=strengths.concat(Object.entries(per).filter(([id,t])=>t.n>=3&&t.c/t.n>=.8&&!strengths.includes(id)).sort((a,b)=>b[1].c/b[1].n-a[1].c/a[1].n).map(([id])=>id)).slice(0,5);
  const weak=Object.entries(per).filter(([id,t])=>t.n>=3&&t.c/t.n<.6).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,5).map(([id,t])=>({id,...t}));
  const slips=errorsFrom(inR).slice(0,3);
  const hs=helpStats(inR,3650,r.to.getTime());
  return {st,all,inR,answers,correct,helped,minutes,days,grade:dg?dg.grade:null,work,
    workDone:work.filter(w=>w.s.status==='done').length,workHelp:work.filter(w=>w.s.status==='help').length,workMissed:work.filter(w=>w.s.status==='none'&&w.s.overdue).length,
    secure:secure.length,strengths,weak,slips,helpTopics:hs.topics,weeks:weeksFromSessions(ss,r),lastActive:all.map(a=>a.created_at).sort().pop()||null};
}
function classReportData(d,r){
  const rows=d.students.map(st=>studentReportData(st,d,r));
  const inR=rows.flatMap(x=>x.inR), strands=STRANDS.map(s=>s[0]);
  const strandAcc=strands.map(s=>{const xs=inR.filter(a=>TOP[a.topic]&&TOP[a.topic].strand===s);return {s,n:xs.length,c:xs.filter(a=>a.correct).length}});
  const per={}; for(const a of inR) if(TOP[a.topic]){const t=per[a.topic]||(per[a.topic]={n:0,c:0,who:new Set()});t.n++;if(a.correct)t.c++;t.who.add(a.user_id)}
  const weakTopics=Object.entries(per).filter(([,t])=>t.n>=8).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).slice(0,5);
  const work=d.assignments.filter(a=>new Date(a.due_at)>=r.from&&new Date(a.created_at)<r.to).sort((a,b)=>String(a.due_at).localeCompare(String(b.due_at)))
    .map(a=>{const sts=d.students.map(st=>asgStatus(a,d.attempts.filter(x=>x.user_id===st.id)).status);return {a,done:sts.filter(x=>x==='done').length,help:sts.filter(x=>x==='help').length,progress:sts.filter(x=>x==='progress').length,none:sts.filter(x=>x==='none').length}});
  const sess=rows.flatMap(x=>studySessions(x.inR).map(s=>({...s,user:x.st.id})));
  return {rows,answers:inR.length,correct:inR.filter(a=>a.correct).length,helped:inR.filter(isHelped).length,minutes:rows.reduce((m,x)=>m+x.minutes,0),
    active:rows.filter(x=>x.answers).length,strandAcc,weakTopics,slips:errorsFrom(inR).slice(0,5),work,weeks:weeksFromSessions(sess,r),
    followUp:rows.filter(x=>x.workHelp||x.workMissed||(x.answers===0&&x.st))};
}

/* ---------- school report from raw data (demo store; the database returns the same shape) ---------- */
function schoolReportFromRaw({school,seats_used,classes,members,students,attempts,assignments,roster,from,to}){
  const r={from:new Date(from),to:new Date(to)}, inR=inRange(attempts,r);
  const per_student=students.map(st=>{const xs=inR.filter(a=>a.user_id===st.id), ss=studySessions(xs);
    return {user_id:st.id,name:st.name,answers:xs.length,correct:xs.filter(a=>a.correct).length,helped:xs.filter(isHelped).length,
      active_days:new Set(xs.map(a=>dayKey(a.created_at))).size,minutes:ss.reduce((m,s)=>m+s.minutes,0),last_active:attempts.filter(a=>a.user_id===st.id).map(a=>a.created_at).sort().pop()||null}});
  const tp={}; for(const a of inR){const t=tp[a.topic]||(tp[a.topic]={topic:a.topic,answers:0,correct:0});t.answers++;if(a.correct)t.correct++}
  const er={}; for(const a of inR) if(a.error_id) er[a.error_id]=(er[a.error_id]||0)+1;
  const sess=students.flatMap(st=>studySessions(inR.filter(a=>a.user_id===st.id)).map(s=>({...s,user:st.id})));
  return {school:{name:school.name,seats:school.seats,expires_at:school.expires_at},seats_used,from,to,
    classes:classes.map(c=>{const ids=members.filter(m=>m.class_id===c.id).map(m=>m.user_id), asg=assignments.filter(a=>a.class_id===c.id&&new Date(a.due_at)>=r.from&&new Date(a.created_at)<r.to);
      const slots=asg.flatMap(a=>ids.map(id=>asgStatus(a,attempts.filter(x=>x.user_id===id)).status==='done'));
      return {id:c.id,name:c.name,teacher:c.teacher,student_ids:ids,not_joined:roster.filter(x=>x.class_id===c.id&&!x.claimed_at).length,work_set:asg.length,work_slots:slots.length,work_done:slots.filter(Boolean).length}}),
    students:per_student,topics:Object.values(tp),errors:Object.entries(er).sort((a,b)=>b[1]-a[1]).map(([id,n])=>({id,n})),
    weeks:weeksFromSessions(sess,r).filter(w=>w.minutes).map(w=>({week:w.week.toISOString(),minutes:w.minutes,students:w.students}))};
}

const csvCell=v=>{const s=v==null?'':String(v);return /[",\n]/.test(s)||/^[=+\-@]/.test(s)?'"'+(/^[=+\-@]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function classCSV(d,x,rg){
  return toCSV([[`${d.name} · ${rg.label}`],['Student','Email','Working grade','Practice minutes','Days active','Answers','Full marks %','Topics secure','Set work done','Set work total','Stuck on','Missed','Show me how used','Strongest topics','Topics to work on','Most common slip','Last active'],
    ...x.rows.map(r=>[r.st.name,r.st.email||'',r.grade??'',r.minutes,r.days,r.answers,r.answers?Math.round(100*r.correct/r.answers):'',r.secure,r.workDone,r.work.length,r.workHelp,r.workMissed,r.helped,
      r.strengths.map(id=>TOP[id].name).join('; '),r.weak.map(w=>TOP[w.id].name).join('; '),r.slips[0]?ERR[r.slips[0][0]][0]:'',r.lastActive?isoDay(r.lastActive):''])]);
}
function schoolCSV(rep,rg){
  const st=new Map(rep.students.map(s=>[s.user_id,s]));
  const rows=[[`${rep.school.name} · ${rg.label}`],['Class','Teacher','Student','Practice minutes','Days active','Answers','Full marks %','Show me how used','Last active']];
  for(const c of rep.classes) for(const id of c.student_ids||[]){const s=st.get(id); if(s) rows.push([c.name,c.teacher||'',s.name,+s.minutes,+s.active_days,+s.answers,+s.answers?Math.round(100*s.correct/s.answers):'',+s.helped,s.last_active?isoDay(s.last_active):''])}
  return toCSV(rows);
}
function downloadCSV(text,name){
  const blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

function judge(Q,raws){
  const raw=raws[0];
  const ok=Q.fields?Q.check(raws):Q.check?Q.check(raw):near((Q.read||parseNum)(raw),Q.ansV,Q.tol);
  if(ok) return {k:'ok'};
  const v=Q.fields?NaN:(Q.read||parseNum)(raw);
  for(const t of Q.traps){
    let hit=false;
    try{hit=t.test?!!t.test(Q.fields?raws:raw):near(v,t.v,Q.tol)}catch(e){}
    if(hit) return {k:'trap',id:t.id,note:t.note};
  }
  if(!Q.fields&&isFinite(v)&&Q.ansV!==undefined){
    const d=Math.abs(v-Q.ansV);
    if((Q.tol>=.05&&d<=.5)||(Q.tol<.05&&Q.tol>=1e-5&&d<=Math.max(100*Q.tol,.011))) return {k:'trap',id:'rounding'};
  }
  return {k:'no'};
}
function submit(){
  const inputs=[...document.querySelectorAll('#ansForm .inp')], raws=inputs.map(i=>i.value.trim());
  if(inputs.some(i=>!i.value.trim())){$('#out').innerHTML='<p class="hint">Answer every part first, or tap “Show worked solution”.</p>';return}
  finish(judge(S.Q,raws));
}
async function finish(res){
  S.lastQctx=questionContext(S.topic,S.Q,typedNow(),res,'practise');
  S.done=true; const Q=S.Q; stopTimer();
  const helped=!!Q.helped&&res.k!=='seen', extra=helped?{ref:'help'}:{};
  const att={topic:S.topic,correct:res.k==='ok',error_id:res.k==='trap'?res.id:null,source:'practice',created_at:new Date().toISOString(),user_id:S.user.id,...extra};
  S.attempts.push(att); refreshRow();
  api.recordAttempt(S.user.id,S.topic,att.correct,att.error_id,'practice',extra).catch(e=>alertBox('Your answer was marked but not saved: '+e.message));
  let v='';
  if(res.k==='ok') v=helped?helpedVerdict:`<div class="verdict ok"><strong>Correct. ${Q.marks} out of ${Q.marks}.</strong><p>Check the method below matches yours.</p></div>`;
  const debrief=`<div class="row debrief"><button class="btn sm" type="button" data-act="retry">Retry with new numbers</button><button class="ghost sm" type="button" data-act="brief">Review the briefing</button></div>`;
  if(res.k==='trap'){const [name,fix]=ERR[res.id];v=`<div class="verdict trap"><strong>Evidence found: ${name}</strong><p>${res.note||fix}</p>${debrief}</div>`}
  if(res.k==='no') v=`<div class="verdict no"><strong>Not this time</strong><p>The answer is ${Q.ans}. Compare the method below with yours line by line.</p>${debrief}</div>`;
  if(res.k==='seen') v=`<div class="verdict seen"><strong>Solution shown</strong><p>Counted as an attempt. Try the next one with fresh numbers.</p></div>`;
  const steps=Q.steps.map(([m,s])=>`<li><span class="mk ${/^[AB]/.test(m)?'a':m==='alt'?'e':''}">${m==='alt'?'ALT':m}</span><span>${s}</span></li>`).join('');
  const MMt=masteryMap(S.attempts)[S.topic], passed=checkSessions(S.attempts,S.topic).some(s=>s.total>=CHECK_N&&s.correct>=CHECK_PASS);
  const record=`<div class="record"><span>Your record on this topic</span>${pipsHTML(S.topic,masteryMap(S.attempts),true)}<span class="hint">${MMt&&MMt.state==='secure'?'Secure.':'Not secure yet: 4 of your last 5 right, on 2 different days.'}${passed?' Topic check passed.':''}</span>${passed?'':`<button class="ghost sm" type="button" data-check="${S.topic}">Take the Topic check</button>`}</div>`;
  $('#out').innerHTML=`${v}${res.k==='seen'?'':timeVerdictHTML()}${record}<div class="sol"><span class="eyebrow">Worked solution · answer ${Q.ans}</span><ol>${steps}</ol><div class="legend">M1 method mark · A1 accuracy mark · B1 independent mark</div></div>${reportQButton()}`;
  $('#go').textContent='Next case →';
  document.querySelectorAll('#ansForm .inp').forEach(i=>{i.readOnly=true;if(i.tagName==='SELECT')i.disabled=true});
  $('#reveal').hidden=true; $('#go').focus({preventScroll:true});
  const smb=document.querySelector('.smbar'); if(smb) smb.hidden=true; refreshLearn();
  $('#out').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>b.dataset.act==='retry'?newCase():showBrief(res.k==='trap'?res.id:null,true));
  renderBoard();
}

  $('#toSetWork').onclick=()=>{$('#setwork').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('#a-kind').focus({preventScroll:true}),350)};
  $('#classDetail').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);alertBox('Follow-up list copied')}catch(e){alertBox('Copy not available in this browser')}});
  $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(d.code);alertBox('Class code copied')}catch(e){const r=document.createRange();r.selectNodeContents($('#code'));getSelection().removeAllRanges();getSelection().addRange(r)}};
  const fa=$('#fAsg'), kindSel=$('#a-kind');
  const syncKind=()=>{const k=kindSel.value;const dn=$('#a-due-n');if(dn)dn.textContent=k==='practice'?4:(k==='diag'||k.startsWith('paper'))?2:3;$('#a-topic-l').hidden=k==='exam'||k==='diag'||k.startsWith('paper');$('#a-exam-l').hidden=k!=='exam';$('#a-target-l').hidden=k!=='practice'};
  kindSel.onchange=syncKind; syncKind();
  fa.onsubmit=e=>{e.preventDefault();busy(fa,async()=>{const k=kindSel.value,tp=$('#a-topic').value;
    const topic=k==='practice'?tp:k==='check'?'check:'+tp:k==='exam'?'exam:'+$('#a-exam').value:k.startsWith('paper')?'paper:'+k.slice(5):'diag';
    await api.createAssignment(d.id,{topic,target:+$('#a-target').value||1,due_at:$('#a-due').value});alertBox('Work set for '+d.name);renderClassDetail(await api.classDetail(d.id))})};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api.deleteAssignment(b.dataset.del);renderClassDetail(await api.classDetail(d.id))});
}

const SG=[['help','Needs help','⚠'],['none','Not started','✕'],['progress','In progress','…'],['done','Done','✓']];
function dueLabel2(iso){const d=Math.ceil((new Date(iso)-Date.now())/864e5);
  return d<0?{t:`Overdue by ${-d} day${d===-1?'':'s'}`,c:'over'}:d===0?{t:'Due today',c:'soon'}:d===1?{t:'Due tomorrow',c:'soon'}:{t:`Due in ${d} days`,c:''}}
function asgCardHTML(a,d){
  const k=asgKind(a), rows=d.students.map(st=>({st,r:asgStatus(a,d.attempts.filter(x=>x.user_id===st.id))}));
  const by=Object.fromEntries(SG.map(([key])=>[key,rows.filter(x=>x.r.status===key)]));
  const what={practice:`${a.target} correct answers on ${TOP[k.id]?TOP[k.id].name:k.id}`,check:'Pass a 5-question topic check (4 out of 5)',exam:'Hand in the exam question',diag:'Complete the 20-question diagnostic',paper:`Hand in a ${PAPER_N}-question ${k.id==='1'?'non-calculator':'calculator'} paper set`}[k.kind];
  const due=dueLabel2(a.due_at), n=rows.length||1;
  const group=([key,label,icon])=>{const xs=by[key];
    return `<div class="sg sg-${key}"><h4><span aria-hidden="true">${icon}</span> ${label} <b>${xs.length}</b></h4>${xs.length?`<ul>${xs.map(({st,r})=>`<li${r.overdue&&key==='none'?' class="over"':''}><b>${esc(st.name)}</b><small>${esc(r.note)}</small></li>`).join('')}</ul>`:'<p class="hint">Nobody</p>'}</div>`};
  const follow=[...by.help,...by.none];
  return `<div class="asgcard" data-asgid="${a.id}">
    <div class="asghead"><div><b>${esc(a.title)}</b><span class="hint">${what} · due ${fmtDate(a.due_at)}</span></div>
      <span class="duetag ${due.c}">${due.t}</span>
      <span class="num">${by.done.length}/${rows.length} done</span>
      <button class="link" data-del="${a.id}">Remove</button></div>
    <div class="stackbar" role="img" aria-label="${SG.map(([key,label])=>`${by[key].length} ${label.toLowerCase()}`).join(', ')}">${SG.slice().reverse().map(([key])=>by[key].length?`<i class="s-${key}" style="width:${by[key].length/n*100}%"></i>`:'').join('')}</div>
    <div class="sgroups">${SG.map(group).join('')}</div>
    ${follow.length?`<button class="ghost sm copyfollow" type="button" data-copy="${esc(`${a.title}\n`+(by.help.length?`Needs help: ${by.help.map(x=>x.st.name).join(', ')}\n`:'')+(by.none.length?`Not started: ${by.none.map(x=>x.st.name).join(', ')}`:''))}">Copy the follow-up list</button>`:''}
  </div>`;
}
function followUpHTML(d){
  const recent=d.assignments.filter(a=>Date.now()-new Date(a.due_at).getTime()<14*864e5);
  const per=new Map();
  for(const a of recent) for(const st of d.students){const r=asgStatus(a,d.attempts.filter(x=>x.user_id===st.id));
    if(r.status==='help'||(r.status==='none'&&r.overdue)){if(!per.has(st.id))per.set(st.id,{st,items:[]});per.get(st.id).items.push({a,r})}}
  if(!per.size) return '';
  const list=[...per.values()].sort((x,y)=>y.items.filter(i=>i.r.status==='help').length-x.items.filter(i=>i.r.status==='help').length||y.items.length-x.items.length);
  return `<div class="panel followup"><div class="phead"><h2>Who needs a follow-up</h2><span class="hint">From work set in the last few weeks</span></div>
    <ul class="fulist">${list.map(({st,items})=>`<li><b>${esc(st.name)}</b><span>${items.map(({a,r})=>`<span class="futag ${r.status}">${r.status==='help'?'⚠ Needs help':'✕ Not done'}</span> ${esc(a.title)} <small>(${esc(r.note)})</small>`).join('<br>')}</span></li>`).join('')}</ul>
    <p class="hint"><b>Needs help</b> means they tried but the evidence says they're stuck: fewer than half right after 4 or more tries, relying on Show me how, a failed Topic check, or under 40% on an exam question. <b>Not done</b> means the due date has passed and they haven't started.</p></div>`;
}
function setWorkHTML(d,liveTopics){
  const step=(n,t)=>`<span class="stepn">${n}</span>${t}`;
  const cards=d.assignments.slice().sort((x,y)=>String(y.created_at).localeCompare(String(x.created_at))).map(a=>asgCardHTML(a,d)).join('');
  return `<div class="panel setwork" id="setwork"><div class="phead"><h2>Set work for ${esc(d.name)}</h2><span class="hint">Students see it on their Today page straight away. Below, you'll see who has done it, who is stuck and who hasn't started.</span></div>
    <form id="fAsg" class="asgform" novalidate>
      <label>${step(1,'What kind of work?')}<select class="inp" id="a-kind"><option value="practice">Topic practice</option><option value="check">Topic check (5 questions)</option><option value="exam">Exam question</option><option value="paper1">Paper 1 practice set (non-calculator)</option><option value="paper2">Paper 2 practice set (calculator)</option><option value="diag">Baseline diagnostic</option></select></label>
      <label id="a-topic-l">${step(2,'Which topic?')}<select class="inp" id="a-topic">${liveTopics.map(t=>`<option value="${t.id}">G${t.grade} · ${t.name}</option>`).join('')}</select></label>
      <label id="a-exam-l" hidden>${step(2,'Which exam question?')}<select class="inp" id="a-exam">${EXAMS.slice().sort((a,b)=>a.grade-b.grade).map(x=>`<option value="${x.id}">G${x.grade} · ${x.title}</option>`).join('')}</select></label>
      <label id="a-target-l">${step(3,'How many correct?')}<input class="inp" id="a-target" type="number" min="1" max="50" value="5"></label>
      <label>${step('<span id="a-due-n">4</span>','Due date')}<input class="inp" id="a-due" type="date" value="${todayPlus(7)}"></label>
      <button class="btn" type="submit">Set work →</button><p class="formerr" hidden></p></form>
  </div>
  <div class="panel worklist"><div class="phead"><h2>Work set for ${esc(d.name)}</h2><span class="hint">Newest first</span></div>
    ${cards||'<p class="hint">No work set yet. Use the form above: it takes about 20 seconds.</p>'}</div>`;
}

  <div class="two"><div class="panel"><h2>Teachers</h2>${s.teachers.map(t=>{const p=staffOf(t.email);return `<div class="lr"><b>${esc(t.name)}</b><span class="hint">${esc(t.email)}</span>${p?`<span class="hint">Last sign-in: ${signInCell(p)}</span>`:''}</div>`}).join('')||'<p class="hint">No teachers yet.</p>'}
    <form id="fTeacher" class="stack" novalidate><label>Name<input class="inp" id="t-name"></label><label>School email<input class="inp" id="t-email" type="email"></label><p class="formerr" hidden></p><button class="btn" type="submit">Add teacher</button>

    <p class="hint">Need more seats? Email support@mathsforensics.com and they're added the same day.</p></div></div>
  ${schoolRosterHTML(s,roster)}`;

  const ft=$('#fTeacher'); ft.onsubmit=e=>{e.preventDefault();busy(ft,async()=>{await api.addTeacher(S.user.school_id,$('#t-name').value,$('#t-email').value);alertBox(api.mode==='demo'?'Teacher added':'Invite email sent');renderSchool()})};

/* ---------- owner (Mike) ---------- */
/* "3 days ago" style labels for sign-ins and activity */
function agoLabel(iso){
  if(!iso) return null;
  const d=daysAgo(iso), t=new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return d<=0?`Today, ${t}`:d===1?`Yesterday, ${t}`:d<31?`${d} days ago`:fmtDate(iso);
}
function signInCell(p){
  const a=agoLabel(p.last_sign_in);
  if(a) return `<span class="${daysAgo(p.last_sign_in)>14?'stale':''}">${a}</span>`;
  return `<span class="pill">Never signed in</span>${p.invited?` <span class="hint">invited ${fmtDate(p.invited)}</span>`:''}`;
}
function schoolDetailHTML(d,s,o={}){
  const pctUsed=Math.round(d.seats_used/s.seats*100);
  const person=(role,cls,p)=>`<span class="role ${cls}">${role}</span><b>${esc(p.name||'—')}</b><span class="sel tmail">${esc(p.email)}</span><span class="tsign">${signInCell(p)}</span>`;
  const wkOf=list=>(list||[]).reduce((m,st)=>m+Math.round(+((st.activity||{}).week_minutes)||0),0);
  const hasAct=d.classes.some(c=>(c.student_list||[]).some(st=>st.activity));
  const wkTag=m=>hasAct?`<span class="wk${m?'':' none'}">${m?fmtMins(m)+' practice this week':'no practice this week'}</span>`:'';
  const stActivity=st=>{const ls=st.activity&&st.activity.last_session;
    if(!st.last_active&&!ls) return '<span class="hint">not started yet</span>';
    if(!ls) return `<span class="hint">last active ${agoLabel(st.last_active).toLowerCase()}</span>`;
    const kinds=(ls.kinds||[]).map(k=>KIND_LABEL[k]||k).join(' + ');
    return `<span class="hint">last active ${agoLabel(ls.end).toLowerCase()} · ${fmtMins(Math.round(+ls.minutes)||1)} · ${esc(kinds)} · ${ls.answers} answer${+ls.answers===1?'':'s'}</span>${wkTag(Math.round(+st.activity.week_minutes)||0)}`};
  const classNode=c=>`<li class="tclass"><span class="role r-class">Class</span><b>${esc(c.name)}</b><code>${esc(c.code)}</code><span class="hint">${c.students} student${c.students===1?'':'s'}</span>${wkTag(wkOf(c.student_list))}
    ${c.student_list&&c.student_list.length?`<details class="tstudents"><summary>Show students</summary><ul>${c.student_list.map(st=>`<li><span class="role r-student">Student</span><span>${esc(st.name||'—')}</span>${stActivity(st)}</li>`).join('')}</ul></details>`:''}</li>`;
  const admins=d.staff.filter(p=>p.role==='schooladmin'), teachers=d.staff.filter(p=>p.role==='teacher');
  const staffEmails=new Set(d.staff.map(p=>String(p.email).toLowerCase()));
  const classesOf=p=>d.classes.filter(c=>String(c.teacher_email||'').toLowerCase()===String(p.email).toLowerCase()||(!c.teacher_email&&c.teacher===p.name));
  const orphan=d.classes.filter(c=>!staffEmails.has(String(c.teacher_email||'').toLowerCase())&&!d.staff.some(p=>!c.teacher_email&&c.teacher===p.name));
  return `<div class="sdetail">
    ${o.kpis===false?'':`<div class="kpis four sd-kpis">
      <div class="kpi"><b>${d.seats_used} / ${s.seats}</b><span>Seats used now (${pctUsed}%)</span><span class="track"><i class="${pctUsed>90?'lo':pctUsed>75?'mid':'hi'}" style="width:${Math.max(3,Math.min(100,pctUsed))}%"></i></span></div>
      <div class="kpi"><b>${d.active_7d}</b><span>Students active this week</span></div>
      <div class="kpi"><b>${d.answers_7d}</b><span>Answers this week</span></div>
      <div class="kpi"><b>${agoLabel(d.last_activity)||'None yet'}</b><span>Last student activity</span></div>
    </div>`}
    <ul class="tree">
      <li class="troot"><span class="role r-school">School</span><b>${esc(s.name)}</b><span class="hint">${d.seats_used} of ${s.seats} seats · licence to ${fmtDate(s.expires_at)}</span>${wkTag(d.classes.reduce((m,c)=>m+wkOf(c.student_list),0))}
        <ul>
          ${admins.map(p=>`<li>${person('School admin','r-admin',p)}</li>`).join('')||'<li><span class="role r-admin">School admin</span><span class="hint">None yet</span></li>'}
          ${teachers.map(p=>{const cs=classesOf(p);return `<li>${person('Teacher','r-teacher',p)}<ul>${cs.map(classNode).join('')||'<li class="tclass"><span class="hint">No classes yet</span></li>'}</ul></li>`}).join('')}
          ${admins.filter(p=>classesOf(p).length).map(p=>`<li><span class="role r-admin">School admin</span><b>${esc(p.name)}</b><span class="hint">also teaches</span><ul>${classesOf(p).map(classNode).join('')}</ul></li>`).join('')}
          ${orphan.length?`<li><span class="role r-teacher">Other classes</span><ul>${orphan.map(classNode).join('')}</ul></li>`:''}
        </ul></li>
    </ul>
    <p class="hint">Students are shown by name and a summary of their last session only. Practice time is estimated from answer times (answers more than 10 minutes apart start a new session). Their emails and answers stay private to their teachers.</p>
  </div>`;
}
async function renderOwner(){
  view.className='page';

  <div class="panel"><h2>Schools</h2><p class="ownerline"><span class="role r-owner">Owner</span><b>${esc(S.user.name)}</b><span class="hint">→ schools → school admins → teachers → classes → students</span></p><div class="tablewrap"><table class="plain"><thead><tr><th>School</th><th>Admin</th><th>Seats used</th><th>Seats</th><th>Renews</th></tr></thead><tbody>
    ${o.schools.map(s=>`<tr><td><button class="link sdtoggle" data-sd="${s.id}" aria-expanded="false">▸ ${esc(s.name)}</button>${s.example?' <span class="tag">example</span>':''} <button class="link sm" data-sreport="${s.id}" type="button">Report</button></td><td>${esc(s.admin||'')}</td><td class="num">${s.seats_used} / ${s.seats}</td><td><form class="seatform" data-school="${s.id}"><input class="inp sm" type="number" min="1" value="${s.seats}" aria-label="Seats for ${esc(s.name)}"><button class="ghost sm" type="submit">Save</button></form></td><td>${fmtDate(s.expires_at)}</td></tr>
      <tr class="sdrow" id="sd-${s.id}" hidden><td colspan="5"></td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Click a school's name for its contacts, live seat use, last sign-ins and activity.</p>
    <details><summary>Add a school licence</summary>
    <form id="fSchool" class="grid2" novalidate><label>School name<input class="inp" id="s-name"></label><label>Seats<input class="inp" id="s-seats" type="number" min="1" value="100"></label>
      <label>Licence ends<input class="inp" id="s-exp" type="date" value="${schoolYearEnd().slice(0,10)}"></label><label>Admin name<input class="inp" id="s-aname"></label><label>Admin email<input class="inp" id="s-aemail" type="email"></label>
      <p class="formerr" hidden></p><button class="btn" type="submit">Create licence</button></form></details></div>
  <div class="panel"><h2>Exam Passes</h2>
    <div class="tablewrap"><table class="plain"><thead><tr><th>Buyer email</th><th>Order</th><th>Bought</th><th>Expires</th><th>Account</th></tr></thead><tbody>
    ${o.passes.map(p=>`<tr><td>${esc(p.email)}</td><td><code>${esc(p.order_ref)}</code></td><td>${fmtDate(p.created_at)}</td><td>${fmtDate(p.expires_at)}</td><td>${p.has_account?`<span class="pill ok">Signed up</span>${lastFor(p.email)?` <span class="hint">last sign-in ${lastFor(p.email).toLowerCase()}</span>`:''}`:'<span class="pill">Waiting</span>'}</td></tr>`).join('')}</tbody></table></div>
    <form id="fSale" class="inline" novalidate><input class="inp" id="sale-email" type="email" placeholder="buyer@example.com" aria-label="Buyer email"><button class="ghost" type="submit">Record a sale</button><p class="formerr" hidden></p></form>
    <p class="hint">Live, the Systeme.io "sale completed" webhook adds a row here automatically. When the buyer signs up with that email, their account unlocks.</p></div>
  <div id="reportsHost"></div>`;
  bindReportsPanel();
  view.querySelectorAll('[data-sreport]').forEach(b=>b.onclick=()=>openReport({kind:'school',schoolId:b.dataset.sreport,back:'owner'}));
  view.querySelectorAll('.sdtoggle').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.sd, row=$('#sd-'+id), open=b.getAttribute('aria-expanded')==='true', s=o.schools.find(x=>x.id===id);
    b.setAttribute('aria-expanded',!open); b.textContent=(open?'▸ ':'▾ ')+s.name; row.hidden=open;
    if(!open){row.firstElementChild.innerHTML='<p class="hint">Loading…</p>';
      try{row.firstElementChild.innerHTML=schoolDetailHTML(await api.schoolDetail(id),s)}catch(err){row.firstElementChild.innerHTML=`<p class="formerr">${esc(err.message)}</p>`}}
  });
  view.querySelectorAll('.seatform').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await api.updateSeats(f.dataset.school,f.querySelector('input').value);alertBox('Seats updated');renderOwner()}catch(err){alertBox(err.message)}});
  const fs=$('#fSchool'); fs.onsubmit=e=>{e.preventDefault();busy(fs,async()=>{await api.createSchool({name:$('#s-name').value,seats:$('#s-seats').value,expires_at:$('#s-exp').value,admin_name:$('#s-aname').value,admin_email:$('#s-aemail').value});alertBox(api.mode==='demo'?'School licence created. Admin password in this demo: demo':'School licence created. The admin has been emailed an invite.');renderOwner()})};
  const fsa=$('#fSale'); fsa.onsubmit=e=>{e.preventDefault();busy(fsa,async()=>{await api.recordSale($('#sale-email').value);renderOwner()})};
}
