   prompt:`A pyramid has a ${sq?`square base of side <b>${b} cm</b>`:`rectangular base <b>${b} cm</b> by <b>${trimNum(w)} cm</b>`} and a perpendicular height of <b>${h} cm</b>.<br>Work out its volume.`,
   traps:[{v:base*h,id:'third'},{v:base*h/2,id:'third'}],steps:[['M1',`Base area = ${trimNum(base)} cm²`],['A1',`⅓ × ${trimNum(base)} × ${h} = <b>${trimNum(V)} cm³</b>`]]}},
 ()=>{const r=R(2,9), h=3*R(1,5), k=r*r*h/3;
  if(NOCALC) return {kind:'cone',calc:'non',marks:2,ans:`${piAns(k)} cm³`,model:[piAns(k)],check:piCheck(k),prompt:`A cone has base radius <b>${r} cm</b> and perpendicular height <b>${h} cm</b>.<br>Work out its volume. Give your answer in terms of π.`,
   traps:[piTrapDec(k,'cm³'),{test:raw=>Math.abs(piVal(raw)-r*r*h)<1e-9,id:'third'},{test:raw=>Math.abs(piVal(raw)-r*h/3)<1e-9,id:'missed-square'}],
   steps:[['M1',`⅓ × π × ${r}² × ${h}`],['A1',`<b>${piAns(k)} cm³</b>`]],hint:'Type π as pi, e.g. 48pi'};
  const V=Math.PI*k;
  return {kind:'cone',marks:2,ansV:r1(V),tol:.05,ans:`${r1(V)} cm³`,prompt:`A cone has base radius <b>${r} cm</b> and perpendicular height <b>${h} cm</b>.<br>Work out its volume. Give your answer to 1 decimal place.`,
   traps:[{v:Math.PI*r*r*h,id:'third'},{v:Math.PI*r*h/3,id:'missed-square'}],steps:[['M1',`⅓ × π × ${r}² × ${h}`],['A1',`= ${dp(V)} = <b>${r1(V)} cm³</b>`]]}},
 ()=>{const r=pick([3,6,9,12,1.5,4.5,2,5]), k=4*r**3/3;
  if(NOCALC&&Number.isInteger(k)) return {kind:'sphere',calc:'non',marks:2,ans:`${piAns(k)} cm³`,model:[piAns(k)],check:piCheck(k),prompt:`A sphere has radius <b>${r} cm</b>.<br>Work out its volume. Give your answer in terms of π.`,
   traps:[piTrapDec(k,'cm³'),{test:raw=>Math.abs(piVal(raw)-r**3)<1e-9,id:'third',note:'Volume of a sphere = ⁴⁄₃πr³.'},{test:raw=>Math.abs(piVal(raw)-4*r*r)<1e-9,id:'wrong-formula',note:'4πr² is the surface area. Volume = ⁴⁄₃πr³.'}],
   steps:[['M1',`⁴⁄₃ × π × ${r}³ = ⁴⁄₃ × ${trimNum(r**3)}π`],['A1',`<b>${piAns(k)} cm³</b>`]],hint:'Type π as pi, e.g. 36pi'};

   traps:[{v:Math.PI*r**3,id:'third',note:'Volume of a sphere = ⁴⁄₃πr³.'},{v:4*Math.PI*r*r,id:'wrong-formula',note:'4πr² is the surface area.'}],steps:[['M1',`⁴⁄₃ × π × ${r}³`],['A1',`= ${dp(V)} = <b>${r1(V)} cm³</b>`]]}},
]);

/* ===== Step 3, batch 3: algebra =====
 Single brackets, function machines, forming and solving equations, geometric and other sequences,
 quadratic graphs, recognising graphs, triple brackets, the equation of a circle, graph transformations,
 and linear–quadratic simultaneous equations. */
Object.assign(ERR,{
 'bracket-all':['Didn\'t multiply every term','The number outside the bracket multiplies every term inside, including the second one and its sign.'],
 'not-fully':['Not factorised fully','Take out the highest common factor: every number and letter that goes into all the terms.'],
 'reverse-machine':['Reversed the machine wrongly','To go backwards, undo each step in reverse order: + becomes −, × becomes ÷.'],
 'form-equation':['Equation set up wrongly','Write what the question tells you as an equation first (e.g. perimeter = sum of all four sides), then solve.'],
 'geo-arith':['Treated it as arithmetic','In a geometric sequence you multiply by the same number each time. Divide a term by the one before to find it.'],
 'turning-sign':['Turning point sign slip','y = (x − p)² + q has its turning point at (p, q): the sign inside the bracket flips.'],
 'graph-shape':['Wrong type of graph','x² gives a U-shaped parabola, x³ an S-shaped cubic, 1/x two curves with asymptotes, kˣ an exponential curve, and x only a straight line.'],
 'transform-dir':['Translated the wrong way','f(x) + a moves the graph up by a. f(x + a) moves it LEFT by a (the opposite of what it looks like).'],
 'circle-r':['Radius or radius squared?','x² + y² = r²: the number on the right is r², so the radius is its square root.'],
 'pair-solutions':['Mixed up the pairs','Each x has its own y. Substitute each x back into the linear equation to find its matching y.'],
});
const polyHTML=(cs,v='x')=>{ // [a3,a2,a1,a0] highest first
  const n=cs.length-1, parts=[];
  cs.forEach((c,i)=>{if(!c)return;const p=n-i, coef=Math.abs(c), body=p===0?''+coef:`${coef===1?'':coef}${v}${p===1?'':p===2?'²':p===3?'³':'<sup>'+p+'</sup>'}`;
    parts.push(parts.length?(c<0?' − ':' + ')+body:(c<0?'−':'')+body)});
  return parts.join('')||'0';
};
const polyRaw=(cs,v='x')=>polyHTML(cs,v).replace(/³/g,'^3').replace(/²/g,'^2').replace(/−/g,'-').replace(/\s/g,'');
const noBrackets=raw=>!/[()]/.test(String(raw));

/* ---------- small graph plotter ---------- */
function graphSVG(f,{xmin=-5,xmax=5,ymin=-6,ymax=10,label='',points=[],fn2=null}={}){
  const W=300,H=240,px=x=>20+(x-xmin)/(xmax-xmin)*(W-40), py=y=>H-20-(y-ymin)/(ymax-ymin)*(H-40);
  let grid=''; for(let x=Math.ceil(xmin);x<=xmax;x++) grid+=`<line x1="${px(x)}" y1="${py(ymin)}" x2="${px(x)}" y2="${py(ymax)}" class="grid"/>`;
  for(let y=Math.ceil(ymin);y<=ymax;y++) grid+=`<line x1="${px(xmin)}" y1="${py(y)}" x2="${px(xmax)}" y2="${py(y)}" class="grid"/>`;
  const ticks=[...Array(Math.floor(xmax)-Math.ceil(xmin)+1).keys()].map(i=>Math.ceil(xmin)+i).filter(x=>x&&x%(xmax-xmin>12?2:1)===0).map(x=>`<text x="${px(x)}" y="${py(0)+13}" text-anchor="middle" class="tick">${x}</text>`).join('')
    +[...Array(Math.floor(ymax)-Math.ceil(ymin)+1).keys()].map(i=>Math.ceil(ymin)+i).filter(y=>y&&y%(ymax-ymin>12?2:1)===0).map(y=>`<text x="${px(0)-4}" y="${py(y)+4}" text-anchor="end" class="tick">${y}</text>`).join('');
  const path=g=>{let d='',pen=false;for(let i=0;i<=240;i++){const x=xmin+(xmax-xmin)*i/240,y=g(x);if(!isFinite(y)||y<ymin-1||y>ymax+1){pen=false;continue}d+=(pen?'L':'M')+px(x).toFixed(1)+','+py(y).toFixed(1);pen=true}return `<path d="${d}" class="curve"/>`};
  return `<svg class="dia graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label||'Graph'}">${grid}
   <line x1="${px(xmin)}" y1="${py(0)}" x2="${px(xmax)}" y2="${py(0)}" class="axis"/><line x1="${px(0)}" y1="${py(ymin)}" x2="${px(0)}" y2="${py(ymax)}" class="axis"/>
   <text x="${px(xmax)-4}" y="${py(0)-6}" class="tick">x</text><text x="${px(0)+6}" y="${py(ymax)+10}" class="tick">y</text>${ticks}${path(f)}${fn2?path(fn2):''}
   ${points.map(([x,y])=>`<circle cx="${px(x)}" cy="${py(y)}" r="3.5" class="dot"/>`).join('')}</svg>`;
}

/* ---------- Expanding and factorising single brackets ---------- */
G.brackets=anyOf([
 ()=>{const k=R(2,9)*pick([1,1,-1]), a=R(1,7), b=R(1,12)*pick([1,-1]), v=pick(['x','y','a','n']), A=k*a, B=k*b;
  const ans=`${A===1?'':A===-1?'−':neg(A)}${v} ${sgn(B)}`;
  return {kind:'expand',marks:1,ans,model:[`${A}${v}${B<0?'-':'+'}${Math.abs(B)}`],check:raw=>noBrackets(raw)&&exprEq(raw,e=>A*e[v]+B,[v]),
   prompt:`Expand &nbsp;<span class="eq">${k===-1?'−':neg(k)}(${a===1?'':a}${v} ${sgn(b)})</span>`,
   traps:[{test:raw=>exprEq(raw,e=>A*e[v]+b,[v]),id:'bracket-all'},{test:raw=>exprEq(raw,e=>A*e[v]-B,[v]),id:'sign-error'}],
   steps:[['M1',`${neg(k)} × ${a===1?'':a}${v} = ${neg(A)}${v} and ${neg(k)} × ${neg(b)} = ${neg(B)}`],['A1',`<b>${ans}</b>`]],hint:`For example 6${v} − 15`}},
 ()=>{const h=R(2,9), a=R(1,9), b=R(1,9); if(gcd(a,b)>1) return G.brackets(); const v=pick(['x','y','a']), A=h*a, B=h*b, plus=Math.random()<.6;
  const ok=raw=>{const s=String(raw).replace(/\s/g,'').replace(/−/g,'-'); const m=new RegExp(`^(\\d+)\\((\\d*)${v}([+-])(\\d+)\\)$`).exec(s)||new RegExp(`^(\\d+)\\((\\d+)([+-])(\\d*)${v}\\)$`).exec(s); return !!m&&+m[1]===h&&exprEq(raw,e=>A*e[v]+(plus?B:-B),[v])};
  return {kind:'factorise',marks:1,ans:`${h}(${a===1?'':a}${v} ${plus?'+':'−'} ${b})`,model:[`${h}(${a===1?'':a}${v}${plus?'+':'-'}${b})`],check:ok,
   prompt:`Factorise fully &nbsp;<span class="eq">${A}${v} ${plus?'+':'−'} ${B}</span>`,
   traps:[{test:raw=>/\(/.test(raw)&&exprEq(raw,e=>A*e[v]+(plus?B:-B),[v])&&!ok(raw),id:'not-fully',note:`The highest common factor of ${A} and ${B} is ${h}.`}],
   steps:[['M1',`HCF of ${A} and ${B} is ${h}`],['A1',`<b>${h}(${a===1?'':a}${v} ${plus?'+':'−'} ${b})</b>`]],hint:'For example 4(2x + 3)'}},
 ()=>{const h=R(2,6), p=R(1,6), q=R(1,9); if(gcd(p,q)>1) return G.brackets(); const A=h*p, B=h*q;
  const ok=raw=>{const s=String(raw).replace(/\s/g,'').replace(/−/g,'-').replace(/\^2|²/g,'²'); const m=/^(\d*)x\((\d*)x\+(\d+)\)$/.exec(s)||/^(\d*)x\((\d+)\+(\d*)x\)$/.exec(s); return !!m&&(+(m[1]||1))===h&&exprEq(raw,e=>A*e.x*e.x+B*e.x,['x'])};
  return {kind:'factorise-x',marks:2,ans:`${h}x(${p===1?'':p}x + ${q})`,model:[`${h}x(${p===1?'':p}x+${q})`],check:ok,
   prompt:`Factorise fully &nbsp;<span class="eq">${A}x² + ${B}x</span>`,
   traps:[{test:raw=>/\(/.test(raw)&&exprEq(raw,e=>A*e.x*e.x+B*e.x,['x'])&&!ok(raw),id:'not-fully',note:`Both terms share ${h} and x, so take out ${h}x.`}],
   steps:[['M1',`HCF of ${A}x² and ${B}x is ${h}x`],['A1',`<b>${h}x(${p===1?'':p}x + ${q})</b>`]],hint:'For example 3x(2x + 5)'}},
]);

/* ---------- Function machines ---------- */
G.funcmach=anyOf([
 ()=>{const m=R(2,9), a=R(1,15)*pick([1,-1]), x=R(-4,12), y=m*x+a, order=Math.random()<.5;
  const out=order?m*x+a:m*(x+a), steps=order?[`× ${m}`,a<0?`− ${-a}`:`+ ${a}`]:[a<0?`− ${-a}`:`+ ${a}`,`× ${m}`];
  return {kind:'output',marks:1,ansV:out,tol:.005,ans:''+out,prompt:`Input <b>${x}</b> → <span class="machine">${steps[0]}</span> → <span class="machine">${steps[1]}</span> → output<br>Work out the output.`,
   traps:[{v:order?m*(x+a):m*x+a,id:'order-error',note:'Do the steps in the order shown, left to right.'}].filter(t=>t.v!==out),steps:[['M1',`${x} ${steps[0]} = ${order?m*x:x+a}`],['A1',`${steps[1]} → <b>${out}</b>`]]}},
 ()=>{const m=R(2,9), a=R(1,15), x=R(1,12), out=m*x+a;
  return {kind:'input',marks:2,ansV:x,tol:.005,ans:''+x,prompt:`Input → <span class="machine">× ${m}</span> → <span class="machine">+ ${a}</span> → output<br>The output is <b>${out}</b>. Work out the input.`,
   traps:[{v:out/m-a,id:'reverse-machine',note:`Undo in reverse order: subtract ${a} first, then divide by ${m}.`},{v:out*m+a,id:'reverse-machine'},{v:(out+a)/m,id:'sign-error'}].filter(t=>Math.abs(t.v-x)>1e-9),
   steps:[['M1',`Work backwards: ${out} − ${a} = ${out-a}`],['A1',`${out-a} ÷ ${m} = <b>${x}</b>`]]}},
 ()=>{const m=R(2,7), c=R(-9,9)||4, sq=Math.random()<.4, x=R(-5,6), f=sq?x*x+c:m*x+c, solve=!sq&&Math.random()<.5;
  const fx=sq?`x² ${sgn(c)}`:`${m}x ${sgn(c)}`;
  if(solve){const k=R(-4,10), t=m*k+c; return {kind:'solve',marks:2,ansV:k,tol:.005,ans:`x = ${neg(k)}`,prompt:`f(x) = ${fx}<br>Solve f(x) = ${neg(t)}.`,
    traps:[{v:m*t+c,id:'reverse-machine',note:'f(x) = '+t+' means the output is '+t+'. Solve '+m+'x '+sgn(c)+' = '+t+'.'},{v:(t+c)/m,id:'sign-error'}].filter(tr=>Math.abs(tr.v-k)>1e-9),
    steps:[['M1',`${m}x ${sgn(c)} = ${t}`],['M1',`${m}x = ${t-c}`],['A1',`<b>x = ${neg(k)}</b>`]]}}
  return {kind:'notation',marks:1,ansV:f,tol:.005,ans:''+f,prompt:`f(x) = ${fx}<br>Work out f(${neg(x)}).`,
   traps:sq?[{v:-(x*x)+c,id:'sign-error',note:`(${neg(x)})² is positive: ${x*x}.`},{v:2*x+c,id:'missed-square'}].filter(t=>t.v!==f):[{v:m+x+c,id:'wrong-operation',note:`${m}x means ${m} × x.`}].filter(t=>t.v!==f),
   steps:[['M1',`Replace x with ${neg(x)}: ${sq?`(${neg(x)})² ${sgn(c)}`:`${m} × ${neg(x)} ${sgn(c)}`}`],['A1',`<b>${f}</b>`]]}},
]);

/* ---------- Forming and solving equations ---------- */
G.formeq=anyOf([
 ()=>{let a,b,c,d,x; do{a=R(1,4);b=R(-3,9);c=R(1,4);d=R(-3,9);x=R(3,12)}while(a*x+b<2||c*x+d<2);
  const P=2*(a*x+b+c*x+d);
  return {kind:'perimeter',marks:3,ansV:x,tol:.005,ans:`x = ${x}`,
   prompt:`A rectangle has length <span class="eq">(${a===1?'':a}x ${sgn(b)})</span> cm and width <span class="eq">(${c===1?'':c}x ${sgn(d)})</span> cm. Its perimeter is <b>${P} cm</b>.<br>Work out the value of x.`,
   traps:[{v:(P-b-d)/(a+c),id:'form-equation',note:'The perimeter has two lengths and two widths: 2(length + width).'},{v:(P/2-b-d)/(a*c),id:'form-equation'}].filter(t=>Math.abs(t.v-x)>1e-9),
   steps:[['M1',`2(${a}x ${sgn(b)} + ${c}x ${sgn(d)}) = ${P}`],['M1',`${2*(a+c)}x ${sgn(2*(b+d))} = ${P}`],['A1',`<b>x = ${x}</b>`]]}},
 ()=>{const a=R(1,3), b=R(1,4); let p,q,X; do{p=R(-10,30);q=R(-10,30);X=(180-p-q)/(1+a+b)}while(!Number.isInteger(X)||X<8||a*X+p<5||b*X+q<5);
  return {kind:'angles',marks:3,ansV:X,tol:.005,ans:`x = ${X}`,prompt:`The angles in a triangle are x°, <span class="eq">(${a===1?'':a}x ${sgn(p)})°</span> and <span class="eq">(${b===1?'':b}x ${sgn(q)})°</span>.<br>Work out the value of x.`,
   traps:[{v:(360-p-q)/(1+a+b),id:'angle-sum',note:'Angles in a triangle add to 180°.'},{v:(180-p-q)/(a+b),id:'form-equation',note:'Include the x° angle as well.'}].filter(t=>Math.abs(t.v-X)>1e-9&&t.v>0),
   steps:[['M1',`x + ${a}x ${sgn(p)} + ${b}x ${sgn(q)} = 180`],['M1',`${1+a+b}x = ${180-p-q}`],['A1',`<b>x = ${X}</b>`]]}},
 ()=>{const n=R(3,12), d=R(2,9), older=pick(['Ali','Bea','Cara','Dan']), other=pick(['Eve','Finn','Gus','Hana'].filter(x=>x!==older)), tot=n+(n+d)+2*n;
  return {kind:'words',marks:3,ansV:n,tol:.005,ans:`${n}`,prompt:`${older} is <b>${d}</b> years older than ${other}. Their mum is twice ${other}'s age. Their three ages add up to <b>${tot}</b>.<br>How old is ${other}?`,
   traps:[{v:(tot-d)/3,id:'form-equation',note:`Let ${other}'s age be x: x + (x + ${d}) + 2x = ${tot}. That's 4x, not 3x.`},{v:(tot+d)/4,id:'sign-error'}].filter(t=>Math.abs(t.v-n)>1e-9),
   steps:[['M1',`x + (x + ${d}) + 2x = ${tot}`],['M1',`4x + ${d} = ${tot}`],['A1',`x = <b>${n}</b>`]]}},
]);

/* ---------- Geometric and other sequences ---------- */
G.geoseq=anyOf([
 ()=>{const a=pick([1,2,3,4,5,6,10]), r=pick([2,3,4,5,-2,0.5]), t=[...Array(4).keys()].map(i=>a*r**i), nx=a*r**4, d=t[3]-t[2];

   traps:[{v:t[3]+d,id:'geo-arith'}].filter(x=>Math.abs(x.v-nx)>1e-9),steps:[['M1',`Common ratio: ${trimNum(t[1])} ÷ ${trimNum(t[0])} = ${trimNum(r)}`],['A1',`${trimNum(t[3])} × ${trimNum(r)} = <b>${trimNum(nx)}</b>`]]}},

  let a,b,c; do{a=R(1,6)*(kind==='all'?1:pick([1,-1]));b=R(1,6)*(kind==='all'?1:pick([1,-1]));c=kind==='square'?a:R(1,6)*pick([1,-1])}while(kind==='neg'&&a>0&&b>0&&c>0);

/* ===== question variety: extra question types per topic =====
 Every topic draws from its original generator, a "Spot the slip" type (where the topic has numeric traps)
 and hand-written types below. Each new question carries `kind` so the Topic check can mix types. */
Object.assign(ERR,{
 'sign-change':['Didn\'t give the reason','A root lies between a and b because f(a) and f(b) have different signs (and f is continuous). Say so.'],
 'misdiagnosed':['Misread the evidence','Rework the question yourself, compare your steps with the student\'s answer, and find exactly where theirs goes wrong.'],
});
const BASE_G={...G};
const mixedHTML=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return n%d===0?''+(n/d):n>d?`${Math.floor(n/d)}${fr(n%d,d)}`:fr(n,d)};
const mixedRaw=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return n%d===0?''+(n/d):n>d?`${Math.floor(n/d)} ${n%d}/${d}`:`${n}/${d}`};
const fracEq=(raw,v)=>{const f=parseFrac(raw);return !!f&&Math.abs(f.n/f.d-v)<1e-12&&fracSimplest(f)};
const fracVal=raw=>{const f=parseFrac(raw);return f?f.n/f.d:parseNum(raw)};

/* ---------- Spot the slip (generic) ---------- */
const SLIP_NAMES=['Jordan','Priya','Sam','Leo','Aisha','Tom','Mia','Kofi'];
const SLIP_POOL=['sign-error','wrong-operation','stopped-early','rounding','order-error','wrong-formula','place-value','missed-square','radians','half','wrong-denominator','no-sqrt','index-law','reverse-pct','wrong-direction','wrong-ratio'];
const exactFrac=v=>{const f=toFrac(v);return f[1]>1&&f[1]<=200&&Math.abs(f[0]/f[1]-v)<1e-12?`${f[0]}/${f[1]}`:null};
function slipFmt(q,v){return /^£/.test(String(q.ans))?money(r2(v)):q.tol>=.05?trimNum(r1(v)):q.tol>=.004?trimNum(r2(v)):(q.tol<1e-6&&!Number.isInteger(v)&&exactFrac(v))||trimNum(r4(v))}
function slipEligible(q){
  if(q.ansV===undefined||q.fields||!q.traps) return [];
  return q.traps.filter(t=>t.v!==undefined&&isFinite(t.v)&&ERR[t.id]).filter(t=>{
    const shown=slipFmt(q,t.v), sv=parseNum(shown);
    if(!isFinite(sv)||near(sv,q.ansV,q.tol*2)) return false;
    return !q.traps.some(o=>o!==t&&o.id!==t.id&&o.v!==undefined&&near(sv,o.v,q.tol*2)); // unambiguous evidence
  });
}
function makeSlip(base){
  return ()=>{
    let q,ts=[]; for(let i=0;i<25&&!ts.length;i++){q=base();ts=slipEligible(q)}
    if(!ts.length) return q;
    const t=pick(ts), who=pick(SLIP_NAMES), shown=slipFmt(q,t.v), right=ERR[t.id][0];
    const others=[...new Set(q.traps.map(x=>x.id).filter(id=>id!==t.id&&ERR[id]))], pool=shuffle(SLIP_POOL.filter(id=>id!==t.id&&!others.includes(id)));
    const opts=[right,...[...others,...pool].slice(0,3).map(id=>ERR[id][0])].filter((x,i,a)=>a.indexOf(x)===i);
    const ansOk=raw=>q.check?q.check(raw):near((q.read||parseNum)(raw),q.ansV,q.tol);
    const model=q.model?q.model[0]:q.read===parseIndex?'x^'+q.ansV:(q.tol<1e-6&&exactFrac(q.ansV))||trimNum(q.ansV);
    return {kind:'slip',marks:q.marks+1,diagram:q.diagram,calc:q.calc,
      fields:[choiceField(`What went wrong in ${who}'s answer?`,opts),{label:'Correct answer'}],
      prompt:`<div class="slipcase"><span class="eyebrow">Case file</span><div>${q.prompt}</div></div>${who} answered <b>${shown}</b>, which is wrong. Find the slip, then work out the correct answer.`,
      ans:`${right}; correct answer ${q.ans}`, model:[right,model],
      check:r=>r[0]===right&&ansOk(r[1]),
      traps:[{test:r=>r[0]===right&&!ansOk(r[1]),id:'stopped-early',note:`You found the slip: ${right.toLowerCase()}. Now finish the job and work out the correct answer.`},
             {test:r=>r[0]!==right&&ansOk(r[1]),id:'misdiagnosed',note:`Your answer is right, but ${who}'s slip was: ${right.toLowerCase()}. ${t.note||ERR[t.id][1]}`},
             {test:r=>r[0]!==right,id:'misdiagnosed'}],
      steps:[['B1',`${who}'s slip: <b>${right}</b>. ${t.note||ERR[t.id][1]}`],...q.steps],
      hint:q.hint};
  };
}

const V={};
V.frac=[()=>{

  return {kind:'context',marks:3,ans:mixedHTML(N,L),model:[mixedRaw(N,L)],check:raw=>fracEq(raw,v),
   prompt:`A pizza is shared. Ali eats ${fr(a,b)} of it and Ben eats ${fr(c,d)} of it.<br>What fraction of the pizza is left? Give your answer in its simplest form.`,
   traps:[{test:raw=>Math.abs(fracVal(raw)-(A+C)/L)<1e-9,id:'stopped-early',note:'That is the fraction eaten. Subtract it from 1 whole.'},{test:raw=>Math.abs(fracVal(raw)-(1-(a+c)/(b+d)))<1e-9,id:'frac-add'},{test:raw=>{const f=parseFrac(raw);return f&&Math.abs(f.n/f.d-v)<1e-12&&!fracSimplest(f)},id:'not-simplified'}],

   steps:[['M1',`${w?w:''}${fr(N%D,D)} = ${fr(N,D)}`],['M1',`${fr(N,D)} ÷ ${fr(e,f)} = ${fr(N,D)} × ${fr(f,e)}`],['A1',`= <b>${k}</b> glasses`]]};

const PFparse=raw=>{const parts=String(raw).toLowerCase().replace(/[×*·]/g,'x').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'').split('x').filter(Boolean);if(!parts.length)return null;const out=[];for(const t of parts){const m=t.match(/^(\d+)(?:\^(\d+))?$/);if(!m)return null;out.push([+m[1],m[2]?+m[2]:1])}return out};

   prompt:`Work out the value of &nbsp;<span class="eq">${PFhtml(e)}</span>`,
   traps:[{v:[2,3,5,7].reduce((s,p,i)=>e[i]?s*(p*e[i]):s,1),id:'index-law',note:'A power means repeated multiplication: 2³ = 2 × 2 × 2, not 2 × 3.'}],
   steps:[['B1',`${[2,3,5,7].map((p,i)=>e[i]>1?`${p}<sup>${e[i]}</sup> = ${p**e[i]}`:'').filter(Boolean).join(', ')}; multiply: <b>${N}</b>`]]};

   steps:[['M1',`Squaring doubles each index: (${PFhtml(e)})²`],['A1',`<b>${PFhtml(e2)}</b>`]],hint:'Type it like 2^6 x 3^2'};
}];

V.surd=[()=>{

   check:s=>{const p=parseSurd(s);return !!p&&p.k===k&&p.r===m},
   prompt:`Simplify &nbsp;<span class="eq">√${a} × √${b}</span>. Give your answer in the form a√b, where b is as small as possible.`,
   traps:[{test:s=>{const p=parseSurd(s);return p&&p.k*p.k*p.r===P&&p.r!==m},id:'not-simplified',note:`√${a} × √${b} = √${P}. Now take out the square factor ${k*k}.`},{test:s=>{const p=parseSurd(s);return p&&p.k===k*k&&p.r===m},id:'surd-root'}],
   steps:[['M1',`√${a} × √${b} = √${P}`],['A1',`√${P} = √${k*k} × √${m} = <b>${k}√${m}</b>`]],hint:'Type the root as √ or sqrt, e.g. 4√3'};

   traps:[{test:s=>{const p=parseSurd(s);return p&&Math.abs(p.k*Math.sqrt(p.r)-Math.sqrt(A+B))<1e-9},id:'wrong-operation',note:`√${A} + √${B} is not √${A+B}. Simplify each surd first, then add like surds.`},{test:s=>Math.abs(parseNum(s)-k*Math.sqrt(m))<.06,id:'wrong-form',note:'Give the exact answer as a surd, not a decimal.'}],

V.iter=[()=>{

  const reasons=[`There is a sign change between x = ${k} and x = ${k+1}, so there is a root between them`,`f(${k}) is smaller than f(${k+1})`,`Both values are close to 0`,`f(${k+1}) is positive`];
  return {kind:'sign-change',marks:3,fields:[{label:`f(${k}) =`},{label:`f(${k+1}) =`},choiceField('Conclusion',reasons)],ans:`f(${k}) = ${neg(f(k))}, f(${k+1}) = ${neg(f(k+1))}: sign change`,model:[String(f(k)),String(f(k+1)),reasons[0]],
   check:r=>near(parseNum(r[0]),f(k),1e-9)&&near(parseNum(r[1]),f(k+1),1e-9)&&r[2]===reasons[0],
   prompt:`<span class="eq">f(x) = x³ − ${a===1?'':a}x − ${b}</span><br>Show that the equation f(x) = 0 has a root between x = ${k} and x = ${k+1}.`,
   traps:[{test:r=>near(parseNum(r[0]),f(k),1e-9)&&near(parseNum(r[1]),f(k+1),1e-9),id:'sign-change'},{test:r=>near(parseNum(r[0]),-f(k),1e-9)||near(parseNum(r[1]),-f(k+1),1e-9),id:'sign-error'}],
   steps:[['M1',`f(${k}) = ${k}³ − ${a*k} − ${b} = ${neg(f(k))}`],['M1',`f(${k+1}) = ${(k+1)**3} − ${a*(k+1)} − ${b} = ${neg(f(k+1))}`],['A1','Sign change (negative to positive), so a root lies between them']]};
}];
V.tangent=[()=>{
  let a,b; do{a=R(-6,6);b=R(-6,6)}while(!a||!b);
  const m=-a/b;
  return {kind:'gradient',marks:2,ansV:m,tol:1e-9,ans:frS(-a,b),model:[`${-a}/${b}`],
   prompt:`P(${neg(a)}, ${neg(b)}) lies on the circle &nbsp;<span class="eq">x² + y² = ${a*a+b*b}</span>.<br>Work out the gradient of the tangent to the circle at P.`,
   traps:[{v:b/a,id:'perp-gradient'},{v:a/b,id:'perp-gradient'}],
   steps:[['M1',`Gradient of radius OP = ${frS(b,a)}`],['A1',`Tangent is perpendicular: <b>${frS(-a,b)}</b>`]],hint:'Fractions are fine, e.g. -3/4'};
},()=>{
  let a,b; do{a=R(-6,6);b=R(-6,6)}while(!a||!b);
  const r2_=a*a+b*b, X=r2_/a;
  return {kind:'intercept',marks:3,ansV:X,tol:1e-9,ans:frS(r2_,a),model:[`${r2_}/${a}`],
   prompt:`P(${neg(a)}, ${neg(b)}) lies on the circle &nbsp;<span class="eq">x² + y² = ${r2_}</span>. The tangent at P crosses the x-axis at Q.<br>Work out the x-coordinate of Q.`,
   traps:[{v:r2_/b,id:'swapped',note:'That is where the tangent crosses the y-axis. On the x-axis, y = 0.'},{v:-X,id:'sign-error'}],
   steps:[['M1',`Tangent gradient ${frS(-a,b)}: y − ${b<0?'('+neg(b)+')':b} = ${frS(-a,b)}(x − ${a<0?'('+neg(a)+')':a})`],['M1','Set y = 0 and solve for x'],['A1',`x = <b>${frS(r2_,a)}</b>`]],hint:'Fractions are fine, e.g. 25/3'};
}];
V.bestbuy=[()=>{

   prompt:`A shop sells cans of drink in two multipacks: <b>${A}</b> or <b>${B}</b>.<br>Which is better value?`,

   steps:[['M1',`${money(p1)} ÷ ${n1} = ${(p1/n1*100).toFixed(1)}p per can; ${money(p2)} ÷ ${n2} = ${(p2/n2*100).toFixed(1)}p per can`],['A1',`<b>${best}</b>`]]};

V.parallel=[()=>{
  let p,q,r,s,x,ang; do{p=R(2,6);r=R(1,p-1);x=R(8,30);q=R(-20,30);ang=p*x+q;s=ang-r*x}while(ang<25||ang>155||!q||!s);
  const rel=pick(['alternate','corresponding']);
  return {kind:'algebra-equal',marks:3,fields:[{label:'x ='},{label:'Angle size (°)'}],ans:`x = ${x}, angle ${ang}°`,model:[String(x),String(ang)],
   check:r_=>multi(r_,[x,ang],1e-9,true),
   prompt:`Two ${rel} angles in a pair of parallel lines are &nbsp;<span class="eq">(${p}x ${sgn(q)})°</span>&nbsp; and &nbsp;<span class="eq">(${r===1?'':r}x ${sgn(s)})°</span>.<br>Find x and the size of each angle.`,
   traps:[{test:r_=>near(parseNum(r_[0]),(180-q-s)/(p+r),1e-6),id:'angle-fact',note:`${rel[0].toUpperCase()+rel.slice(1)} angles are equal, so set the expressions equal. They don't add to 180°.`},{test:r_=>near(parseNum(r_[0]),x,1e-9)&&!near(parseNum(r_[1]),ang,1e-9),id:'stopped-early',note:`x = ${x} is right. Substitute it back in to find the angle.`}],
   steps:[['M1',`${rel[0].toUpperCase()+rel.slice(1)} angles are equal: ${p}x ${sgn(q)} = ${r===1?'':r}x ${sgn(s)}`],['A1',`${p-r===1?'':p-r}x = ${s-q}${p-r===1?'':`, <b>x = ${x}</b>`}`.replace(/^x = (.*)$/,'<b>x = $1</b>')],['B1',`Angle = ${p} × ${x} ${sgn(q)} = <b>${ang}°</b>`]]};
},()=>{
  let p,q,r,s,x,a1; do{p=R(1,4);r=R(1,4);x=R(10,30);q=R(-10,40);a1=p*x+q;s=180-a1-r*x}while(a1<30||a1>150||!q||!s);
  return {kind:'algebra-sum',marks:3,ansV:x,tol:1e-9,ans:`x = ${x}`,model:[String(x)],
   prompt:`Two co-interior angles between a pair of parallel lines are &nbsp;<span class="eq">(${p===1?'':p}x ${sgn(q)})°</span>&nbsp; and &nbsp;<span class="eq">(${r===1?'':r}x ${sgn(s)})°</span>.<br>Find the value of x.`,
   traps:[{v:p!==r?(s-q)/(p-r):NaN,id:'angle-fact',note:'Co-interior angles add up to 180°. They are not equal.'}],
   steps:[['M1',`${p===1?'':p}x ${sgn(q)} + ${r===1?'':r}x ${sgn(s)} = 180`],['M1',`${p+r}x = ${180-q-s}`],['A1',`<b>x = ${x}</b>`]]};

V.pyth=[()=>{

   traps:[{v:dx*dx+dy*dy,id:'no-sqrt'},{v:Math.abs(dx)+Math.abs(dy),id:'wrong-operation',note:'The distance is the hypotenuse of a right-angled triangle with sides equal to the differences in x and y: use Pythagoras.'},{v:Math.sqrt(Math.abs(dx*dx-dy*dy)),id:'subtracted'}],
   steps:[['M1',`Differences: ${Math.abs(dx)} across, ${Math.abs(dy)} up`],['M1',`AB² = ${dx*dx} + ${dy*dy} = ${dx*dx+dy*dy}`],['A1',`AB = <b>${r1(d)}</b>`]]};

for(const id of Object.keys(BASE_G)){

/* ===== Calculator and non-calculator =====
 Every question is tagged 'calc' (needs a calculator) or 'non' (can be done with written methods, like Paper 1).
 Tags come from the question itself: a generator can set `calc`, a few topics always need a calculator,
 and otherwise a question that asks for a rounded answer (decimal places, significant figures, nearest penny…) needs one.
 In non-calculator mode, generators with a non-calculator version (Pythagoras, area of a circle, compound interest,
 reverse percentages, standard form) produce friendly numbers or exact answers instead. */
const CALC_ALWAYS=new Set(['trig','siner','cosr','areasin','trig3d','qform']);
const NONCALC_ALWAYS=new Set(['round','errint']);
const CALC_RE=/decimal place|significant figure|nearest penny|nearest (whole number|degree|cm|mm|metre)|\d\s*s\.f\./i;
function calcTag(topic,Q){
  if(!Q) return 'calc';
  if(Q.calc==='calc'||Q.calc==='non') return Q.calc;
  if(CALC_ALWAYS.has(topic)) return 'calc';
  if(NONCALC_ALWAYS.has(topic)) return 'non';
  return CALC_RE.test(String(Q.prompt||''))?'calc':'non';
}
/* A question for this topic. mode: 'any' (calculator allowed: every type), 'non' (non-calculator only) or 'calc' (calculator only).
   Returns null if the topic has no question of that kind. */
function genQ(topic,mode='any'){
  const g=G[topic]; if(!g) return null;
  if(mode!=='non'&&mode!=='calc'){const q=g();q.calcTag=calcTag(topic,q);return q}
  NOCALC=mode==='non';
  try{ for(let i=0;i<80;i++){const q=g(); const t=calcTag(topic,q); if(t===mode){q.calcTag=t;return q}} }
  finally{NOCALC=false}
  return null;
}
const _calcCache={};
// Does this topic have questions of this kind? (sampled once per session)
function topicHasMode(topic,mode){
  const k=topic+'|'+mode; if(k in _calcCache) return _calcCache[k];
  return _calcCache[k]=!!genQ(topic,mode);
}
const calcOnly=topic=>!topicHasMode(topic,'non');
// The student's choice for Practise and the Daily Case, remembered on this device
let CALC_MODE='any'; try{CALC_MODE=localStorage.getItem('mf-calc')==='non'?'non':'any'}catch(e){}
function setCalcMode(m){CALC_MODE=m==='non'?'non':'any';try{localStorage.setItem('mf-calc',CALC_MODE)}catch(e){}}
const calcPill=t=>t==='calc'?'<span class="tag calc" title="This question needs a calculator">🖩 Calculator</span>':'<span class="tag noncalc" title="No calculator needed: Paper 1 style">✎ Non-calculator</span>';
function calcToggleHTML(id='calcToggle'){
  return `<div class="calctoggle" role="group" aria-label="Calculator"><button type="button" class="chip" data-calc="any" aria-pressed="${CALC_MODE==='any'}">🖩 Calculator allowed</button><button type="button" class="chip" data-calc="non" aria-pressed="${CALC_MODE==='non'}">✎ Non-calculator</button></div>`;
}

/* ----- Paper practice sets: a timed mix across topics, like a section of a real paper ----- */
const PAPER_N=12;
const PAPER_INFO={1:{title:'Paper 1 practice',sub:'Non-calculator',mode:'non'},2:{title:'Paper 2 practice',sub:'Calculator',mode:'calc'}};
function buildPaperSet(paper,allowed,grade=5,n=PAPER_N){
  const mode=PAPER_INFO[paper].mode, lo=Math.max(1,grade-3), hi=Math.min(9,grade+2);
  let pool=allowed.filter(id=>TOP[id]&&TOP[id].grade>=lo&&TOP[id].grade<=hi&&topicHasMode(id,mode));
  if(pool.length<n) pool=allowed.filter(id=>TOP[id]&&topicHasMode(id,mode));
  // spread across strands, easiest first like a real paper
  const byStrand={}; for(const id of shuffle(pool.slice())) (byStrand[TOP[id].strand]=byStrand[TOP[id].strand]||[]).push(id);
  const picked=[], lists=Object.values(byStrand);
  for(let i=0;picked.length<Math.min(n,pool.length);i++){const l=lists[i%lists.length]; if(l.length) picked.push(l.shift()); if(lists.every(x=>!x.length)) break}
  while(picked.length<n&&pool.length) picked.push(pick(pool));
  return picked.sort((a,b)=>TOP[a].grade-TOP[b].grade).map(id=>({topic:id,why:PAPER_INFO[paper].sub,Q:genQ(id,mode)||genQ(id)})).filter(x=>x.Q);
}

/* ===== learning engine: mastery, spaced review, Daily Case, baseline diagnostic =====
 Pure functions over the attempts list, so they run the same in demo and live mode. */
const dayKey=iso=>new Date(iso).toLocaleDateString('en-CA'); // YYYY-MM-DD in the student's time zone
const DAILY_N=10, DIAG_N=20;

/* Mastery: "secure" = at least 4 of the last 5 answers correct, with correct answers on 2+ different days.
   Secure topics come back for review after 3, 6, 12… days (max 30), doubling with each extra day of success. */
const isHelped=a=>a&&a.ref==='help';
function masteryMap(attempts,now=Date.now()){
  const M={};
  const sorted=[...attempts].sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  for(const x of sorted){
    if(!TOP[x.topic]) continue;
    const t=M[x.topic]||(M[x.topic]={a:0,c:0,days:new Set(),hist:[],marks:[],last:0,lastCorrect:0,helped:0});
    const ts=new Date(x.created_at).getTime(), helped=isHelped(x);
    // an answer given after "Show me how" is practice: it shows as a "with help" dot but never counts towards secure
    t.a++; t.hist.push(!!x.correct&&!helped); t.marks.push(helped&&x.correct?'help':x.correct?'ok':'no'); t.last=Math.max(t.last,ts);
    if(x.correct){t.c++; if(helped) t.helped++; else {t.days.add(dayKey(x.created_at));t.lastCorrect=Math.max(t.lastCorrect,ts)}}
  }
  for(const id in M){
    const t=M[id], last5=t.hist.slice(-5), ok5=last5.filter(Boolean).length;
    t.acc=t.c/t.a;
    t.state=(ok5>=4&&t.days.size>=2)?'secure':'learning';
    t.interval=Math.min(30,3*2**Math.max(0,t.days.size-2));
    t.due=t.state==='secure'&&now-t.lastCorrect>t.interval*864e5;
    t.weak=t.state!=='secure';
  }
  return M;
}
function masterySummary(attempts,ids=Object.keys(TOP)){
  const M=masteryMap(attempts);
  return {secure:ids.filter(id=>M[id]&&M[id].state==='secure').length,learning:ids.filter(id=>M[id]&&M[id].state==='learning').length,
          due:ids.filter(id=>M[id]&&M[id].due),total:ids.length,M};
}

/* Daily Case: 4 weak topics, 3 reviews due, 2 new topics near the student's grade, 1 stretch topic. */
function buildDaily(attempts,{allowed=Object.keys(TOP),grade=4,n=DAILY_N,now=Date.now()}={}){
  const M=masteryMap(attempts,now), out=[], used={};
  const take=(list,k,why,maxUse=1)=>{for(const id of list){if(out.length>=n||k<=0)break;if((used[id]||0)>=maxUse)continue;out.push({topic:id,why});used[id]=(used[id]||0)+1;k--}};
  const rnd=a=>shuffle(a);
  const weak=allowed.filter(id=>M[id]&&M[id].weak).sort((a,b)=>M[a].acc-M[b].acc);
  const due=allowed.filter(id=>M[id]&&M[id].due).sort((a,b)=>M[a].lastCorrect-M[b].lastCorrect);
  const fresh=rnd(allowed.filter(id=>!M[id])).sort((a,b)=>Math.abs(TOP[a].grade-grade)-Math.abs(TOP[b].grade-grade));
  const near=fresh.filter(id=>TOP[id].grade<=grade+1);
  const stretch=rnd(allowed.filter(id=>TOP[id].grade>grade&&TOP[id].grade<=grade+2&&!(M[id]&&M[id].state==='secure')));
  take(weak,4,'Weak topic'); take(due,3,'Review'); take(near,2,'New topic'); take(stretch,1,'Stretch');
  // fill any gaps: more weak (up to twice each), then new, then reviews of secure topics, then anything
  take(weak,n,'Weak topic',2); take(fresh,n,'New topic');
  take(rnd(allowed.filter(id=>M[id]&&M[id].state==='secure')),n,'Review');
  for(let pass=0;pass<4&&out.length<n;pass++) take(rnd(allowed),n,'Practice',4);
  // spread out repeats: no topic twice in a row where avoidable
  const res=shuffle(out);
  for(let i=1;i<res.length;i++) if(res[i].topic===res[i-1].topic){const j=res.findIndex((r,k)=>k>i&&r.topic!==res[i].topic);if(j>0)[res[i],res[j]]=[res[j],res[i]]}
  return res.slice(0,n);
}
function dailyDoneToday(attempts){const k=dayKey(new Date().toISOString());return attempts.filter(a=>a.source==='daily'&&dayKey(a.created_at)===k).length}

/* Day streak: a day counts when the student answers STREAK_N questions anywhere in the Lab
   (Daily Case, practice, topic checks, exam parts or the diagnostic). Today still counts as
   "in progress" until midnight, so an unfinished today never breaks the streak. Steps back by
   calendar day (not 24 hours) so clock changes never skip or repeat a day. */
const STREAK_N=10;
function answersPerDay(attempts){const per={};for(const a of attempts){if(!a.created_at)continue;const k=dayKey(a.created_at);per[k]=(per[k]||0)+1}return per}
const prevDay=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,12);return x};
const localKey=d=>d.toLocaleDateString('en-CA');
function dailyStreak(attempts,now=new Date()){
  const per=answersPerDay(attempts);
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12), streak=0;
  if((per[localKey(d)]||0)<STREAK_N) d=prevDay(d); // today not finished yet: count from yesterday
  while((per[localKey(d)]||0)>=STREAK_N){streak++;d=prevDay(d)}
  return streak;
}
function bestStreak(attempts){
  const days=Object.entries(answersPerDay(attempts)).filter(([,n])=>n>=STREAK_N).map(([k])=>k).sort();
  let best=0,run=0,prev=null;
  for(const k of days){const t=new Date(k+'T12:00:00');run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=t}
  return best;
}
const answeredToday=(attempts,now=new Date())=>answersPerDay(attempts)[localKey(now)]||0;
/* Questions answered correctly in a row (practice, Daily Case and topic checks), counted from saved answers so it survives a reload. */
function inARow(attempts){
  const xs=attempts.filter(a=>a.source!=='diagnostic'&&a.source!=='exam'&&!(isHelped(a)&&a.correct)).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  let n=0; for(let i=xs.length-1;i>=0&&xs[i].correct;i--) n++; return n;
}

/* Suggested time per question, from the real papers: about 80 marks in 90 minutes, so ~70 seconds a mark,
   a little longer for grade 7–9 topics, plus reading time for a "Spot the slip" case file. Rounded to 15 s. */
function suggestedSeconds(marks,grade=4,kind=''){
  const per=grade>=7?85:70, s=(marks||1)*per+(kind==='slip'?30:0);
  return Math.max(45,Math.ceil(s/15)*15);
}
const fmtClock=s=>{s=Math.max(0,Math.round(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

/* Baseline diagnostic: 20 questions across four grade bands, spread over the six strands. */
const DIAG_BANDS=[{lo:1,hi:3,n:4},{lo:4,hi:5,n:6},{lo:6,hi:7,n:6},{lo:8,hi:9,n:4}];
function buildDiagnostic(){
  const out=[];
  for(const b of DIAG_BANDS){
    const byStrand={}; for(const t of Object.values(TOP)) if(t.grade>=b.lo&&t.grade<=b.hi)(byStrand[t.strand]=byStrand[t.strand]||[]).push(t.id);
    const strands=shuffle(Object.keys(byStrand)); Object.values(byStrand).forEach(l=>l.splice(0,l.length,...shuffle(l)));
    let k=0, guard=0; while(k<b.n&&guard++<100){const s=strands[guard%strands.length];const id=byStrand[s].shift();if(id){out.push({topic:id,why:`Grade ${TOP[id].grade}`});k++}}
  }
  return out;
}
/* Working grade: climb the bands while the student is secure enough in each one. */
function gradeFromDiagnostic(results){
  const band=b=>{const r=results.filter(x=>TOP[x.topic]&&TOP[x.topic].grade>=b.lo&&TOP[x.topic].grade<=b.hi);return r.length?r.filter(x=>x.correct).length/r.length:0};
  const acc=DIAG_BANDS.map(band);
  let grade=1;
  if(acc[0]>=.5) grade=acc[0]>=.75?3:2; else return {grade,acc};
  if(acc[1]>=.34) grade=acc[1]>=.67?5:4; else return {grade,acc};
  if(acc[2]>=.34) grade=acc[2]>=.67?7:6; else return {grade,acc};
  if(acc[3]>=.25) grade=acc[3]>=.75?9:8;
  return {grade,acc};
}

/* ---------- Topic check: 5 questions on one topic, mixing its question types; passed at 4/5 ---------- */
const CHECK_N=5, CHECK_PASS=4;
function buildTopicCheck(topic){
  const sig=q=>q.kind?'kind:'+q.kind:String(q.prompt).replace(/<[^>]+>/g,' ').replace(/[−\d.]+/g,'#').replace(/\s+/g,' ').slice(0,70)+(q.fields?q.fields.length:1);
  const seen={}, picked=[];
  for(let i=0;i<40&&picked.length<CHECK_N;i++){const q=G[topic](), s=sig(q); if(!seen[s]){seen[s]=1;picked.push(q)}}
  while(picked.length<CHECK_N) picked.push(G[topic]());
  return shuffle(picked).map(Q=>({topic,why:'Topic check',Q}));
}
function checkSessions(attempts,topic,since=''){ // [{ref,correct,total,at}]
  const g={};
  for(const a of attempts){const r=String(a.ref||''); if(!r.startsWith('check:'+(topic?topic+':':''))||String(a.created_at)<since) continue;
    (g[r]=g[r]||{ref:r,topic:r.split(':')[1],correct:0,total:0,at:a.created_at}); g[r].total++; if(a.correct) g[r].correct++}
  return Object.values(g);
}

/* ---------- Assignments: topic holds the kind: "<topic>", "check:<topic>", "exam:<id>" or "diag" ---------- */
function asgKind(a){const t=String(a.topic||'');if(t==='diag')return {kind:'diag'};if(t.startsWith('paper:'))return {kind:'paper',id:t.slice(6)};if(t.startsWith('exam:'))return {kind:'exam',id:t.slice(5)};if(t.startsWith('check:'))return {kind:'check',id:t.slice(6)};return {kind:'practice',id:t}}
function asgDefaultTitle(topic){const k=asgKind({topic});
  if(k.kind==='diag') return 'Baseline diagnostic';
  if(k.kind==='paper') return k.id==='1'?'Paper 1 practice (non-calculator)':'Paper 2 practice (calculator)';
  if(k.kind==='exam') return 'Exam question: '+((typeof EXAM_BY_ID!=='undefined'&&EXAM_BY_ID[k.id])?EXAM_BY_ID[k.id].title:k.id);
  if(k.kind==='check') return 'Topic check: '+(TOP[k.id]?TOP[k.id].name:k.id);
  return TOP[k.id]?TOP[k.id].name:k.id}
function asgValid(topic){const k=asgKind({topic});return k.kind==='diag'||(k.kind==='paper'&&(k.id==='1'||k.id==='2'))||(k.kind==='exam'&&typeof EXAM_BY_ID!=='undefined'&&!!EXAM_BY_ID[k.id])||((k.kind==='check'||k.kind==='practice')&&!!TOP[k.id])}
/* Who did the set work, and who seems not to understand it. One student's attempts.
   status: done · help (attempted, but the evidence says they're stuck) · progress · none */
function asgStatus(a,attempts,now=Date.now()){
  const k=asgKind(a), p=asgProgress(a,attempts), after=attempts.filter(x=>String(x.created_at)>=String(a.created_at));
  const overdue=now>new Date(a.due_at).getTime();
  const slip=xs=>{const e={};for(const x of xs) if(x.error_id) e[x.error_id]=(e[x.error_id]||0)+1;const top=Object.entries(e).sort((x,y)=>y[1]-x[1])[0];
    return top&&top[1]>=2&&typeof ERR!=='undefined'&&ERR[top[0]]?ERR[top[0]][0]:null};
  const out=(status,note,extra={})=>({status,note,overdue:overdue&&status!=='done',label:p.label,...extra});
  if(k.kind==='practice'){
    const xs=after.filter(x=>x.topic===k.id&&x.source!=='diagnostic'&&x.source!=='exam'&&!String(x.ref||'').startsWith('check:'));
    const n=xs.length, solo=xs.filter(x=>x.correct&&!isHelped(x)).length, helped=xs.filter(isHelped).length, sl=slip(xs);
    const bits=[`${solo} right out of ${n}`].concat(helped?[`${helped} with help`]:[],sl?[`keeps making: ${sl.toLowerCase()}`]:[]);
    if(p.done) return out('done',`${Math.min(solo,a.target)}/${a.target}${n>a.target*2?` · took ${n} tries`:''}`);
    if(!n) return out('none',overdue?'Not started · overdue':'Not started');
    if((n>=4&&solo/n<.5)||(helped>=2&&helped/n>=.5)) return out('help',bits.join(' · '));
    return out('progress',`${solo}/${a.target} correct so far · ${n} ${n===1?'try':'tries'}`);
  }
  if(k.kind==='check'){
    const ss=checkSessions(after,k.id), full=ss.filter(x=>x.total>=CHECK_N), best=full.reduce((b,x)=>!b||x.correct>b.correct?x:b,null);
    if(best&&best.correct>=CHECK_PASS) return out('done',`Passed ${best.correct}/${CHECK_N}`);
    if(best) return out('help',`Best ${best.correct}/${CHECK_N}${full.length>1?` after ${full.length} tries`:''}`);
    if(ss.length) return out('progress','Started, not finished');
    return out('none',overdue?'Not started · overdue':'Not started');
  }
  if(k.kind==='paper'){
    const ss=paperSessions(after,k.id), full=ss.filter(x=>x.total>=PAPER_DONE), best=full.reduce((b,x)=>!b||x.correct/x.total>b.correct/b.total?x:b,null);
    if(best) return best.correct/best.total<.4?out('help',`${best.correct}/${best.total} right`):out('done',`${best.correct}/${best.total} right`);
    if(ss.length) return out('progress','Started, not finished');
    return out('none',overdue?'Not done · overdue':'Not done');
  }
  if(k.kind==='exam'){
    const b=typeof examBest==='function'?examBest(after,k.id):null;
    if(!b) return out('none',overdue?'Not handed in · overdue':'Not handed in');
    return b.m&&b.s/b.m<.4?out('help',`${b.s}/${b.m} marks`):out('done',`${b.s}/${b.m} marks`);
  }
  const n=after.filter(x=>x.source==='diagnostic').length;
  return n>=DIAG_N?out('done','Completed'):n?out('progress',`${n}/${DIAG_N} answered`):out('none',overdue?'Not started · overdue':'Not started');
}
/* Paper practice sets: one hand-in per ref "paper:<n>:<time>". A set counts once 10 or more answers are in. */
const PAPER_DONE=10;
function paperSessions(attempts,paper,since=''){
  const g={}; for(const a of attempts){const r=String(a.ref||''); if(!r.startsWith('paper:'+(paper?paper+':':''))||String(a.created_at)<since) continue;
    (g[r]=g[r]||{ref:r,paper:r.split(':')[1],correct:0,total:0,at:a.created_at}); g[r].total++; if(a.correct) g[r].correct++}
  return Object.values(g);
}
function asgProgress(a,attempts){ // attempts of ONE student
  const k=asgKind(a), after=attempts.filter(x=>String(x.created_at)>=String(a.created_at));
  if(k.kind==='practice'){const mine=after.filter(x=>x.topic===k.id&&x.correct), done=mine.filter(x=>!isHelped(x)).length, h=mine.length-done;
    return {done:done>=a.target,frac:Math.min(1,done/a.target),helped:h,label:`${Math.min(done,a.target)}/${a.target} correct${h?` (+${h} with help)`:''}`}}
  if(k.kind==='check'){const s=checkSessions(after,k.id).filter(x=>x.total>=CHECK_N);const best=s.reduce((b,x)=>x.correct>(b?b.correct:-1)?x:b,null);
    return {done:!!best&&best.correct>=CHECK_PASS,frac:best?best.correct/CHECK_N:0,label:best?`Best ${best.correct}/${CHECK_N}${best.correct>=CHECK_PASS?' · passed':''}`:'Not attempted'}}
  if(k.kind==='exam'){const b=typeof examBest==='function'?examBest(after,k.id):null;return {done:!!b,frac:b?b.s/b.m:0,label:b?`${b.s}/${b.m} marks`:'Not handed in'}}
  if(k.kind==='paper'){const s=paperSessions(after,k.id).filter(x=>x.total>=PAPER_DONE);const best=s.reduce((b,x)=>!b||x.correct/x.total>b.correct/b.total?x:b,null);
    return {done:!!best,frac:best?best.correct/best.total:0,label:best?`Best ${best.correct}/${best.total}`:'Not done'}}
  const n=after.filter(x=>x.source==='diagnostic').length;return {done:n>=DIAG_N,frac:Math.min(1,n/DIAG_N),label:n>=DIAG_N?'Completed':n?`${n}/${DIAG_N} answered`:'Not started'};
}

/* ---------- Welcome back: last study session and what to do next ---------- */
/* A session is a run of answers with no gap longer than 60 minutes. */
const SESSION_GAP=60*6e4;
function lastSession(attempts){
  const xs=attempts.filter(a=>a.created_at&&TOP[a.topic]).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  if(!xs.length) return null;
  let i=xs.length-1;
  while(i>0&&new Date(xs[i].created_at)-new Date(xs[i-1].created_at)<=SESSION_GAP) i--;
  const s=xs.slice(i), by={};
  for(const a of s){const t=by[a.topic]||(by[a.topic]={id:a.topic,n:0,c:0});t.n++;if(a.correct)t.c++}
  const errs={}; for(const a of s) if(a.error_id&&ERR[a.error_id]) errs[a.error_id]=(errs[a.error_id]||0)+1;
  const srcs=[...new Set(s.map(a=>a.source||'practice'))];
  return {start:s[0].created_at,end:s[s.length-1].created_at,n:s.length,correct:s.filter(a=>a.correct).length,
    topics:Object.values(by).sort((a,b)=>b.n-a.n),errs:Object.entries(errs).sort((a,b)=>b[1]-a[1]),sources:srcs};
}
/* Calendar days between a date and now, in the student's time zone (0 = today, 1 = yesterday). */
function daysAgo(iso,now=new Date()){
  const a=new Date(iso), d0=new Date(a.getFullYear(),a.getMonth(),a.getDate()), d1=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((d1-d0)/864e5);
}
/* Up to three next steps, most useful first. Each: {kind, arg, title, why}.
   kind: 'run' (diag/daily), 'asg' (teacher work), 'check' (topic check), 'practise' (a topic). */
function recommendNext(attempts,{allowed=Object.keys(TOP),grade=null,hasDiag=false,assignments=[],now=new Date()}={}){
  const out=[], used=new Set(), add=r=>{const k=r.kind+':'+r.arg;if(!used.has(k)&&out.length<3){used.add(k);out.push(r)}};
  const M=masteryMap(attempts,now.getTime()), g=grade||4;
  if(!hasDiag) add({kind:'run',arg:'diag',title:'Take the baseline diagnostic',why:'20 questions, about 25 minutes. It gives you a working grade and builds your Daily Case around your weak spots.'});
  const open=assignments.map(a=>({a,p:asgProgress(a,attempts)})).filter(x=>!x.p.done).sort((x,y)=>String(x.a.due_at).localeCompare(String(y.a.due_at)));
  if(open[0]) add({kind:'asg',arg:open[0].a.topic,title:'Teacher work: '+open[0].a.title,why:`Due ${new Date(open[0].a.due_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}. ${open[0].p.label}.`});
  const today=dailyDoneToday(attempts);
  if(today<DAILY_N){const due=allowed.filter(id=>M[id]&&M[id].due).length, weak=allowed.filter(id=>M[id]&&M[id].a>=2&&M[id].acc<0.6).length;
    add({kind:'run',arg:'daily',title:today?`Finish today's Daily Case (${today}/${DAILY_N})`:"Do today's Daily Case",
      why:[weak?`${weak} topic${weak>1?'s':''} to strengthen`:'',due?`${due} topic${due>1?'s':''} due for review`:'','about 15 minutes'].filter(Boolean).join(' · ').replace(/^./,c=>c.toUpperCase())+'.'})}
  // nearly there: good recent record but the case is still open
  const passed=id=>checkSessions(attempts,id).some(s=>s.total>=CHECK_N&&s.correct>=CHECK_PASS);
  const close=allowed.filter(id=>M[id]&&M[id].hist.length>=3&&M[id].hist.slice(-5).filter(Boolean).length>=3&&!passed(id))
    .sort((a,b)=>M[b].last-M[a].last);
  if(close[0]) add({kind:'check',arg:close[0],title:'Close the case: '+TOP[close[0]].name,why:`You're getting most of these right. Pass the ${CHECK_N}-question Topic check (${CHECK_PASS}/${CHECK_N}) to prove it.`});
  // weakest topic tried recently
  const weak=allowed.filter(id=>M[id]&&M[id].a>=2&&M[id].weak&&M[id].acc<0.6).sort((a,b)=>M[a].acc-M[b].acc);
  if(weak[0]) add({kind:'practise',arg:weak[0],title:'Rebuild: '+TOP[weak[0]].name,why:`${M[weak[0]].c} of ${M[weak[0]].a} right so far. Read the Case briefing first, then try a few more.`});
  const due=allowed.filter(id=>M[id]&&M[id].due).sort((a,b)=>M[a].lastCorrect-M[b].lastCorrect);
  if(due[0]) add({kind:'practise',arg:due[0],title:'Review: '+TOP[due[0]].name,why:`Secure, but you haven't practised it for ${daysAgo(new Date(M[due[0]].lastCorrect).toISOString(),now)} days. A quick review keeps it that way.`});
  const fresh=allowed.filter(id=>!M[id]).sort((a,b)=>Math.abs(TOP[a].grade-g)-Math.abs(TOP[b].grade-g)||TOP[a].grade-TOP[b].grade);
  if(fresh[0]) add({kind:'practise',arg:fresh[0],title:'New topic: '+TOP[fresh[0]].name,why:`Grade ${TOP[fresh[0]].grade}, close to your working grade. You haven't started it yet.`});
  return out;
}

/* ---------- Study sessions and time, estimated from answer times ----------
   Answers more than 10 minutes apart start a new session, so an idle tab doesn't count.
   Session time = first to last answer, plus 1 minute for the last question. */
const STUDY_GAP=10*6e4;
const ACT_LABEL={daily:'Daily Case',diagnostic:'Baseline diagnostic',exam:'Exam room',practice:'Practice'};
function studySessions(attempts){
  const xs=attempts.filter(a=>a.created_at).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  const out=[]; let cur=null;
  for(const a of xs){const t=new Date(a.created_at).getTime();
    if(!cur||t-cur.endT>STUDY_GAP){cur={startT:t,endT:t,items:[]};out.push(cur)}
    cur.endT=t; cur.items.push(a)}
  return out.map(s=>{
    const n=s.items.length, c=s.items.filter(a=>a.correct).length;
    const checks={}; for(const a of s.items){const r=String(a.ref||'');if(r.startsWith('check:')){const k=r.split(':').slice(0,2).join(':');(checks[k]=checks[k]||{topic:r.split(':')[1],n:0,c:0});checks[k].n++;if(a.correct)checks[k].c++}}
    const papers={}; for(const a of s.items){const r=String(a.ref||'');if(r.startsWith('paper:')){(papers[r]=papers[r]||{p:r.split(':')[1],n:0,c:0});papers[r].n++;if(a.correct)papers[r].c++}}
    const kinds=[...new Set(s.items.filter(a=>!/^(check|paper):/.test(String(a.ref||''))).map(a=>a.source||'practice'))];
    const parts=kinds.map(k=>ACT_LABEL[k]||k).concat(Object.values(checks).map(x=>`Topic check: ${TOP[x.topic]?TOP[x.topic].name:x.topic} (${x.c}/${x.n})`),Object.values(papers).map(x=>`Paper ${x.p} practice (${x.c}/${x.n})`));
    const tcount={}; for(const a of s.items) if(TOP[a.topic]) tcount[a.topic]=(tcount[a.topic]||0)+1;
    return {start:new Date(s.startT).toISOString(),end:new Date(s.endT).toISOString(),answers:n,correct:c,helped:s.items.filter(isHelped).length,
      minutes:Math.max(1,Math.round((s.endT-s.startT)/6e4)+1),activity:parts.join(' · ')||'Practice',
      topics:Object.entries(tcount).sort((a,b)=>b[1]-a[1]).map(([id])=>id)};
  }).reverse(); // newest first
}
function minutesThisWeek(attempts,now=Date.now()){
  return studySessions(attempts).filter(s=>now-new Date(s.end).getTime()<=7*864e5).reduce((m,s)=>m+s.minutes,0);
}
// Same shape as the database's student_week(): a summary only, never individual answers
function activitySummary(attempts,now=Date.now()){
  const ss=studySessions(attempts.filter(a=>now-new Date(a.created_at).getTime()<=60*864e5)); if(!ss.length) return {week_minutes:0,last_session:null};
  const last=ss[0], cut=new Date(last.start).getTime(), endT=new Date(last.end).getTime();
  const items=attempts.filter(a=>{const t=new Date(a.created_at).getTime();return t>=cut&&t<=endT});
  return {week_minutes:minutesThisWeek(attempts,now),last_session:{start:last.start,end:last.end,answers:last.answers,minutes:last.minutes,
    kinds:[...new Set(items.map(a=>{const r=String(a.ref||'');return r.startsWith('check:')?'check':r.startsWith('paper:')?'paper':(a.source||'practice')}))]}};
}
// "Show me how" use: each helped answer is one question where the student opened the worked example
function helpStats(attempts,days=7,now=Date.now()){
  const xs=attempts.filter(a=>a.source!=='diagnostic'&&a.source!=='exam'&&now-new Date(a.created_at).getTime()<=days*864e5&&!String(a.ref||'').startsWith('check:'));
  const h=xs.filter(isHelped), by={}; for(const a of h) if(TOP[a.topic]) by[a.topic]=(by[a.topic]||0)+1;

function timerLabel(sec=TIMER.sec){

   The example comes from the same generator, so it is the same type of question with different numbers.

function similarCase(topic,Q){
  const gen=G[topic]; if(!gen) return null;
  let best=null, bestScore=-1; const want=Q.calcTag||null;
  NOCALC=want==='non';
  try{
  for(let i=0;i<80;i++){
    let c; try{c=gen()}catch(e){continue}
    if(!c||!c.steps||(c.prompt===Q.prompt&&c.ans===Q.ans&&(c.diagram||'')===(Q.diagram||''))) continue;
    const sc=(c.kind===Q.kind?4:0)+(stepMarks(c)===stepMarks(Q)?2:0)+(skeleton(c.prompt)===skeleton(Q.prompt)?3:0)+(!want||calcTag(topic,c)===want?3:0);
    if(sc>bestScore){best=c;bestScore=sc}
    if(sc>=12) break;
  }
  } finally {NOCALC=false}

}

// Opens the panel in `slot` for the question Q. Returns false if there is nothing to show.
function openShowMe(slot,topic,Q,onClose){
  if(!slot) return false;

  Q.helped=true;
  slot.innerHTML=showMeHTML(topic,E);
  exSeen[topic]=1; try{localStorage.setItem('mf-ex-seen',JSON.stringify(exSeen))}catch(e){}
  const items=[...slot.querySelectorAll('.smsteps li')];
  const reveal=all=>{const next=items.find(li=>li.hidden); if(next) next.hidden=false; if(all) items.forEach(li=>li.hidden=false);
    if(!items.some(li=>li.hidden)){slot.querySelector('#smNext').hidden=true;slot.querySelector('#smAll').hidden=true;slot.querySelector('.smdone').hidden=false}};
  slot.querySelector('#smNext').onclick=()=>reveal(false);

/* ---------- marking ---------- */
function markExam(parts,answers){ // answers: {a:{A:[],W:[]},…}
  const P={}, out=[];
  for(const part of parts){
    const ans=answers[part.label]||{A:[],W:[]}; P[part.label]=ans;
    let c=false; if(ans.A.length&&ans.A.every(has)) try{c=part.correct(ans.A,ans.W,P)}catch(e){}
    const pts=[]; for(const pt of part.points){let ok=!!c;if(!c){try{ok=!!pt.test(ans.A,ans.W,P)}catch(e){ok=false}if(pt.dep&&!(pts[pts.length-1]||{}).ok)ok=false}pts.push({code:pt.code,text:pt.text,ok,ft:c==='ft'})}
    let trap=null; if(!c&&ans.A.some(has)) for(const t of part.traps){let hit=false;try{hit=t.test(ans.A,ans.W,P)}catch(e){} if(hit){trap=t;break}}
    ans.res={c,trap};
    out.push({label:part.label,pts,score:pts.filter(p=>p.ok).length,max:pts.length,c,trap,blank:!ans.A.some(has)});
  }
  return out;
}
function examBest(attempts,id){ // best total across hand-ins (parts of one hand-in share created_at)
  const g={}; for(const a of attempts) if(a.source==='exam'&&String(a.ref||'').startsWith(id+':')){const k=a.created_at;(g[k]=g[k]||{s:0,m:0});g[k].s+=a.marks||0;g[k].m+=a.max_marks||0}
  const v=Object.values(g); if(!v.length) return null;
  return v.reduce((b,x)=>x.s>b.s?x:b,v[0]);
}

function supabaseStore(cfg){
  // capture invite / password-recovery links before the client consumes the URL hash
  const hash=location.hash||'';
  const linkType=/type=invite/.test(hash)?'invite':/type=recovery/.test(hash)?'recovery':null;

  // so email security scanners that open links automatically can't use them up
  const qs=new URLSearchParams(location.search);
  const pendingLink=qs.get('token_hash')&&qs.get('type')?{token_hash:qs.get('token_hash'),type:qs.get('type')}:null;
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
  const redirect=location.origin+location.pathname;
  const must=({data,error})=>{if(error) throw new Error(friendly(error.message));return data};
  const friendly=m=>({
    'Invalid login credentials':'That email and password don\'t match an account. Check for typos, or create an account.',
    'Email not confirmed':'Confirm your email first: open the link we sent you, then sign in.',
    'User already registered':'There is already an account with that email. Sign in instead.',
    'Token has expired or is invalid':'This link has expired or has already been used. Ask for a new one below.',
    'Email link is invalid or has expired':'This link has expired or has already been used. Ask for a new one below.',
    'New password should be different from the old password.':'Choose a password you haven\'t used before on this account.',
  })[m]||m.replace(/^.*?ERROR:\s*/,'');
  const me=async()=>{const {data:{session}}=await sb.auth.getSession();return session?.user||null};
  const profile=async id=>{
    const q=()=>sb.from('profiles').select('id,name,email,role,school_id').eq('id',id).maybeSingle();
    let r=await q(); if(r.error) must(r);
    if(r.data) return r.data;
    // no profile for this account: repair it (migration 006), or explain why it can't be
    const fx=await sb.rpc('ensure_my_profile');
    const st=fx.error?'missing':(fx.data&&fx.data.status);
    if(st==='created'||st==='ok'){r=await q(); if(r.data) return r.data}
    await sb.auth.signOut();
    if(st==='email_taken') throw new Error('There is already a Lab account with this email address, created with a different sign-in method. Sign in the way you did before: Google, or your email and password.');
    if(st==='no_email') throw new Error('Your Microsoft account didn\'t share an email address, so we couldn\'t create your Lab account. Try Google, or sign up with your email and a password.');
    throw new Error('Your account was found but its Lab profile is missing. The Lab needs a one-off database update: run supabase/migrations/006_ensure_profile.sql in the Supabase SQL Editor, then sign in again.');
  };
  const callFn=async(name,body)=>{
    const {data,error}=await sb.functions.invoke(name,{body});
    if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}
      if(/error sending .*email/i.test(m)) m='The invite email could not be sent, so nothing was created. Supabase could not send through your email server: check Authentication → SMTP Settings (host, port, username, password), then try again.';
      throw new Error(m)}
    return data;
  };
  // the invite function returns the new account's id; anything else means it isn't running the Maths Forensics code
  const checkInvite=d=>{if(!d||!d.id) throw new Error('No invite was sent: the "invite" edge function replied, but not with an account. Check its Code tab contains the Maths Forensics invite code, then deploy it again.');return d};
  const code6=()=>Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');

  return {
    mode:'live', linkType, pendingLink,
    async verifyLink(){
      const {token_hash,type}=this.pendingLink;
      try{must(await sb.auth.verifyOtp({token_hash,type}))}
      finally{this.pendingLink=null;history.replaceState(null,'',redirect)}
      this.linkType=(type==='invite'||type==='recovery')?type:null;
      return this.session();
    },
    checkoutUrl:cfg.checkoutUrl||'',
    kitCheckoutUrl:cfg.kitCheckoutUrl||'',
    async session(){
      const u=await me(); if(!u) return null;
      const p=await profile(u.id);
      // Google / Microsoft give the name as full_name; fill it in once if the profile has none
      const md=u.user_metadata||{}, fullName=md.full_name||md.name;
      if(p&&!p.name&&fullName){try{await sb.from('profiles').update({name:String(fullName).slice(0,80)}).eq('id',u.id)}catch(e){}}
      let stored=null; try{stored=localStorage.getItem('mf-pending-code')}catch(e){}
      const pending=md.pending_code||stored;
      // listed by their school? join those classes automatically (migration 005; quietly skipped if not run yet)
      let listed=[]; if(p&&p.role==='student'){try{const r=await sb.rpc('claim_roster');if(!r.error&&Array.isArray(r.data))listed=r.data}catch(e){}}
      this.joinedFromList=listed;
      if(pending){ // class code typed at sign-up, joined after the email is confirmed (or after Google / Microsoft sign-in)
        try{await this.joinClass(u.id,pending)}catch(e){if(!/already in that class/.test(e.message))this.joinError=e.message}
        if(md.pending_code) await sb.auth.updateUser({data:{pending_code:null}});
        try{localStorage.removeItem('mf-pending-code')}catch(e){}
        return profile(u.id);
      }
      if(listed.length) return profile(u.id);
      return (p&&!p.name&&fullName)?profile(u.id):p;
    },
    async signIn(email,pw){
      must(await sb.auth.signInWithPassword({email:String(email).trim(),password:pw}));
      return this.session();
    },
    async signOut(){await sb.auth.signOut()},
    // Which of Google / Microsoft are switched on in Supabase (Authentication → Sign In / Providers)
    async oauthProviders(){
      try{const r=await fetch(cfg.supabaseUrl+'/auth/v1/settings',{headers:{apikey:cfg.supabaseAnonKey}});const s=await r.json();
        return ['google','azure'].filter(p=>s.external&&s.external[p])}catch(e){return []}
    },
    async signInWithProvider(provider,code){
      try{code?localStorage.setItem('mf-pending-code',String(code).trim().toUpperCase()):localStorage.removeItem('mf-pending-code')}catch(e){}
      must(await sb.auth.signInWithOAuth({provider,options:{redirectTo:redirect,scopes:provider==='azure'?'openid email profile':undefined}}));
    },
    oauthError:(()=>{const m=/error_description=([^&]+)/.exec(location.hash+'&'+location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null})(),
    async signUp({name,email,pw,code}){
      email=String(email).trim().toLowerCase();
      if(!name.trim()) throw new Error('Enter your name.');
      if(String(pw).length<8) throw new Error('Use a password of at least 8 characters.');
      code=(code||'').trim().toUpperCase();
      if(code){const cls=must(await sb.rpc('check_class_code',{p_code:code}));if(!cls) throw new Error('That class code wasn\'t found. Check it with your teacher.')}
      const d=must(await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:redirect,data:{name:name.trim(),pending_code:code||null}}}));
      if(!d.session) return {needsConfirm:true,email};
      return this.session();
    },
    async resetPassword(email){must(await sb.auth.resetPasswordForEmail(String(email).trim(),{redirectTo:redirect}))},
    async setPassword(pw){if(String(pw).length<8) throw new Error('Use a password of at least 8 characters.');must(await sb.auth.updateUser({password:pw}));history.replaceState(null,'',redirect)},
    async access(){return must(await sb.rpc('my_access'))||{level:'free'}},
    // `source` and `diagnostics` arrive with migration 002; until it is run, fall back quietly
    async recordAttempt(userId,topic,correct,error_id,source='practice',extra={}){
      const row={user_id:userId,topic,correct,error_id:error_id||null};
      let r=await sb.from('attempts').insert({...row,source,...extra});
      if(r.error&&/source|marks|ref/.test(r.error.message)) r=await sb.from('attempts').insert(row);
      must(r);
    },
    async attempts(userId){
      let r=await sb.from('attempts').select('topic,correct,error_id,created_at,user_id,source,marks,max_marks,ref').eq('user_id',userId).order('created_at').limit(5000);
      if(r.error&&/source|marks|ref/.test(r.error.message)) r=await sb.from('attempts').select('topic,correct,error_id,created_at,user_id').eq('user_id',userId).order('created_at').limit(5000);
      return must(r).map(a=>({source:'practice',...a}));
    },
    async saveDiagnostic(userId,{grade,score,max,detail}){return must(await sb.from('diagnostics').insert({user_id:userId,grade,score,max,detail}).select().single())},
    async diagnostics(userId){const r=await sb.from('diagnostics').select('*').eq('user_id',userId).order('created_at',{ascending:false});return r.error?[]:r.data},
    async resetMyProgress(userId){must(await sb.from('attempts').delete().eq('user_id',userId))},
    async joinClass(userId,code){
      const id=must(await sb.rpc('join_class',{p_code:String(code).trim().toUpperCase()}));
      return must(await sb.from('classes').select('id,name').eq('id',id).single());
    },
    async studentClasses(){return must(await sb.rpc('my_classes'))},
    async studentAssignments(userId){
      const rows=must(await sb.from('assignments').select('*').gte('due_at',new Date(Date.now()-14*DAY).toISOString()).order('due_at'));
      return rows;
    },
    async teacherClasses(teacherId){
      const cls=must(await sb.from('classes').select('*').eq('teacher_id',teacherId).order('created_at'));
      const mem=cls.length?must(await sb.from('class_members').select('class_id').in('class_id',cls.map(c=>c.id))):[];
      return cls.map(c=>({...c,students:mem.filter(m=>m.class_id===c.id).length}));
    },
    async createClass(teacherId,name){
      if(!name.trim()) throw new Error('Give the class a name, e.g. 11X2.');
      const p=await profile(teacherId);
      for(let i=0;i<5;i++){
        const {data,error}=await sb.from('classes').insert({school_id:p.school_id,teacher_id:teacherId,name:name.trim(),code:code6()}).select().single();
        if(!error) return data;
        if(!/duplicate key/.test(error.message)) throw new Error(friendly(error.message));
      }
      throw new Error('Couldn\'t create a unique class code. Try again.');
    },
    async classDetail(classId){
      const c=must(await sb.from('classes').select('*').eq('id',classId).single());
      const mem=must(await sb.from('class_members').select('user_id').eq('class_id',classId));
      const ids=mem.map(m=>m.user_id);
      const students=ids.length?must(await sb.from('profiles').select('id,name,email').in('id',ids).order('name')):[];
      let ar=ids.length?await sb.from('attempts').select('user_id,topic,correct,error_id,created_at,source,ref,marks,max_marks').in('user_id',ids).limit(20000):{data:[]};
      if(ar.error&&/source|marks|ref/.test(ar.error.message)) ar=await sb.from('attempts').select('user_id,topic,correct,error_id,created_at').in('user_id',ids).limit(20000);
      const attempts=must(ar);
      const asg=must(await sb.from('assignments').select('*').eq('class_id',classId).order('due_at'));
      const assignments=asg;
      const dg=ids.length?await sb.from('diagnostics').select('user_id,grade,score,max,created_at').in('user_id',ids).order('created_at',{ascending:false}):{data:[]};
      const ro=await sb.from('roster').select('id,class_id,email,name,created_at,claimed_at').eq('class_id',classId).order('name');
      return {...c,students,attempts,assignments,diagnostics:dg.error?[]:dg.data,roster:ro.error?[]:ro.data};
    },
    async createAssignment(classId,{topic,target,due_at,title}){
      if(!asgValid(topic)) throw new Error('Choose what to set.');
      if(asgKind({topic}).kind!=='practice') target=1;
      if(!(target>=1&&target<=50)) throw new Error('Set a target between 1 and 50 correct answers.');
      if(!due_at) throw new Error('Choose a due date.');
      return must(await sb.from('assignments').insert({class_id:classId,title:title||asgDefaultTitle(topic),topic,target:+target,due_at:new Date(due_at+'T18:00:00').toISOString()}).select().single());
    },
    async deleteAssignment(id){must(await sb.from('assignments').delete().eq('id',id))},
    async schoolOverview(schoolId){
      const s=must(await sb.from('schools').select('*').eq('id',schoolId).single());
      const used=must(await sb.rpc('seats_used',{p_school:schoolId}));
      const people=must(await sb.from('profiles').select('id,name,email,role').eq('school_id',schoolId));
      const cls=must(await sb.from('classes').select('*').eq('school_id',schoolId).order('name'));
      const mem=cls.length?must(await sb.from('class_members').select('class_id').in('class_id',cls.map(c=>c.id))):[];
      return {...s,seats_used:used,teachers:people.filter(p=>p.role==='teacher'),
        classes:cls.map(c=>({...c,teacher:people.find(p=>p.id===c.teacher_id)?.name||'',students:mem.filter(m=>m.class_id===c.id).length}))};
    },
    async addTeacher(schoolId,name,email){return checkInvite(await callFn('invite',{kind:'teacher',name,email,redirect}))},
    async schoolDetail(schoolId){
      const r=await sb.rpc('school_detail',{p_school:schoolId});
      if(r.error&&/school_detail|function/.test(r.error.message)) throw new Error('School details need a one-off database update: run supabase/migrations/003_school_detail.sql in the Supabase SQL Editor.');
      return must(r);
    },
    async submitReport({kind,reason,comment,context}){
      const u=await me(); if(!u) throw new Error('Sign in first.');
      const r=await sb.from('reports').insert({user_id:u.id,kind,reason:String(reason).slice(0,80),comment:String(comment||'').slice(0,2000)||null,context});
      if(r.error&&/reports|relation/.test(r.error.message)) throw new Error('Reports need a one-off database update (migration 007). Please email support@mathsforensics.com instead for now.');
      must(r);
    },
    async reports(status='open'){
      let q=sb.from('reports').select('*').order('created_at',{ascending:false}).limit(200);
      q=status==='open'?q.eq('status','open'):q.neq('status','open');
      const r=await q; if(r.error&&/reports|relation/.test(r.error.message)) throw new Error('Reports need a one-off database update: run supabase/migrations/007_reports.sql in the Supabase SQL Editor.');
      return must(r);
    },
    async setReportStatus(id,status){must(await sb.from('reports').update({status,resolved_at:status==='open'?null:new Date().toISOString()}).eq('id',id))},
    async rosterAdd(rows){
      const r=await sb.rpc('roster_add',{p_rows:rows});
      if(r.error&&/roster_add|function/.test(r.error.message)) throw new Error('Class lists need a one-off database update: run supabase/migrations/005_roster_reports.sql in the Supabase SQL Editor.');
      return must(r);
    },
    async roster(classIds){
      if(!classIds.length) return [];
      const r=await sb.from('roster').select('id,class_id,email,name,created_at,claimed_at').in('class_id',classIds).order('name');
      return r.error?[]:r.data;
    },
    async rosterRemove(id){must(await sb.rpc('roster_remove',{p_id:id}))},
    async setRosterOnly(schoolId,on){must(await sb.rpc('set_roster_only',{p_school:schoolId,p_on:!!on}))},
    async schoolReport(schoolId,from,to){
      const r=await sb.rpc('school_report',{p_school:schoolId,p_from:from,p_to:to});
      if(r.error&&/school_report|function/.test(r.error.message)) throw new Error('School reports need a one-off database update: run supabase/migrations/005_roster_reports.sql in the Supabase SQL Editor.');
      return must(r);
    },
    async passLogins(){const r=await sb.rpc('owner_pass_logins');return r.error?[]:r.data},
    async ownerOverview(){
      const schools=must(await sb.from('schools').select('*').order('created_at'));
      const admins=must(await sb.from('profiles').select('email,school_id').eq('role','schooladmin'));
      const used=await Promise.all(schools.map(s=>sb.rpc('seats_used',{p_school:s.id}).then(must)));
      const passes=must(await sb.from('entitlements').select('*').order('created_at',{ascending:false}).limit(500));
      const emails=passes.length?must(await sb.from('profiles').select('email').in('email',passes.map(p=>p.email))).map(p=>p.email.toLowerCase()):[];
      const {count}=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('role','student');
      return {schools:schools.map((s,i)=>({...s,seats_used:used[i],admin:admins.find(a=>a.school_id===s.id)?.email})),
              passes:passes.map(p=>({...p,has_account:emails.includes(p.email.toLowerCase())})),students:count||0};
    },
    async createSchool({name,seats,expires_at,admin_name,admin_email}){
      if(!name.trim()) throw new Error('Enter the school name.');
      if(!(+seats>=1)) throw new Error('Enter the number of seats.');
      const s=must(await sb.from('schools').insert({name:name.trim(),seats:+seats,expires_at:new Date(expires_at+'T23:59:00').toISOString()}).select().single());
      try{checkInvite(await callFn('invite',{kind:'schooladmin',school_id:s.id,name:admin_name,email:admin_email,redirect}))}
      catch(e){await sb.from('schools').delete().eq('id',s.id);throw e}  // don't leave a school without an admin
      return s;
    },
    async updateSeats(schoolId,seats){
      const used=must(await sb.rpc('seats_used',{p_school:schoolId}));
      if(!(+seats>=used)) throw new Error(`Seats can't go below the ${used} already in use.`);
      must(await sb.from('schools').update({seats:+seats}).eq('id',schoolId));
    },
    async recordSale(email,order_ref){
      email=String(email).trim().toLowerCase();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Enter the buyer\'s email.');
      return must(await sb.from('entitlements').insert({email,kind:'exam_pass',expires_at:passExpiry(),source:'manual',order_ref:order_ref||'MANUAL-'+Date.now()}).select().single());
    },
  };
}

/* ---------- runner ---------- */
function startCheck(topic){
  if(!allowedTopics().includes(topic)){go('account');return}
  S.topic=topic; S.run={mode:'check',list:buildTopicCheck(topic),i:0,results:[],offset:0,ref:`check:${topic}:${new Date().toISOString()}`};
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected','false'));
  runQuestion();
}
function startPaper(paper){
  if(S.access.level!=='full'){go('account');setTimeout(()=>{const el=$('#plans');if(el)el.scrollIntoView({behavior:'smooth'})},50);return}
  paper=String(paper)==='2'?'2':'1';
  const list=buildPaperSet(paper,allowedTopics(),workingGrade()||5);

}
function startRun(mode){

  const list=mode==='diag'?buildDiagnostic():buildDaily(S.attempts,{allowed:allowedTopics().filter(id=>CALC_MODE!=='non'||!calcOnly(id)),grade:workingGrade()||4,n:dailyDoneToday(S.attempts)>=DAILY_N?DAILY_N:DAILY_N-dailyDoneToday(S.attempts)});
  S.run={mode,list,i:0,results:[],offset:mode==='daily'&&dailyDoneToday(S.attempts)<DAILY_N?dailyDoneToday(S.attempts):0};
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected','false'));
  runQuestion();
}
function runQuestion(){
  const R_=S.run, item=R_.list[R_.i], t=TOP[item.topic], Q=item.Q||(R_.mode==='daily'?genQ(item.topic,CALC_MODE):null)||genQ(item.topic), paper=R_.mode==='paper', diag=R_.mode==='diag'||paper;
  const title={diag:'Baseline diagnostic',daily:'Daily Case'+(CALC_MODE==='non'?' · non-calculator':''),check:'Topic check · '+t.name,paper:paper?`${PAPER_INFO[R_.paper].title} · ${PAPER_INFO[R_.paper].sub}`:''}[R_.mode];
  if(!Q.calcTag) Q.calcTag=calcTag(item.topic,Q);
  R_.Q=Q; R_.answered=false; S.topic=item.topic; R_.tsec=suggestedSeconds(Q.marks,t.grade,Q.kind);
  const n=R_.list.length+R_.offset, k=R_.i+1+R_.offset;
  view.className='page narrow'; view.onclick=null;
  view.innerHTML=`
  <div class="runhead"><div><span class="eyebrow">${title}</span><h1 class="ph">Question ${k} of ${n}</h1></div><button class="link" id="runExit">${paper?'Leave the paper':diag?'Leave diagnostic':R_.mode==='check'?'Leave topic check':'Save and exit'}</button></div>
  <div class="track big"><i style="width:${(k-1)/n*100}%"></i></div>
  <section class="case">
    ${caseBar(t,Q.marks,{why:item.why,timer:R_.tsec,noRow:diag,calc:Q.calcTag})}
    <div class="casebody">
      <h2>${t.name}</h2>
      <div class="prompt">${Q.prompt}</div>
      ${Q.diagram||''}
      <form class="ans" id="ansForm" autocomplete="off">${fieldsHTML(Q)}<button class="btn" id="go" type="submit">${diag?'Next':'Submit'}</button></form>${(S.liveQ={topic:item.topic,Q,where:R_.mode},'')}
      ${Q.hint?`<p class="hint">${Q.hint}</p>`:''}
      ${R_.mode==='daily'?showMeBarHTML():''}
      <div id="out" class="out"></div>
      ${diag?`<div class="row"><button class="ghost" id="skipQ" type="button">${paper?'Skip this one':'I don\'t know: skip'}</button></div>`:''}

    </div>
  </section>`;
  $('#runExit').onclick=()=>{
    const b=$('#runExit');

    const back=R_.mode==='check'?'practise':'today'; S.run=null; go(back);
  };
  $('#ansForm').onsubmit=e=>{e.preventDefault();R_.answered?nextQuestion():answerRun()};
  if($('#skipQ')) $('#skipQ').onclick=()=>recordRun({k:'no'},true);
  if(R_.mode==='daily') bindShowMe(item.topic,()=>R_.Q,()=>R_.answered);
  window.scrollTo({top:0}); startTimer(R_.tsec);

}
function answerRun(){
  const inputs=[...document.querySelectorAll('#ansForm .inp')], raws=inputs.map(i=>i.value.trim());
  if(inputs.some(i=>!i.value.trim())){$('#out').innerHTML=`<p class="hint">Answer every part first${S.run.mode==='diag'||S.run.mode==='paper'?', or skip it':''}.</p>`;return}

}
function recordRun(res,skipped){
  stopTimer();
  const R_=S.run, Q=R_.Q, topic=R_.list[R_.i].topic, correct=res.k==='ok', source=R_.mode==='diag'?'diagnostic':R_.mode==='daily'?'daily':'practice';
  const helped=R_.mode==='daily'&&!!Q.helped;
  const extra=R_.mode==='check'||R_.mode==='paper'?{ref:R_.ref}:helped?{ref:'help'}:{};

  S.attempts.push(att); R_.results.push({...att,skipped,Q,res,raws:[...document.querySelectorAll('#ansForm .inp')].map(i=>i.value.trim())});
  api.recordAttempt(S.user.id,topic,correct,att.error_id,source,extra).catch(e=>alertBox('Marked but not saved: '+e.message));

  const steps=Q.steps.map(([m,s])=>`<li><span class="mk ${/^[AB]/.test(m)?'a':m==='alt'?'e':''}">${m==='alt'?'ALT':m}</span><span>${s}</span></li>`).join('');

  const v=res.k==='ok'?(helped?helpedVerdict:`<div class="verdict ok"><strong>Correct. Full marks.</strong></div>`)
    :res.k==='trap'?`<div class="verdict trap"><strong>Evidence found: ${ERR[res.id][0]}</strong><p>${res.note||ERR[res.id][1]}</p></div>`
    :`<div class="verdict no"><strong>Not this time</strong><p>The answer is ${Q.ans}.</p></div>`;
  S.lastQctx=questionContext(topic,Q,R_.results[R_.results.length-1].raws,res,R_.mode);
  $('#out').innerHTML=`${v}${timeVerdictHTML()}<div class="sol"><span class="eyebrow">Worked solution · answer ${Q.ans}</span><ol>${steps}</ol></div>${reportQButton()}`;
  document.querySelectorAll('#ansForm .inp').forEach(i=>{i.readOnly=true;if(i.tagName==='SELECT')i.disabled=true});
  $('#go').textContent=R_.i+1<R_.list.length?'Next question →':R_.mode==='check'?'See the verdict →':'See today\'s report →'; $('#go').focus({preventScroll:true});
}
function nextQuestion(){
  const R_=S.run; R_.i++;
  if(R_.i<R_.list.length) return runQuestion();
  R_.mode==='diag'?finishDiagnostic():R_.mode==='check'?finishCheck():R_.mode==='paper'?finishPaper():finishDaily();
}

/* ---------- reports ---------- */

}

function handInExam(){

function renderExamReport(answers,marks){

function finishCheck(){
  const res=S.run.results, topic=S.run.list[0].topic, t=TOP[topic], score=res.filter(r=>r.correct).length, pass=score>=CHECK_PASS, {errs}=reportCommon(res);
  S.run=null; view.className='page narrow';
  view.innerHTML=`
  <div><span class="eyebrow">Topic check · ${t.name}</span><h1 class="ph">${pass?'Case closed':'Case still open'}</h1></div>

/* ---------- welcome back: last session + next move ---------- */
function whenLabel(iso){
  const d=daysAgo(iso), t=new Date(iso), time=t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(d<=0) return `Earlier today, ${time}`;
  if(d===1) return `Yesterday, ${time}`;
  return `${t.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})} · ${d} days ago`;
}
function dueLabel(iso){
  const d=-daysAgo(iso);
  if(d<0) return {t:`Overdue by ${-d} day${d<-1?'s':''}`,c:'late'};
  if(d===0) return {t:'Due today',c:'soon'};
  if(d===1) return {t:'Due tomorrow',c:'soon'};
  return {t:`Due ${new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})} · in ${d} days`,c:''};
}
