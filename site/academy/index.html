<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Forensics Academy</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="KS3 maths for Years 7 to 9: step-by-step lessons, practice and checks on the way to Bronze, Silver, Gold and Platinum awards.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2046%22%3E%3Cpath%20d%3D%22M20%202%2037%208v14c0%2011-7.5%2018.5-17%2022C10.5%2040.5%203%2033%203%2022V8z%22%20fill%3D%22%230B122C%22%20stroke%3D%22%2300FCF1%22%20stroke-width%3D%223.2%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2219%22%20cy%3D%2221%22%20r%3D%226.6%22%20fill%3D%22none%22%20stroke%3D%22%2300FCF1%22%20stroke-width%3D%223.8%22%2F%3E%3Cpath%20d%3D%22M23.8%2025.8%2028.6%2030.6%22%20stroke%3D%22%231B36FF%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Josefin+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Same tokens as Maths Forensics Lab, so the Academy feels like part of it */
:root{
  --ink:#0B122C;--panel:#111a3d;--panel2:#16214b;--line:#26336a;--text:#E8ECF8;--muted:#93a0c8;
  --cyan:#00FCF1;--blue:#1B36FF;--good:#3DDC97;--warn:#FFC857;--bad:#FF6B7A;
  --bronze:#D8955B;--silver:#C9D2E3;--gold:#F2C94C;--platinum:#9FE7F5;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Josefin Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(11,18,44,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);margin-right:auto}
.brand svg{width:30px;height:35px;flex:none}
.wm{font-weight:800;letter-spacing:.08em;font-size:14px;line-height:1.1}
.wm small{display:block;font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.18em;color:var(--cyan);margin-top:3px}
.cadet{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;line-height:1.3}
.cadet b{color:var(--text);display:block;font-size:13.5px}

main{padding-block:24px 60px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,4.4vw,38px);line-height:1.1;margin-top:6px}
.lede{color:var(--muted);max-width:60ch;margin:10px 0 0}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--cyan);color:var(--ink);border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:17px;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.small{padding:8px 14px;min-height:38px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;font-size:16px}

/* pathway */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.tiercard{position:relative;overflow:hidden}
.tiercard .medal{width:84px;height:84px;flex:none}
.tierhead{display:flex;gap:16px;align-items:center}
.tierhead h2{font-family:var(--f-display);font-weight:800;font-size:24px}
.bar{height:12px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),#f2b37c);border-radius:99px;transition:width .4s}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tier{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--panel)}
.tier svg{width:40px;height:40px}
.tier b{font-family:var(--f-display);font-size:14px;letter-spacing:.02em}
.tier span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tier.now{border-color:var(--bronze);box-shadow:inset 0 0 0 1px var(--bronze)}
.tier.locked{opacity:.55}

.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
@media (max-width:700px){.topics{grid-template-columns:minmax(0,1fr)}}
.tcard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard:hover{border-color:var(--cyan)}
.tcard .strand{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcard h3{font-size:20px;font-weight:700}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.learning{border-color:rgba(0,252,241,.4);color:var(--cyan)}
.chip.practising{border-color:rgba(255,200,87,.5);color:var(--warn)}
.chip.secured{border-color:var(--good);background:rgba(61,220,151,.12);color:var(--good)}
.steps3{display:flex;gap:6px}
.steps3 i{width:28px;height:6px;border-radius:99px;background:var(--panel2)}
.steps3 i.on{background:var(--cyan)}
.steps3 i.ok{background:var(--good)}
.lockrow{display:flex;gap:14px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:16px 18px;background:repeating-linear-gradient(135deg,var(--panel) 0 12px,#0f1736 12px 24px)}
.lockrow svg{width:28px;height:28px;flex:none;color:var(--muted)}

/* topic */
.crumbs{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--muted);flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;white-space:nowrap}
.tab .n{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line)}
.tab.on{color:var(--text);border-bottom-color:var(--cyan)}
.tab.on .n{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.tab.done .n{background:var(--good);color:var(--ink);border-color:var(--good)}
.tabbody{margin-top:22px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid2>*{min-width:0}
.idea{font-size:21px;line-height:1.45;border-left:4px solid var(--cyan);padding:4px 0 4px 16px;margin:0}
.howto{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.howto li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.howto li::before{content:counter(s);font-family:var(--f-mono);font-weight:700;width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--cyan);font-size:14px}
.h3{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.work{font-family:var(--f-mono);font-size:17px;line-height:1.6;background:#0a1030;border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
.wline{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:14px;padding:6px 0;border-bottom:1px dashed rgba(38,51,106,.7);animation:in .35s both}
.wline:last-child{border-bottom:0}
.wline .w{white-space:pre;color:var(--text)}
.wline .why{font-family:var(--f-body);font-size:15.5px;color:var(--muted);align-self:center}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.mist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.mist li{border-left:3px solid var(--bad);background:rgba(255,107,122,.07);padding:10px 12px;border-radius:0 10px 10px 0;font-size:16px}
.mist b{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--bad);margin-bottom:2px}

/* questions */
.q{font-size:21px;line-height:1.45}
.q .big{font-family:var(--f-mono);font-size:24px;white-space:nowrap}
.diagram{margin-top:12px;background:#0a1030;border:1px solid var(--line);border-radius:10px;padding:10px;max-width:420px}
.diagram svg{display:block;width:100%;height:auto}
.ans{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.field{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-width:0}
.field:focus-within{border-color:var(--cyan)}
.field input{background:transparent;border:0;color:var(--text);font-family:var(--f-mono);font-size:21px;padding:10px 14px;width:11em;max-width:58vw;outline:none}
.field span{font-family:var(--f-mono);color:var(--muted);padding-right:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.choice{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:600;text-align:left;font-size:17px}
.choice:hover{border-color:var(--cyan)}
.choice.picked{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.fb{margin-top:14px;padding:12px 14px;border-radius:0 10px 10px 0;font-size:17px}
.fb b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.fb.ok{border-left:4px solid var(--good);background:rgba(61,220,151,.08)}.fb.ok b{color:var(--good)}
.fb.no{border-left:4px solid var(--bad);background:rgba(255,107,122,.08)}.fb.no b{color:var(--bad)}
.fb.hint{border-left:4px solid var(--warn);background:rgba(255,200,87,.07)}.fb.hint b{color:var(--warn)}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.tally i{width:16px;height:16px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.tally i.ok{background:var(--good);border-color:var(--good)}
.tally i.no{background:var(--bad);border-color:var(--bad)}
.result{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1}
.review{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.review li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px}
.review .tag{font-family:var(--f-mono);font-size:12px;font-weight:700}
.tag.ok{color:var(--good)}.tag.no{color:var(--bad)}
.tryline{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.tryline:last-child{border-bottom:0}
.speak{display:inline-flex;align-items:center;gap:6px}
.speak svg{width:18px;height:18px}
.namebox{max-width:520px;margin:40px auto}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#path">
      <svg viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2 37 8v14c0 11-7.5 18.5-17 22C10.5 40.5 3 33 3 22V8z" fill="#111a3d" stroke="#00FCF1" stroke-width="2.2" stroke-linejoin="round"/><circle cx="19" cy="21" r="6.2" fill="#111a3d" stroke="#00FCF1" stroke-width="2.6"/><circle cx="19" cy="21" r="1.6" fill="#00FCF1"/><path d="M23.4 25.4 28.8 30.8" stroke="#1B36FF" stroke-width="3.8" stroke-linecap="round"/></svg>
      <span class="wm">MATHS FORENSICS<small>ACADEMY · KS3</small></span>
    </a>
    <div class="cadet" id="cadet"></div>
  </div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer><div class="wrap"><span>Maths Forensics Academy · Years 7 to 9 · Preview</span><span>Progress is saved on this device only. <a href="../privacy.html">Privacy</a></span></div></footer>

<script>
"use strict";
/* ============================================================
   Maths Forensics Academy (KS3) · first slice
   Six Bronze topics: Learn → Practise → Check (4 of 5 secures)
   Progress is stored in this browser only (no account yet).
   ============================================================ */

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const MINUS = "−";
const sgn = n => (n < 0 ? MINUS + Math.abs(n) : String(n));          // −5 for display
const par = n => (n < 0 ? "(" + sgn(n) + ")" : String(n));           // (−5) in sums
const fmt = n => {                                                   // 12,345.6 with a proper minus
  const neg = n < 0; n = Math.abs(n);
  let [i, d] = String(+n.toFixed(6)).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? MINUS : "") + i + (d ? "." + d : "");
};
const plain = n => String(+n.toFixed(6));                             // no commas, for typed comparison
function parseNum(s) {
  if (s == null) return null;
  s = String(s).trim().replace(/[−–—]/g, "-").replace(/,/g, "").replace(/\s+/g, "").replace(/(cm|m|°c|°|c)$/i, "");
  if (!/^-?\d*\.?\d+$/.test(s)) return null;
  return parseFloat(s);
}
const near = (a, b) => a != null && Math.abs(a - b) < 1e-9 * Math.max(1, Math.abs(b));

/* ---------- storage (this device only) ---------- */
const KEY = "mfa.v1";
let STORE = { name: "", topics: {} };
try { const raw = localStorage.getItem(KEY); if (raw) STORE = Object.assign(STORE, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(STORE)); } catch (e) {} }
function prog(id) {
  if (!STORE.topics[id]) STORE.topics[id] = { learned: false, practised: 0, streak: 0, secured: false, best: 0, checks: 0 };
  return STORE.topics[id];
}

/* ---------- algebra helpers for "Simplifying" ---------- */
function parseExpr(s) {
  // returns {map:{a:3,b:-2,"":5}} or null. Accepts 3a+2b-4, 3a + b, a-2b, 5.
  s = String(s).toLowerCase().replace(/[−–—]/g, "-").replace(/\s+/g, "").replace(/\*/g, "");
  if (!s || /[+-]$/.test(s) || /[+-]{2}/.test(s)) return null;
  if (!/^[+-]?(\d*[a-z]?|\d+)([+-](\d*[a-z]?|\d+))*$/.test(s)) return null;
  const terms = s.match(/[+-]?[^+-]+/g);
  if (!terms) return null;
  const map = {};
  for (const t of terms) {
    const m = t.match(/^([+-]?)(\d*)([a-z]?)$/);
    if (!m || (m[2] === "" && m[3] === "")) return null;
    const c = (m[1] === "-" ? -1 : 1) * (m[2] === "" ? 1 : parseInt(m[2], 10));
    map[m[3]] = (map[m[3]] || 0) + c;
  }
  for (const k in map) if (map[k] === 0) delete map[k];
  return map;
}
const sameMap = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); };
function showExpr(map) {
  const keys = Object.keys(map).filter(k => k).sort();
  if (map[""]) keys.push("");
  let out = "";
  keys.forEach((k, i) => {
    const c = map[k]; if (!c) return;
    const abs = Math.abs(c);
    const body = k ? (abs === 1 ? k : abs + k) : String(abs);
    out += (c < 0 ? (out ? " " + MINUS + " " : MINUS) : (out ? " + " : "")) + body;
  });
  return out || "0";
}
const termStr = (c, k, first) => {
  const abs = Math.abs(c), body = k ? (abs === 1 ? k : abs + k) : String(abs);
  if (first) return (c < 0 ? MINUS : "") + body;
  return (c < 0 ? " " + MINUS + " " : " + ") + body;
};

/* ============================================================
   TOPICS
   Each generator returns a question:
   { prompt, type:"num"|"mc"|"expr", answer, choices?, unit?, diagram?,
     hints:[nudge, next line], solution:[[working, why]...], mistakes:[[test(value), message]] }
   ============================================================ */

/* ---------- 1. Place value ---------- */
const PLACES = [[1e6,"millions"],[1e5,"hundred thousands"],[1e4,"ten thousands"],[1000,"thousands"],[100,"hundreds"],[10,"tens"],[1,"ones"],[0.1,"tenths"],[0.01,"hundredths"]];
const placeName = v => PLACES.find(p => near(p[0], v))[1];
function pvDigitValue(level) {
  const decimals = level >= 2 && Math.random() < .5;
  const intDigits = level === 1 ? R(4, 5) : R(4, 7);
  let digits = [R(1, 9)]; for (let i = 1; i < intDigits; i++) digits.push(R(0, 9));
  let dec = decimals ? [R(1, 9), R(1, 9)] : [];
  // choose a target position whose digit is not 0 and is unique in the number
  const all = digits.concat(dec);
  const positions = all.map((d, i) => ({ d, i, val: i < digits.length ? Math.pow(10, digits.length - 1 - i) : Math.pow(10, -(i - digits.length + 1)) }))
    .filter(p => p.d !== 0 && all.filter(x => x === p.d).length === 1 && p.val !== 1);
  if (!positions.length) return pvDigitValue(level);
  const t = pick(positions);
  const n = Number(digits.join("") + (dec.length ? "." + dec.join("") : ""));
  const value = +(t.d * t.val).toFixed(2);
  const shown = fmt(n);
  return {
    prompt: `What is the value of the <b>${t.d}</b> in <span class="big">${shown}</span>?`,
    type: "num", answer: value,
    hints: [`Find which column the ${t.d} is in. Count the places from the decimal point (or from the right-hand end).`,
            `The ${t.d} is in the ${placeName(t.val)} column. Its value is ${t.d} × ${fmt(t.val)}.`],
    solution: [[shown, "Write the number out"], [`${t.d} is in the ${placeName(t.val)} column`, "Find the column"], [`${t.d} × ${fmt(t.val)} = ${fmt(value)}`, "Value = digit × column value"]],
    mistakes: [[v => near(v, t.d), `That's the digit itself. The question asks for its value, which depends on its column.`],
               [v => near(v, value * 10) || near(v, value / 10), `Nearly: you're one column out. Count the columns again carefully.`]]
  };
}
function pvTimesDivide(level) {
  const p = pick(level === 1 ? [10, 100] : [10, 100, 1000]);
  const div = Math.random() < (level === 1 ? .35 : .5);
  let n;
  if (level === 1) n = R(3, 99) + (Math.random() < .5 ? R(1, 9) / 10 : 0);

const TOPIC = id => TOPICS.find(t => t.id === id);

/* ---------- answer checking ---------- */
function mark(q, raw) {
  if (q.type === "mc") {
    const v = raw;
    if (v === q.answer) return { ok: true };
    const m = q.mistakes.find(([f]) => f(v)); return { ok: false, msg: m ? m[1] : "Not quite." };
  }
  if (q.type === "expr") {
    const m = parseExpr(raw);
    if (!m) return { ok: false, invalid: true, msg: "Type your answer like 3a + 4b or 5x − 2." };
    if (sameMap(m, q.answer)) return { ok: true };
    const k = q.mistakes.find(([f]) => f(raw, m)); return { ok: false, msg: k ? k[1] : "Not quite." };
  }
  const v = parseNum(raw);
  if (v == null) return { ok: false, invalid: true, msg: "Type a number, for example 42 or −7 or 3.5." };
  if (near(v, q.answer)) return { ok: true };
  const m = q.mistakes.find(([f]) => f(v)); return { ok: false, msg: m ? m[1] : "Not quite." };
}
const answerText = q => q.type === "mc" ? q.choices[q.answer] : q.type === "expr" ? q.answerText : fmt(q.answer) + (q.unit ? " " + q.unit : "");

/* ---------- read aloud ---------- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/−/g, " minus ").replace(/×/g, " times ").replace(/÷/g, " divided by "));
    u.lang = "en-GB"; u.rate = .95; speechSynthesis.speak(u);
  } catch (e) {}
}

        ${VIEW.answered ? `<div class="work">${q.solution.map(([w, why]) => `<div class="wline"><span class="w">${esc(w)}</span><span class="why">${esc(why)}</span></div>`).join("")}</div>
            <div class="row"><button class="btn" id="nextq">Next question</button>${p.streak >= 5 && !p.secured ? `<a class="btn ghost" href="#t-${t.id}-check">Ready for the check</a>` : ""}</div>`
          : `<div class="row">${VIEW.hints < 2 ? `<button class="linkbtn" id="hint">${VIEW.hints ? "Show the next step" : "Give me a hint"}</button>` : ""}${VIEW.wrongs >= 2 || VIEW.hints >= 2 ? `<button class="linkbtn" id="reveal">Show me the answer</button>` : ""}</div>`}
      </section>
      <aside class="stack">
        <section class="panel stack"><div class="h3" style="margin:0">How to do it</div><ol class="howto">${t.learn.steps.map(s => `<li><span class="small">${esc(s)}</span></li>`).join("")}</ol></section>
        <section class="panel stack"><div class="h3" style="margin:0">When you're ready</div><p class="small muted" style="margin:0">Get 5 in a row, then take the check: 5 questions, no hints, 4 right to secure the topic.</p><div class="row"><a class="btn ${p.streak >= 5 ? "" : "ghost"} small" href="#t-${t.id}-check">Take the check</a></div></section>
      </aside></div>`;
    if (!VIEW.answered) {
      const submit = raw => {
        const r = mark(q, raw);
        if (r.invalid) { VIEW.fb = { ok: false, msg: esc(r.msg) }; draw(); focusIn(); return; }
        if (r.ok) {
          p.practised++; p.streak++; VIEW.run++; VIEW.answered = true; save(); renderCadet();
          VIEW.fb = { ok: true, msg: VIEW.hints ? "Well worked out with the hint. Try the next one without." : pick(["Spot on.", "Exactly right.", "Correct, and well set out.", "Good detective work."]) };
        } else {
          VIEW.wrongs++; p.streak = 0; save();
          VIEW.fb = { ok: false, msg: esc(r.msg) + (VIEW.wrongs === 1 && VIEW.hints === 0 ? " Have another go, or ask for a hint." : "") };
        }
        draw(); focusIn();
      };
      if (q.type === "mc") app.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => submit(+b.dataset.mc));
      else app.querySelector("[data-form]").onsubmit = e => { e.preventDefault(); submit($("#pin").value); };
      const h = $("#hint"); if (h) h.onclick = () => { VIEW.hints++; draw(); focusIn(); };
      const rv = $("#reveal"); if (rv) rv.onclick = () => { p.practised++; p.streak = 0; VIEW.answered = true; VIEW.fb = { ok: false, msg: `The answer is <b>${esc(answerText(q))}</b>. Read the working below, then try another.` }; save(); draw(); };
    } else {
      $("#nextq").onclick = newQ; $("#nextq").focus();
    }
  };
  const focusIn = () => { const i = $("#pin"); if (i) i.focus(); };
  newQ(); focusIn();
}

/* ---------- Check ---------- */
const CHECK_N = 5, CHECK_PASS = 4;
function tabCheck(t) {
  const p = prog(t.id);
  VIEW = { qs: [1, 1, 2, 2, 3].map(l => genQ(t, l)), i: 0, results: [], started: false };
  const body = $("#tabbody");
  const intro = () => {
    body.innerHTML = `<section class="panel stack" style="max-width:640px">
      <div class="eyebrow">Topic check</div>
      <h2 style="font-size:24px">${CHECK_N} questions · no hints · ${CHECK_PASS} right to secure</h2>
      <p class="muted" style="margin:0">${p.secured ? "You've already secured this topic. Take it again to keep it sharp." : p.streak >= 5 ? "You're on a run of 5 or more. Good time to take it." : "Tip: practise until you get 5 in a row first. You can take the check any time."}</p>
      <div class="row"><button class="btn" id="go">Start the check</button><a class="btn ghost" href="#t-${t.id}-practise">More practice first</a></div></section>`;
    $("#go").onclick = () => { VIEW.started = true; draw(); };
  };
  const draw = () => {
    const q = VIEW.qs[VIEW.i];
    body.innerHTML = `<section class="panel stack" style="max-width:760px" aria-live="polite">
      <div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${VIEW.i + 1} of ${CHECK_N}</span>
        <span class="tally">${VIEW.qs.map((_, k) => `<i class="${k < VIEW.results.length ? (VIEW.results[k].ok ? "ok" : "no") : ""}"></i>`).join("")}</span></div>
      <div class="q">${q.prompt}</div>${q.diagram ? `<div class="diagram">${q.diagram}</div>` : ""}
      ${inputHTML("cin", q)}
      ${VIEW.invalid ? `<div class="fb hint"><b>Check the format</b>${esc(VIEW.invalid)}</div>` : ""}
    </section>`;
    const submit = raw => {
      const r = mark(q, raw);
      if (r.invalid) { VIEW.invalid = r.msg; draw(); const i = $("#cin"); if (i) i.focus(); return; }
      VIEW.invalid = null;
      VIEW.results.push({ ok: r.ok, given: q.type === "mc" ? q.choices[raw] : raw, msg: r.msg });
      VIEW.i++;
      if (VIEW.i >= CHECK_N) finish(); else { draw(); const i = $("#cin"); if (i) i.focus(); }
    };
    if (q.type === "mc") body.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => submit(+b.dataset.mc));
    else { body.querySelector("[data-form]").onsubmit = e => { e.preventDefault(); submit($("#cin").value); }; $("#cin").focus(); }
  };
  const finish = () => {
    const score = VIEW.results.filter(r => r.ok).length;
    const pass = score >= CHECK_PASS;
    p.checks++; p.best = Math.max(p.best, score);
    const firstSecure = pass && !p.secured;
    if (pass) p.secured = true;
    save(); renderCadet();
    const left = TOPICS.filter(x => !prog(x.id).secured);
    body.innerHTML = `<section class="panel stack" style="max-width:820px">
      <div class="result"><div class="score" style="color:${pass ? "var(--good)" : "var(--warn)"}">${score}/${CHECK_N}</div>
        <div><div class="eyebrow">${pass ? "Topic secured" : "Not secured yet"}</div><h2 style="font-size:22px;margin-top:4px">${pass ? (firstSecure ? `${esc(t.name)} is secured.` : "Secured again. Well kept.") : `You need ${CHECK_PASS} of ${CHECK_N}. Practise the ones below, then try again.`}</h2>
        ${pass && firstSecure ? `<p class="muted small" style="margin:4px 0 0">${left.length ? `${TOPICS.length - left.length} of ${TOPICS.length} Bronze topics secured.` : "Every Bronze topic is secured. The Bronze award test is next."}</p>` : ""}</div></div>
      <ul class="review">${VIEW.qs.map((q, k) => { const r = VIEW.results[k]; return `<li><span class="tag ${r.ok ? "ok" : "no"}">${r.ok ? "✓ Correct" : "✗ Not this time"}</span><div style="margin-top:4px">${q.prompt}</div>
        ${r.ok ? "" : `<div class="small" style="margin-top:6px">You answered <b>${esc(r.given)}</b>. The answer is <b>${esc(answerText(q))}</b>. ${esc(r.msg && r.msg !== "Not quite." ? r.msg : "")}</div>`}</li>`; }).join("")}</ul>
      <div class="row">${pass ? (left.length ? `<a class="btn" href="#t-${left[0].id}-learn">Next topic: ${esc(left[0].name)}</a>` : "") + `<a class="btn ghost" href="#path">Back to the pathway</a>`
        : `<a class="btn" href="#t-${t.id}-practise">Practise more</a><button class="btn ghost" id="again">Try the check again</button>`}</div></section>`;
    const a = $("#again"); if (a) a.onclick = () => tabCheck(t);
  };
  intro();
}

/* ---------- router ---------- */
function route() {
  try { speechSynthesis.cancel(); } catch (e) {}
  renderCadet();
  if (!STORE.name) { screenName(); return; }
  // routes: #path, #t-<topic-id>-<learn|practise|check>
  const m = location.hash.match(/^#t-([a-z0-9-]+)-(learn|practise|check)$/);
  if (m && TOPIC(m[1])) screenTopic(m[1], m[2]);
  else screenPath();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
