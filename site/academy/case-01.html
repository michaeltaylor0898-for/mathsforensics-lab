<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Case 01: The Scoby Stop · Maths Forensics Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Josefin+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an incident-room console. Dark navy UI frame, intelligence map on the left, evidence paper and tasks on the right; stacks to one column on phones. Deliberately single dark theme. */
:root{
  --bg:#070C1F; --panel:#0B122C; --panel-2:#111A3D; --line:#26326A; --fg:#E8ECF8; --muted:#8E99C4;
  --cyan:#00FCF1; --blue:#1B36FF; --amber:#FFB547; --red:#FF5D73; --green:#3DE39B;
  --paper:#F4ECD8; --paper-2:#E9DDBF; --ink:#2A2418; --ink-2:#6B5D43; --stamp:#B3261E;
  --ground:#0E1634; --street:#1E2A57; --street-edge:#2D3B74; --street-ink:#7D89B8; --park:#0F3A3A; --park-edge:#1C5A55;
  --display:"Syncopate","Arial Black",system-ui,sans-serif;
  --body:"Josefin Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(27,54,255,.18),transparent 55%),radial-gradient(ellipse at 110% 10%,rgba(0,252,241,.07),transparent 45%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,18,44,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--display);font-size:13px;letter-spacing:.14em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.steps li.done{color:var(--cyan);border-color:rgba(0,252,241,.35)}
.steps li.now{background:var(--cyan);color:var(--panel);border-color:var(--cyan);font-weight:600}
.pts{font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2)}
.pts b{font-size:16px;color:var(--cyan);font-variant-numeric:tabular-nums}

main{padding-block:24px 40px}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.h-scene{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.lede{color:var(--muted);max-width:62ch;margin:8px 0 0}
.scene-head{margin-bottom:20px}

.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.grid > *{min-width:0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.panel-title{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--cyan);color:var(--panel);border:0;border-radius:4px;padding:11px 18px;font-weight:700;font-size:15px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--cyan)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:0}
.link:hover{color:var(--cyan)}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:12px}
@media (max-width:880px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.4vw,56px);line-height:1.02;letter-spacing:.02em;text-transform:uppercase}
.cover h1 em{font-style:normal;color:var(--cyan)}
.cover p{color:var(--muted);max-width:52ch;font-size:17px}
.folder{position:relative;background:linear-gradient(180deg,#B38C5E,#A07A4E);border-radius:4px 14px 4px 4px;padding:22px;box-shadow:0 30px 60px -30px rgba(0,0,0,.8);transform:rotate(-1.5deg)}
.folder::before{content:"";position:absolute;top:-14px;left:18px;width:120px;height:18px;background:#B38C5E;border-radius:6px 6px 0 0}
.folder .sheet{background:var(--paper);color:var(--ink);border-radius:2px;padding:20px;font-family:var(--mono);font-size:12.5px;line-height:1.6;transform:rotate(2deg)}
.sheet h3{font-family:var(--display);font-size:15px;letter-spacing:.1em;margin-bottom:8px}
.stamp{display:inline-block;border:2px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.18em;padding:3px 8px;transform:rotate(-6deg);margin:8px 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0}
.sheet dt{color:var(--ink-2)}
.sheet dd{margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px}
.tag{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}

/* transmission (AI video slot) */
.tx{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tx-screen{position:relative;aspect-ratio:16/7;max-width:100%;background:radial-gradient(circle at 30% 40%,#18245a,#070c1f 70%);display:flex;align-items:flex-end;gap:16px;padding:16px;overflow:hidden}
.tx-screen::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.tx-chip{position:absolute;top:12px;left:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px dashed rgba(0,252,241,.6);color:var(--cyan);border-radius:3px;background:rgba(7,12,31,.6)}
.tx-rec{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:11px;color:var(--red);display:flex;align-items:center;gap:6px}
.tx-rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.2}}
.tx-face{width:min(26%,140px);height:auto;flex:none;align-self:flex-end;margin-bottom:-16px}
.tx-id{display:flex;flex-direction:column;padding-bottom:4px;min-width:0}
.tx-id b{font-family:var(--display);font-size:clamp(12px,1.8vw,16px);letter-spacing:.08em;text-transform:uppercase}
.tx-id span{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tx-wave{position:absolute;right:16px;bottom:16px;display:flex;gap:3px;align-items:flex-end;height:28px}
.tx-wave i{width:3px;background:var(--cyan);opacity:.7;border-radius:2px;height:20%}
.tx.live .tx-wave i{animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{height:100%}}
.tx-subs{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tx-subs p{margin:0;max-width:68ch;font-size:16.5px}
.tx.live .tx-subs p{animation:sub .5s both}
@keyframes sub{from{opacity:0;transform:translateY(6px)}}

.tx-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.tx-head .tx-rec{position:static}
.tx-len{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tx-video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000}
details.tx-subs summary{cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.tx-subs p{margin:8px 0 0;color:var(--fg)}
.tx-skip{padding:0 18px 14px}
/* suspects */
.suspects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.suspects{grid-template-columns:minmax(0,1fr)}}
.suspect{background:var(--paper);color:var(--ink);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.suspect .s-head{display:flex;gap:12px;align-items:center}
.suspect svg{width:58px;height:58px;flex:none;border-radius:2px;background:var(--paper-2)}
.suspect h4{margin:0;font-family:var(--display);font-size:13px;letter-spacing:.08em}
.suspect .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.suspect ul{margin:0;padding-left:18px;font-size:14.5px}
.suspect .obs{font-size:14px;font-style:italic;border-left:3px solid var(--ink-2);padding:2px 0 2px 10px}
.suspect .obs b{display:block;font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.suspect .speed{font-family:var(--mono);font-size:12.5px;padding:6px 8px;background:var(--ink);color:var(--paper);border-radius:2px}
.s1 .speed b{color:var(--amber)} .s2 .speed b{color:var(--cyan)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dot.s1{background:var(--amber)} .dot.s2{background:var(--cyan)}

table.speeds{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.speeds th,.speeds td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.speeds th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.speeds td button{width:100%;background:none;border:1px solid transparent;border-radius:3px;padding:5px 2px;font-family:var(--mono);font-size:13px}
.speeds.pick td button{border-color:var(--line)}
.speeds.pick td button:hover{border-color:var(--cyan);color:var(--cyan)}
.speeds td button.sel-s1{background:var(--amber);color:var(--panel);font-weight:600}
.speeds td button.sel-s2{background:var(--cyan);color:var(--panel);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:8px}

/* questions */
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.q:first-child{border-top:0;padding-top:0}
.q-p{font-size:16px}
.q-p small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.q.done .q-p{color:var(--muted);font-size:14.5px}
.q-a{font-family:var(--mono);font-size:14px;color:var(--green)}
.q-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q-in{display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;min-width:0}
.q-in:focus-within{border-color:var(--cyan)}
.q-in input{background:transparent;border:0;color:var(--fg);font-family:var(--mono);font-size:17px;padding:10px 12px;width:9.5em;max-width:46vw;outline:none}
.q-in span{font-family:var(--mono);color:var(--muted);padding-right:12px;font-size:14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:15px;text-align:left}
.choice:hover{border-color:var(--cyan)}
.choice small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.fb{font-size:14.5px;padding:10px 12px;border-left:3px solid var(--red);background:rgba(255,93,115,.08);border-radius:0 4px 4px 0}
.fb b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);display:block;margin-bottom:2px}
.hint{font-size:14.5px;padding:10px 12px;border-left:3px solid var(--amber);background:rgba(255,181,71,.07);border-radius:0 4px 4px 0}
.demo-a{font-family:var(--mono);font-size:12px;color:var(--amber)}
.solved-note{font-size:14.5px;padding:10px 12px;border-left:3px solid var(--green);background:rgba(61,227,155,.07);border-radius:0 4px 4px 0}

/* witnesses */
.wtabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:520px){.wtabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wtab{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wtab b{font-family:var(--mono);font-size:14px}
.wtab span{font-size:10.5px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wtab.on{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.wtab.v-S1 span{color:var(--amber)} .wtab.v-S2 span{color:var(--cyan)} .wtab.v-X span{color:var(--red)}
.statement{background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 18px;position:relative;box-shadow:0 18px 30px -24px rgba(0,0,0,.9)}
.statement .st-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--paper-2);padding-bottom:8px;margin-bottom:10px}
.statement h4{margin:0 0 2px;font-family:var(--display);font-size:14px;letter-spacing:.06em}
.statement .where{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.statement p{margin:0;font-size:15.5px;line-height:1.55;max-width:62ch}
.statement .verdict-stamp{position:absolute;right:14px;top:40px;border:2px solid currentColor;padding:3px 8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;transform:rotate(-8deg);background:rgba(244,236,216,.85)}
.vs-S1{color:#B66F00} .vs-S2{color:#0A7C78} .vs-X{color:var(--stamp)}
.ref{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--mono);font-size:12px}
.ref span{padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:var(--panel-2)}

/* map */
.map{background:var(--ground);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map-cap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.m-street{stroke:var(--street);stroke-width:14;stroke-linecap:round;fill:none}
.m-edge{stroke:var(--street-edge);stroke-width:16;stroke-linecap:round;fill:none}
.m-sname{fill:var(--street-ink);font-family:var(--mono);font-size:8.5px;letter-spacing:.04em}
.m-park{fill:var(--park);stroke:var(--park-edge);stroke-width:1}
.m-pname{fill:#3FA79D;font-family:var(--mono);font-size:9px}
.m-bld{fill:var(--panel-2);stroke:var(--street-edge)}
.m-bname{fill:var(--muted);font-family:var(--mono);font-size:8.5px}
.m-path{stroke:var(--park-edge);stroke-width:3;stroke-dasharray:4 4;fill:none}
.m-route{stroke:#fff;stroke-width:4;stroke-dasharray:9 6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-trail-s1{stroke:var(--amber);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.m-trail-s2{stroke:var(--cyan);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.m-pursuit{stroke:var(--red);stroke-width:4;stroke-dasharray:8 6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-leg rect{fill:var(--paper);}
.m-leg text{fill:var(--ink);font-family:var(--mono);font-size:10px;font-weight:600}
.m-pin circle{stroke-width:2.5}
.m-pin text{font-family:var(--mono);font-size:9px;font-weight:600}
.m-pin.p-pending circle{fill:var(--panel);stroke:var(--muted)} .m-pin.p-pending text{fill:var(--fg)}
.m-pin.p-on circle{fill:#fff;stroke:#fff} .m-pin.p-on text{fill:var(--panel)}
.m-pin.p-S1 circle{fill:var(--amber);stroke:var(--amber)} .m-pin.p-S1 text{fill:var(--panel)}
.m-pin.p-S2 circle{fill:var(--cyan);stroke:var(--cyan)} .m-pin.p-S2 text{fill:var(--panel)}
.m-pin.p-X circle{fill:var(--panel);stroke:var(--red)} .m-pin.p-X text{fill:var(--red)}
.m-pin[data-wit]{cursor:pointer}
.m-stop rect{fill:var(--red)} .m-stop text{fill:var(--red);font-family:var(--mono);font-size:9px;font-weight:600}
.m-circle{fill:rgba(255,181,71,.10);stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.m-cand circle{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.m-cand text{fill:var(--fg);font-family:var(--mono);font-size:9px}
.m-scale line{stroke:var(--fg);stroke-width:2}
.m-scale text{fill:var(--muted);font-family:var(--mono);font-size:8.5px}
.m-rail{stroke:var(--muted);stroke-width:1.5;fill:none}

/* outcome / closed */
.next-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.report{display:flex;flex-direction:column;gap:10px}
.rep{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
@media (max-width:560px){.rep{grid-template-columns:minmax(0,1fr);gap:2px}}
.rep .rt{font-family:var(--mono);font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
.rep .rq{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.locked{background:repeating-linear-gradient(135deg,var(--panel) 0 12px,var(--panel-2) 12px 24px);border:1px dashed var(--line);border-radius:6px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.locked b{font-family:var(--display);font-size:15px;letter-spacing:.06em}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:14px}
.toggle{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.toggle input{accent-color:var(--amber)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html#path" style="text-decoration:none;color:inherit" title="Back to the Academy"><b>← MATHS FORENSICS ACADEMY</b><span>OPERATION CROSSROADS · CASE 01</span></a>
    <ol class="steps" id="steps"></ol>
    <div class="pts">Case points <b id="pts">100</b></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>
  <div class="wrap">
    <span>Case 01 of the Operation Crossroads campaign · transmissions are AI-generated</span>
    <label class="toggle" id="demo-wrap" hidden><input type="checkbox" id="demo"> Teacher view: show answers</label>
  </div>
</footer>

<script>
(function(){
/* ---------- constants ---------- */
const U = 40;          // svg units per map cm
const SCALE = 50;      // metres per map cm

function legs(route){
  const out=[];
  for(let i=1;i<route.length;i++){
    const [x1,y1]=route[i-1],[x2,y2]=route[i];
    out.push({x:(x1+x2)/2,y:(y1+y2)/2,len:Math.round(Math.hypot(x2-x1,y2-y1)/U*10)/10,vert:Math.abs(x2-x1)<Math.abs(y2-y1)});
  }
  return out;
}

function witQs(w){
  const qs = [];
  qs.push({id:w.code+'-d', type:'num', unit:'m', prompt:`How far is <b>${esc(w.where)}</b> from the vehicle stop, in real life?`, small:'Add the route legs on the map. Scale: 1 cm = 50 m.',
    answerText:`${w.legs.map(l=>l.len.toFixed(1)).join(' + ')} = ${w.cm.toFixed(1)} cm × 50 = ${w.d} m`,
    hint:'Add the leg lengths shown on the route, then multiply the total by 50.',
    check:v=>{ if(near(v,w.d,0.5)) return ok(); if(near(v,w.cm,0.01)) return err('Scale',`${w.cm.toFixed(1)} is the map length in cm. Convert it: 1 cm on the map = 50 m.`);
      if(near(v,w.cm*5,0.5)||near(v,w.cm*500,0.5)||near(v,w.cm/50,0.01)) return err('Scale','Check the scale. Each map centimetre is 50 metres.');
      return err('Reading the evidence','Add every leg of the route on the map, then convert to metres.'); }});
  qs.push({id:w.code+'-t', type:'num', unit:'s', prompt:'How much time passed between the women fleeing at <b>10:27:00</b> and this sighting?', small:'Give your answer in seconds.',
    answerText: w.t>0?`${w.time} − 10:27:00 = ${w.t} s`:`10:25:00 is 2 minutes <i>before</i> 10:27:00, so −120 s`,
    hint:'Count from 10:27:00 to the sighting time. 1 minute = 60 seconds.',
    check:v=>{ if(near(v,w.t,0.5)) return ok();
      if(w.code==='B3' && near(v,420,0.5)) return err('Reading the evidence','The cover sheet says “approx. 10:34”, but in his statement he checked his phone: exactly 10:36. Use the most precise evidence.');
      if(w.code==='B2' && near(v,120,0.5)) return err('Reading the evidence','10:25 is before the women ran at 10:27. Should the time difference be positive?');
      if(w.code==='B2' && near(v,-2,0.01)) return err('Units','Right direction. Now give it in seconds.');
      if(w.t>0 && near(v,w.t/60,0.01)) return err('Units','That answer is in minutes. Speed in m/s needs the time in seconds.');
      return err('Reading the evidence','Find the sighting time in the statement and count on from 10:27:00, in seconds.'); }});
  if(w.t>0){
    const ex = w.v;
    qs.push({id:w.code+'-v', type:'num', unit:'m/s', prompt:'What average speed would someone need to get there by that time?', small:'Round to 2 decimal places.',
      answerText:`${w.d} ÷ ${w.t} = ${f2(ex)} m/s`,
      hint:'Speed = distance ÷ time. Use metres and seconds.',
      check:v=>{ if(near(v,ex,0.006)) return ok(); if(near(v,w.t/w.d,0.006)) return err('Formula','You divided time by distance. Speed = distance ÷ time.');
        if(near(v,w.d/(w.t/60),0.6)) return err('Units','That is metres per minute. Use the time in seconds.'); if(near(v,ex*3.6,0.06)) return err('Units','That is in km/h. The suspects’ speeds are in m/s.');
        if(near(v,w.cm/w.t,0.006)) return err('Scale','You used the map distance in cm. Use the real distance in metres.'); if(near(v,ex,0.06)) return err('Rounding','Nearly. Round to 2 decimal places.');
        return err('Formula','Speed = distance ÷ time.'); }});
  }
  qs.push({id:w.code+'-x', type:'choice', prompt:'Verdict: who did this witness see?', answerText:VLABEL[w.verdict],
    hint:`Compare the speed with each top speed (Suspect 1: 2.50 m/s, Suspect 2: 3.94 m/s), and the description with each profile.`,
    choices:()=>[{v:'S1',label:'Suspect 1'},{v:'S2',label:'Suspect 2'},{v:'X',label:'False lead'}],
    check:v=>{ if(v===w.verdict) return ok();
      if(w.code==='B2') return err('Reasoning','This sighting was before the women fled at 10:27. It cannot be either suspect.');
      if(v!=='X' && w.v>SPEED[v]) return err('Reasoning',`${f2(w.v)} m/s is faster than ${VLABEL[v]}’s top speed of ${f2(SPEED[v])} m/s. She couldn’t have got there in time.`);
      if(w.code==='A1') return err('Reasoning','Check the description too: running kit and orange trainers. Neither suspect matches.');
      if(v==='X') return err('Reasoning','The speed is possible, so this could be a real sighting. Check the description against the suspect profiles.');
      return err('Reading the evidence','Check the description: hair, height, build and bag.'); }});
  return qs;
}

function qHTML(q){
  const done = q.id in S.ans;
  const demo = S.demo ? `<div class="demo-a">Answer: ${q.answerText}</div>` : '';
  if(done){
    let shown = S.ans[q.id];
    if(q.type==='choice'){ const c=q.choices().find(c=>c.v===shown); shown=c?c.label:shown; }
    if(q.type==='cell'){ shown = shown.replace('|',', '); }
    return `<div class="q done"><div class="q-p">${q.prompt}</div><div class="q-a">✓ ${esc(shown)}${q.unit?' '+q.unit:''}</div></div>`;
  }
  let body = '';
  if(q.type==='num'){
    body = `<form class="q-row" data-q="${q.id}"><label class="q-in"><input id="in-${q.id}" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="${esc(S.draft[q.id]||'')}"><span>${q.unit||''}</span></label><button class="btn" type="submit">Check</button></form>`;
  } else if(q.type==='choice'){
    body = `<div class="choices">${q.choices().map(c=>`<button class="choice" data-q="${q.id}" data-v="${c.v}">${c.label}${c.sub?`<small>${c.sub}</small>`:''}</button>`).join('')}</div>`;
  } else if(q.type==='cell'){
    body = `<div class="note">Tap your answer in the running-speed table (Exhibit D1), under the suspect cards.</div>`;
  }
  const fb = S.fb[q.id] ? `<div class="fb" role="status"><b>${S.fb[q.id].type}</b>${S.fb[q.id].msg}</div>` : '';
  const hint = S.hinted[q.id] ? `<div class="hint">${q.hint}</div>` : `<div><button class="link" data-hint="${q.id}">Need a hint? (−3 points)</button></div>`;
  return `<div class="q"><div class="q-p">${q.prompt}${q.small?`<small>${q.small}</small>`:''}</div>${body}${fb}${hint}${demo}</div>`;
}
function qList(ids){
  let html='';

const app = document.getElementById('app');
function render(){
  QALL = allQs(); Object.keys(QALL).forEach(k=>QALL[k].id=QALL[k].id||k);
  const idx = SCENES.findIndex(s=>s[0]===S.scene);
  document.getElementById('steps').innerHTML = SCENES.map((s,i)=>`<li class="${i<idx?'done':i===idx?'now':''}">${s[1]}</li>`).join('');
  document.getElementById('pts').textContent = S.score;
  document.getElementById('demo').checked = S.demo;
  const fn = {cover:scCover,briefing:scBriefing,suspects:scSuspects,witnesses:scWitnesses,search:scSearch,pursuit:scPursuit,closed:scClosed}[S.scene];
  app.innerHTML = fn();
}
function go(scene){ S.scene=scene; if(scene==='briefing'&&!S.started) S.started=Date.now(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function answer(id, raw){
  const q = QALL[id]; if(!q || id in S.ans) return;
  let val = raw;
  if(q.type==='num'){ val = num(raw); if(val===null){ S.fb[id]={type:'Check',msg:'Type a number first.'}; render(); focusIn(id); return; } }
  const r = q.check(val);
  if(r.ok){ S.ans[id] = q.type==='num' ? String(raw).trim() : val; delete S.fb[id]; delete S.draft[id]; render(); focusNext(); }
  else {
    S.score = Math.max(0, S.score-5); S.wrong++;
    S.errors.push({q:id, type:r.type, msg:r.msg, where:whereOf(id)});
    S.fb[id] = {type:r.type, msg:r.msg};
    if(q.type==='num') S.draft[id]=raw;
    render(); focusIn(id);
  }
}
function whereOf(id){
  if(id.includes('-')){ const w=WIT.find(x=>x.code===id.split('-')[0]); return 'Statement '+w.code+' · '+w.name; }
  return {s2cell:'Suspect 2 speed',s2conv:'Suspect 2 conversion',s1cell:'Suspect 1 speed',s1conv:'Suspect 1 conversion',c1:'Search distance',c2:'Search radius',c3:'Search location',d1:'Station distance',d2:'Run time',d3:'Arrival time',d4:'The 10:41 train'}[id]||id;
}
function focusIn(id){ const el=document.getElementById('in-'+id); if(el){ el.focus(); el.select(); } }
function focusNext(){ const el=app.querySelector('.q:not(.done) input'); if(el) el.focus({preventScroll:true}); }

app.addEventListener('submit',e=>{ const f=e.target.closest('form[data-q]'); if(!f) return; e.preventDefault(); const id=f.dataset.q; answer(id, f.querySelector('input').value); });
app.addEventListener('input',e=>{ const f=e.target.closest('form[data-q]'); if(f) S.draft[f.dataset.q]=e.target.value; });
app.addEventListener('click',e=>{
  const t = e.target.closest('[data-go],[data-skip],[data-hint],[data-cell],[data-wit],[data-restart],.choice');
  if(!t) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.skip){ const d=app.querySelector(`[data-skipwrap="${t.dataset.skip}"]`)?.previousElementSibling; if(d) d.open=true; unlockTx(t.dataset.skip); return; }
  if(t.dataset.hint){ if(!S.hinted[t.dataset.hint]){ S.hinted[t.dataset.hint]=true; S.score=Math.max(0,S.score-3); S.errors.push({q:t.dataset.hint,type:'Hint used',msg:'Took a hint.',where:whereOf(t.dataset.hint)}); } render(); return; }
  if(t.dataset.cell){ const id=activeCell(); if(id) answer(id,t.dataset.cell); return; }
  if(t.dataset.wit){ S.active=t.dataset.wit; render(); return; }
  if(t.dataset.restart){ const demo=S.demo; S=fresh(); S.demo=demo; render(); window.scrollTo({top:0}); return; }
  if(t.classList.contains('choice')) answer(t.dataset.q, t.dataset.v);
});
app.addEventListener('keydown',e=>{ const t=e.target.closest('[data-wit]'); if(t && (e.key==='Enter'||e.key===' ') && t.tagName!=='BUTTON'){ e.preventDefault(); S.active=t.dataset.wit; render(); } });

/* ---------- boot ---------- */
const L=(new URLSearchParams(location.search).get('l')||'').replace(/[^a-z0-9-]/gi,'').slice(0,40), SUF=L?'.'+L:'';
const KEY='mfa.case01'+SUF;
const _render=render; render=function(){ _render(); try{ localStorage.setItem(KEY, JSON.stringify(S)); if(S.scene==='closed') localStorage.setItem('mfa.case.01'+SUF, JSON.stringify({closed:true, score:S.score})); }catch(_){} };
let saved=null; try{ saved=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(_){}
if(saved && saved.scene){ S=Object.assign(fresh(), saved); }
render();
})();
</script>
