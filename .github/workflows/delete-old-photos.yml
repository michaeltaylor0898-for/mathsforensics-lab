# Deletes photos of students' working once they're 7 days old (Forensic Marking), as the privacy policy promises.
# Marks and feedback stay; a photo is kept longer only while its dispute is open.
# Runs every day at 03:17 UK time (winter), or by hand from the Actions tab.
#
# Needs one repository secret: PURGE_KEY, exactly the same value as the PURGE_KEY Edge Function secret in Supabase.
name: Delete old marking photos

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Forensic Marking to delete photos older than 7 days
        env:
          PURGE_KEY: ${{ secrets.PURGE_KEY }}
        run: |
          if [ -z "$PURGE_KEY" ]; then echo "::error::Add the PURGE_KEY repository secret (same value as in Supabase)."; exit 1; fi
          body=$(jq -n --arg key "$(printf '%s' "$PURGE_KEY" | tr -d '[:space:]')" '{action:"purge", key:$key}')
          out=$(curl -sS --fail-with-body -X POST "https://duvxykqlrekqhfvsvnrj.supabase.co/functions/v1/mark-written" \
                -H "Content-Type: application/json" -d "$body") || { echo "::error::Purge failed: $out"; exit 1; }
          echo "Done: $out"
